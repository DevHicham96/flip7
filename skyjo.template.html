<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Skyjo · le moins de points gagne</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e7490'/%3E%3Ctext x='32' y='47' font-size='42' font-weight='700' font-family='Arial,sans-serif' text-anchor='middle' fill='%23fef08a'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Poppins:wght@400;500;600;700&display=swap">
<style>:root{--bg1:#053a4e;--bg2:#0e7c86;--pur:#0e7c86;--pur2:#064e5a;--yel:#FFD23F;--yel2:#F5A800;--ink:#1f1650;--ink2:#6a5fa8;--card:#fff;--blue:#3B82F6;--f-display:'Baloo 2','Fredoka',system-ui,sans-serif;--f-body:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html{background:#053a4e}
body{margin:0;color:#fff;font:15px/1.45 var(--f-body);padding:12px max(12px,env(safe-area-inset-right)) 90px max(12px,env(safe-area-inset-left));min-height:100vh;position:relative;background:radial-gradient(circle at 12% 8%,rgba(34,170,160,.6) 0 18%,transparent 40%),radial-gradient(circle at 92% 92%,rgba(59,130,246,.55) 0 14%,transparent 38%),linear-gradient(160deg,var(--bg1),var(--bg2) 70%,#2aa69a);background-attachment:fixed}
body::before,body::after{content:'';position:fixed;z-index:0;pointer-events:none;border-radius:50%}
body::before{width:260px;height:260px;right:-80px;top:14%;background:var(--yel);opacity:.9;box-shadow:inset -30px -20px 0 rgba(245,168,0,.55)}
body::after{width:150px;height:150px;left:-50px;bottom:12%;border:26px solid var(--blue);opacity:.55}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;display:grid;gap:14px}
h1,h2,h3,p{margin:0}
h2{font:800 24px var(--f-display);color:var(--yel);letter-spacing:.01em}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.25);border-radius:20px;padding:8px 14px}
.brand{font:800 28px var(--f-display);color:var(--yel);margin-right:auto;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.brand small{display:block;font:600 11px var(--f-body);letter-spacing:.18em;color:#cdc3ff;text-transform:uppercase;text-shadow:none}
.btn{font:700 15px var(--f-body);min-height:46px;border-radius:99px;border:0;background:#fff;color:var(--pur2);padding:0 22px;cursor:pointer;box-shadow:0 5px 0 #b9acff;transition:transform .08s,box-shadow .08s,filter .15s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover:not(:disabled){filter:brightness(1.05)}.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #b9acff}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;font-size:13px;padding:0 14px;box-shadow:0 3px 0 #b9acff}
.btn.primary{background:linear-gradient(#FFE066,var(--yel));color:#3b2a00;box-shadow:0 5px 0 var(--yel2)}.btn.primary:active:not(:disabled){box-shadow:0 1px 0 var(--yel2)}
.panel{background:#fff;color:var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--pur2),0 18px 30px rgba(10,5,60,.4);padding:20px;display:grid;gap:12px;width:100%;max-width:760px;margin-inline:auto}
.panel h2{color:var(--pur)}
.muted{color:var(--ink2);font-size:14px}.top .muted,.qfoot .muted,.qhead .muted{color:inherit}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.rcard{display:grid;gap:6px;text-align:left;padding:14px;border-radius:20px;border:3px solid #e4dcff;background:#f6f2ff;color:var(--ink);cursor:pointer;font:inherit;min-height:104px;align-content:start;transition:transform .15s,border-color .15s}
.rcard:hover:not(:disabled){border-color:var(--pur);transform:translateY(-3px)}.rcard:disabled{opacity:.55;cursor:not-allowed}.rcard b{font:800 20px var(--f-display);color:var(--pur)}
.st{font:700 12px var(--f-body);padding:3px 10px;border-radius:99px;width:max-content;background:#e4dcff;color:var(--pur2)}.st.free{background:#d4f7e6;color:#13774a}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-weight:600}
.seg{display:inline-flex;border:3px solid #e4dcff;border-radius:99px;overflow:hidden;background:#f6f2ff}.seg button{border:0;background:transparent;color:var(--pur2);font:700 14px var(--f-body);padding:8px 16px;cursor:pointer}.seg button.on{background:var(--pur);color:#fff}
.pl{display:flex;align-items:center;gap:10px;background:#f6f2ff;border-radius:99px;padding:6px 14px 6px 6px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 16px var(--f-display);color:#fff;flex:none;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.av.has{background:none!important;overflow:hidden}.av svg{width:100%;height:100%;display:block}
.pl b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input.t{min-height:46px;border-radius:99px;border:3px solid #e4dcff;background:#f6f2ff;color:var(--ink);font:600 16px var(--f-body);padding:0 18px;width:100%}
input.t:focus{outline:0;border-color:var(--pur)}
.rules{display:grid;gap:4px;font-size:14px;color:var(--ink2);background:#f6f2ff;border-radius:18px;padding:10px 14px}.rules b{color:var(--pur)}
.pchip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:99px;padding:3px 12px 3px 4px;color:#fff;font:700 13px var(--f-body);min-height:36px}
.pchip .av{width:28px;height:28px;font-size:12px;border-width:2px}.pchip b{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err{color:#d12b3a;font-weight:700}
.fxban{position:fixed;left:50%;top:max(90px,12vh);transform:translateX(-50%);padding:10px 22px;border-radius:999px;background:#fff;color:var(--pur2);font:800 clamp(14px,3.4vw,20px) var(--f-display);box-shadow:0 8px 0 var(--yel),0 14px 30px rgba(0,0,0,.35);white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;animation:fxban 2.2s ease-out forwards;z-index:200}
@keyframes fxban{0%{opacity:0;transform:translate(-50%,-20px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:130;pointer-events:none;border-radius:2px;animation:cf 3s linear forwards}
@keyframes cf{to{top:105vh;rotate:720deg}}
.stack{display:grid;gap:10px}.ctr{text-align:center;justify-content:center}
.bigtxt{font:800 22px var(--f-display);color:var(--pur);text-align:center}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.cat{display:grid;justify-items:center;gap:2px;padding:10px 6px;border-radius:20px;border:3px solid #e4dcff;background:#f6f2ff;color:var(--ink);cursor:pointer;font:inherit;min-height:76px;transition:transform .12s}
.cat .ce{font-size:28px;line-height:1}.cat b{font:700 12.5px var(--f-body);text-align:center}
.cat:hover{transform:translateY(-2px)}.cat.on{border-color:var(--pur);background:var(--pur);color:#fff;box-shadow:0 5px 0 var(--pur2)}
.lobgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.lobgrid .panel{max-width:none}
.qr{width:min(250px,100%);margin:0 auto;background:#fff;padding:10px;border-radius:20px;border:4px solid var(--yel);box-shadow:0 6px 0 var(--yel2)}
.qr svg{display:block;width:100%;height:auto}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font:700 14px var(--f-body)}
.qhead .qn{background:var(--yel);color:#3b2a00;border-radius:99px;padding:5px 16px;box-shadow:0 3px 0 var(--yel2)}
.qhead .qcat{background:rgba(255,255,255,.16);border-radius:99px;padding:5px 14px}
.qhead .qs{background:rgba(255,255,255,.16);border-radius:99px;padding:5px 14px}.qhead .qs b{color:var(--yel);font:800 18px var(--f-display)}
.tm{display:flex;align-items:center;gap:10px}
.tbwrap{flex:1;height:16px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.tbar{height:100%;transform-origin:left;background:linear-gradient(90deg,var(--yel2),var(--yel));border-radius:99px;transition:transform .25s linear}
.tnum{min-width:56px;text-align:center;font:800 24px var(--f-display);color:#3b2a00;background:var(--yel);border-radius:99px;padding:2px 10px;box-shadow:0 4px 0 var(--yel2)}
.qcard{background:#fff;color:var(--ink);border-radius:30px;box-shadow:0 8px 0 var(--pur2),0 18px 30px rgba(10,5,60,.4);padding:clamp(18px,3.4vw,32px);text-align:center;min-height:110px;display:grid;place-items:center;position:relative;border:4px solid var(--yel)}
.qcard h2{font:800 clamp(20px,4.4vw,32px)/1.2 var(--f-display);color:var(--ink)}
.ansg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{position:relative;display:flex;align-items:center;gap:12px;min-height:clamp(62px,12vh,100px);border-radius:24px;border:0;background:#fff;color:var(--ink);font:700 clamp(14px,3.3vw,20px)/1.2 var(--f-body);text-align:left;padding:10px 16px 10px 10px;cursor:pointer;box-shadow:0 6px 0 rgba(20,10,90,.55);transition:transform .08s,opacity .2s,box-shadow .08s}
.ans i{font:800 1.25em var(--f-display);font-style:normal;flex:none;width:2em;height:2em;border-radius:50%;display:grid;place-items:center;color:#fff}
.ans.a0 i{background:#6c3df0}.ans.a1 i{background:#3B82F6}.ans.a2 i{background:#F5A800}.ans.a3 i{background:#E5484D}
.ans span{flex:1;min-width:0;overflow-wrap:anywhere}
.ans:hover:not(:disabled){transform:translateY(-3px)}.ans:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 rgba(20,10,90,.55)}
.ans:disabled{cursor:default}.ans.chosen{background:#efe9ff;outline:4px solid var(--yel);outline-offset:2px}
.ans.dim{opacity:.4}.ans.good{background:#d6f9e6;outline:4px solid #2FB67C;outline-offset:2px;animation:okp .6s ease-out}
.ans em{font:800 .95em var(--f-display);font-style:normal;background:#e4dcff;color:var(--pur2);border-radius:99px;padding:2px 12px}
.ans u{text-decoration:none;font-size:1.5em;color:#13774a}
@keyframes okp{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:none}}
.qfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-weight:600}
.rmsg{text-align:center;font:800 clamp(18px,4vw,26px) var(--f-display);padding:10px 16px;border-radius:99px;animation:cpop2 .4s both;box-shadow:0 6px 0 rgba(0,0,0,.25)}
@keyframes cpop2{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rmsg.ok{background:#2FB67C;color:#fff}.rmsg.bad{background:#E5484D;color:#fff}.rmsg b{color:var(--yel)}
.lbp{max-width:560px}.lbp h2{font-size:20px}
.lb{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lb li{display:flex;align-items:center;gap:8px;background:#f6f2ff;border-radius:99px;padding:5px 14px 5px 8px;color:var(--ink)}
.lb li.me{background:#fff3c4;box-shadow:inset 0 0 0 3px var(--yel)}
.lb li i{font:800 16px var(--f-display);font-style:normal;width:26px;text-align:center;color:var(--pur)}
.lb li b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .av{width:30px;height:30px;font-size:13px;border-width:2px}
.lb em{font:800 14px var(--f-body);font-style:normal;color:#13774a}.lb .stk{font-size:13px;font-weight:700}
.lb .pts{font:800 19px var(--f-display);color:var(--pur);min-width:58px;text-align:right}
.endp .podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:6px 0 4px;min-height:210px}
.pod{display:grid;justify-items:center;gap:4px;width:min(120px,28%);text-align:center;color:var(--ink)}
.pod b{font:700 14px var(--f-body);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pod span{font:800 18px var(--f-display);color:var(--pur)}
.pod .pm{font-size:34px}.pod .bar{width:100%;border-radius:14px 14px 0 0;background:linear-gradient(var(--yel),var(--yel2));animation:grow .9s cubic-bezier(.2,1,.3,1) both;transform-origin:bottom}
.pod.p1 .bar{height:120px}.pod.p2 .bar{height:84px;background:linear-gradient(#a58bff,var(--pur))}.pod.p3 .bar{height:56px;background:linear-gradient(#7cb2ff,var(--blue))}
@keyframes grow{from{transform:scaleY(0)}}
/* discussion légère */
.qchat{position:fixed;right:14px;bottom:14px;z-index:150;display:grid;justify-items:end;gap:10px}
.qc-fab{position:relative;width:56px;height:56px;border-radius:50%;border:0;background:var(--yel);font-size:26px;cursor:pointer;box-shadow:0 5px 0 var(--yel2),0 10px 20px rgba(0,0,0,.35);display:grid;place-items:center}
.qc-fab:active{transform:translateY(3px)}
.ubadge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:#E5484D;color:#fff;font:800 11px var(--f-body);padding:0 5px;border:2px solid #fff}
.qc-fab .ubadge{position:absolute;right:-4px;top:-4px}
.qc-pop{width:min(320px,calc(100vw - 28px));height:min(420px,62vh);background:#fff;color:var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--pur2),0 18px 34px rgba(0,0,0,.45);display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;overflow:hidden}
.qc-h{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--pur);color:#fff;font:800 16px var(--f-display)}
.qc-x{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:50%;width:28px;height:28px;cursor:pointer}
#ch-list{list-style:none;margin:0;padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0;overscroll-behavior:contain}
#ch-list li.msg{display:flex;gap:8px;align-items:flex-start;max-width:92%}
#ch-list li.msg.me{align-self:flex-end;flex-direction:row-reverse}
#ch-list li.msg.same{margin-top:-3px}#ch-list li.msg.same .mb{margin-left:36px}#ch-list li.msg.me.same .mb{margin-left:0;margin-right:36px}
#ch-list .mav{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 13px var(--f-display);flex:none}
#ch-list .mh{display:flex;gap:6px;align-items:baseline;font-size:11px;color:var(--ink2)}#ch-list .mh time{opacity:.7}
#ch-list li.me .mh{justify-content:flex-end}
#ch-list .mt{background:#f0ebff;border-radius:4px 14px 14px 14px;padding:5px 10px;font-size:14px;overflow-wrap:anywhere}
#ch-list li.me .mt{background:var(--yel);color:#3b2a00;border-radius:14px 4px 14px 14px}
#ch-list li.big .mt{background:none;font-size:32px;line-height:1.1;padding:0 4px}
#ch-list li.rx{align-self:center;font-style:italic;color:var(--ink2);font-size:12px}
.qc-e{display:flex;gap:2px;justify-content:space-around;padding:2px 6px;border-top:1px solid #eee}.qc-e button{border:0;background:none;font-size:20px;cursor:pointer;padding:2px 4px;border-radius:8px}.qc-e button:hover{background:#f0ebff}
#ch-form{display:flex;gap:6px;padding:8px;border-top:1px solid #eee}
#ch-in{flex:1;min-width:0;min-height:42px;border-radius:99px;border:2px solid #e4dcff;background:#f6f2ff;color:var(--ink);font:500 15px var(--f-body);padding:0 14px}
#ch-in:focus{outline:0;border-color:var(--pur)}
.ch-send{width:42px;height:42px;border-radius:50%;border:0;background:var(--pur);color:#fff;font-size:16px;cursor:pointer;flex:none}
#ch-toasts{position:fixed;right:84px;bottom:20px;z-index:149;display:grid;gap:6px;pointer-events:none;max-width:min(260px,64vw);justify-items:end}
.ch-toast{background:#fff;color:var(--ink);border-radius:18px;padding:6px 12px;font-size:13px;animation:tin .25s ease-out;box-shadow:0 5px 0 var(--pur2);overflow-wrap:anywhere}.ch-toast b{color:var(--pur)}
.ch-toast.out{opacity:0;transform:translateY(-6px);transition:.4s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
/* chargement */
.gload{position:fixed;inset:0;z-index:300;display:grid;place-items:center;align-content:center;gap:20px;background:linear-gradient(160deg,var(--bg1),var(--bg2) 70%,#2aa69a);overflow:hidden;transition:opacity .25s ease,visibility .25s;font-family:var(--f-display)}
.gload.out{opacity:0;visibility:hidden}
.gload .lg-cloud{display:none}
.gload .lg-fan{position:relative;width:170px;height:140px}
.gload .lg-fan i{position:absolute;left:50%;bottom:0;width:62px;height:62px;margin-left:-31px;border-radius:50%;display:grid;place-items:center;font:800 28px var(--f-display);font-style:normal;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25);animation:lgb 1.2s ease-in-out infinite}
.gload i:nth-child(1){--x:-72px;background:#6c3df0}.gload i:nth-child(2){--x:-36px;background:#3B82F6}.gload i:nth-child(3){--x:0px;background:var(--yel);color:#3b2a00}.gload i:nth-child(4){--x:36px;background:#E5484D}.gload i:nth-child(5){--x:72px;background:#2FB67C}
.gload .lg-fan i:nth-child(2){animation-delay:.12s}.gload .lg-fan i:nth-child(3){animation-delay:.24s}.gload .lg-fan i:nth-child(4){animation-delay:.36s}.gload .lg-fan i:nth-child(5){animation-delay:.48s}
.gload .lg-fan i{transform:translateX(var(--x))}
@keyframes lgb{0%,100%{transform:translate(var(--x),0)}50%{transform:translate(var(--x),-26px)}}
.gload .lg-sign{font:800 clamp(26px,7vw,38px) var(--f-display);color:var(--yel);letter-spacing:.05em}
.gload .lg-sign b{display:inline-block;animation:lgdot 1.2s infinite}.gload .lg-sign b:nth-of-type(2){animation-delay:.2s}.gload .lg-sign b:nth-of-type(3){animation-delay:.4s}
@keyframes lgdot{0%,70%,100%{opacity:.25}35%{opacity:1;transform:translateY(-4px)}}
.gload .lg-bar{width:min(260px,64vw);height:12px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.gload .lg-bar::after{content:'';display:block;height:100%;width:42%;border-radius:99px;background:var(--yel);animation:lgbar 1.2s ease-in-out infinite}
@keyframes lgbar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (max-width:560px){.ansg{gap:8px}.lobgrid{grid-template-columns:1fr}.brand{font-size:24px}.panel{padding:16px;border-radius:24px}body::before{width:170px;height:170px;right:-60px}}
@media (prefers-reduced-motion:reduce){.pod .bar,.ans.good,.rmsg,.gload i,.gload .lg-bar::after,.gload .lg-sign b{animation:none}}
.ans span{overflow-wrap:break-word}
.ans em{position:absolute;right:10px;top:-10px;font-size:.8em;padding:0 10px;box-shadow:0 2px 0 #b9acff;background:#fff}
.ans u{position:absolute;right:-6px;bottom:-12px;background:#fff;border-radius:50%;width:1.5em;height:1.5em;line-height:1.5em;text-align:center;font-size:1.2em;box-shadow:0 3px 0 #2FB67C}
.ans.good{overflow:visible}.ans{overflow:visible}
.qchat{width:min(320px,calc(100vw - 28px))}.qc-pop{width:100%}.qc-fab{justify-self:end}
#ch-form,.qc-pop *{min-width:0}

/* ===== Skyjo ===== */
.stbar{text-align:center;background:rgba(255,255,255,.14);border-radius:99px;padding:8px 16px;font:800 clamp(14px,3.6vw,18px) var(--f-display)}
.stbar.mine{background:var(--yel);color:#3b2a00;box-shadow:0 4px 0 var(--yel2);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
.opps{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.bd{display:grid;gap:6px;background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.2);border-radius:20px;padding:8px 10px}
.bd.turn{border-color:var(--yel);box-shadow:0 0 0 3px rgba(255,210,63,.4)}
.bd.mine{background:rgba(255,255,255,.16);justify-self:center}
.bh{display:flex;align-items:center;gap:6px;font:700 13px var(--f-body)}.bh b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}

<script>
/*ENGINE_START*/
const SK_GONE=-99;
function skDeck(){const d=[];for(let i=0;i<5;i++)d.push(-2);for(let i=0;i<10;i++)d.push(-1);for(let i=0;i<15;i++)d.push(0);for(let v=1;v<=12;v++)for(let i=0;i<10;i++)d.push(v);return d;}
function skShuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const skNm=(s,id)=>(s.players.find(p=>p.id===id)||{name:'?'}).name;
const skLog=(s,t)=>{s.log.push(t);if(s.log.length>30)s.log.shift();};
function skDeal(s){
  s.deck=skShuffle(skDeck());s.discard=[s.deck.pop()];
  s.cards={};s.up={};
  s.players.forEach(p=>{s.cards[p.id]=s.deck.splice(0,12);s.up[p.id]=Array(12).fill(0);});
  s.phase='init';s.flips=0;s.held=null;s.src='';s.last='';s.left=[];s.res=null;s.turn=s.round%s.players.length;
}
function skNew(players,target){
  const s={v:1,rev:1,gid:Date.now().toString(36)+Math.random().toString(36).slice(2,6),target:target||100,round:0,
    players:players.map(p=>({id:p.id,name:p.name,av:p.av||'',bot:!!p.bot})),totals:{},turn:0,log:[]};
  s.players.forEach(p=>{s.totals[p.id]=0;});
  skDeal(s);skLog(s,'Manche 1 : chacun retourne 2 cartes.');return s;
}
const skCur=s=>s.players[s.turn].id;
const skCan=(s,pid)=>(s.phase==='init'||s.phase==='turn')&&skCur(s)===pid;
const skTop=s=>s.discard[s.discard.length-1];
function skRefill(s){
  if(s.deck.length)return;
  const top=s.discard.pop();s.deck=skShuffle(s.discard);s.discard=[top];skLog(s,'La pioche est remélangée.');
}
function skCheckCols(s,pid){
  const c=s.cards[pid],u=s.up[pid];let got=0;
  for(let col=0;col<4;col++){
    const i=[col,col+4,col+8];
    if(i.every(k=>u[k]===1&&c[k]!==SK_GONE)&&c[i[0]]===c[i[1]]&&c[i[1]]===c[i[2]]){
      s.discard.unshift(c[i[0]],c[i[1]],c[i[2]]);
      i.forEach(k=>{c[k]=SK_GONE;u[k]=1;});got++;
      skLog(s,skNm(s,pid)+' retire une colonne de '+s.discard[0]+' !');
    }
  }
  return got;
}
const skAllUp=(s,pid)=>s.up[pid].every(x=>x===1);
function skNext(s){
  const pid=skCur(s);
  if(s.last===''&&skAllUp(s,pid)){s.last=pid;s.left=s.players.map(p=>p.id).filter(x=>x!==pid);skLog(s,skNm(s,pid)+' a tout retourné : dernier tour pour les autres !');}
  else if(s.last!==''){s.left=s.left.filter(x=>x!==pid);}
  if(s.last!==''&&s.left.length===0){skScore(s);return;}
  let j=(s.turn+1)%s.players.length;
  if(s.last!==''){let g=0;while(!s.left.includes(s.players[j].id)&&g++<20)j=(j+1)%s.players.length;}
  s.turn=j;s.held=null;s.src='';s.rev++;
}
function skFlipInit(s,pid,idx){
  if(s.phase!=='init'||!skCan(s,pid)||s.up[pid][idx]===1)return false;
  s.up[pid][idx]=1;s.flips++;
  const per=s.flips%2;
  if(per===0){
    s.rev++;
    if(s.flips>=s.players.length*2){
      let best=-99,bi=0;s.players.forEach((p,i)=>{const sm=s.cards[p.id].reduce((a,v,k)=>a+(s.up[p.id][k]?v:0),0);if(sm>best){best=sm;bi=i;}});
      s.turn=bi;s.phase='turn';skLog(s,skNm(s,s.players[bi].id)+' commence (plus grosse somme).');
    }else s.turn=(s.turn+1)%s.players.length;
  }
  s.rev++;return true;
}
/* piocher : la carte piochée est tenue en main */
function skDraw(s,pid){
  if(s.phase!=='turn'||!skCan(s,pid)||s.held!==null)return false;
  skRefill(s);s.held=s.deck.pop();s.src='deck';s.rev++;return true;
}
/* remplacer la carte idx par la carte tenue (ou la défausse si on la prend) */
function skPlace(s,pid,idx,fromDiscard){
  if(s.phase!=='turn'||!skCan(s,pid))return false;
  const c=s.cards[pid];if(c[idx]===SK_GONE)return false;
  let card;
  if(fromDiscard){if(s.held!==null)return false;card=s.discard.pop();}
  else{if(s.held===null)return false;card=s.held;}
  const old=c[idx];c[idx]=card;s.up[pid][idx]=1;s.discard.push(old);s.held=null;
  skLog(s,skNm(s,pid)+' met '+card+' à la place de '+old+'.');
  skCheckCols(s,pid);skNext(s);return true;
}
/* défausser la carte piochée et retourner une carte cachée */
function skDiscardFlip(s,pid,idx){
  if(s.phase!=='turn'||!skCan(s,pid)||s.held===null||s.src!=='deck')return false;
  if(s.up[pid][idx]===1)return false;
  s.discard.push(s.held);s.held=null;s.up[pid][idx]=1;
  skLog(s,skNm(s,pid)+' défausse et retourne '+s.cards[pid][idx]+'.');
  skCheckCols(s,pid);skNext(s);return true;
}
function skScore(s){
  const raw={};s.players.forEach(p=>{raw[p.id]=s.cards[p.id].reduce((a,v)=>a+(v===SK_GONE?0:v),0);s.up[p.id]=Array(12).fill(1);});
  const fin=s.last,res={raw:raw,add:{},doubled:false};
  const others=s.players.filter(p=>p.id!==fin).map(p=>raw[p.id]);
  let add=Object.assign({},raw);
  if(fin&&others.some(v=>v<=raw[fin])&&raw[fin]>0){add[fin]=raw[fin]*2;res.doubled=true;}
  s.players.forEach(p=>{s.totals[p.id]+=add[p.id];});
  res.add=add;s.res=res;
  const mx=Math.max(...s.players.map(p=>s.totals[p.id]));
  s.phase=mx>=s.target?'end':'roundEnd';
  skLog(s,'Fin de la manche '+(s.round+1)+'.');s.rev++;
}
function skNextRound(s){
  if(s.phase!=='roundEnd')return false;
  s.round++;skDeal(s);skLog(s,'Manche '+(s.round+1)+' : chacun retourne 2 cartes.');s.rev++;return true;
}
/* ---- bots ---- */
function skKnown(s,pid){const c=s.cards[pid],u=s.up[pid];return c.map((v,i)=>v===SK_GONE?null:(u[i]?v:undefined));}
function skBot(s,pid){
  const k=skKnown(s,pid),hidden=k.map((v,i)=>v===undefined?i:-1).filter(i=>i>=0),ups=k.map((v,i)=>typeof v==='number'?i:-1).filter(i=>i>=0);
  if(s.phase==='init'){return{a:'init',i:hidden[Math.floor(Math.random()*hidden.length)]};}
  const AV=5;
  const bestRep=card=>{ // meilleur indice de remplacement + gain attendu
    let bi=-1,bg=-99;
    ups.forEach(i=>{const g=k[i]-card;if(g>bg){bg=g;bi=i;}});
    hidden.forEach(i=>{const g=AV-card;if(g>bg){bg=g;bi=i;}});
    // colonne à compléter
    for(let col=0;col<4;col++){const idx=[col,col+4,col+8],vals=idx.map(i=>k[i]);const same=idx.filter(i=>vals[idx.indexOf(i)]===card);const oth=idx.filter(i=>k[i]!==card&&k[i]!==null);if(same.length===2&&oth.length===1&&k[oth[0]]!==undefined){return{i:oth[0],g:20};}}
    return{i:bi,g:bg};
  };
  if(s.held===null){
    const top=skTop(s),r=bestRep(top);
    if(r.g>=3||top<=0&&r.i>=0)return{a:'disc',i:r.i};
    return{a:'draw'};
  }
  const r=bestRep(s.held);
  if(r.g>=2||hidden.length===0)return{a:'place',i:r.i<0?ups[0]:r.i};
  return{a:'flip',i:hidden[Math.floor(Math.random()*hidden.length)]};
}
function skBotStep(s,pid){
  const b=skBot(s,pid);
  if(b.a==='init')return skFlipInit(s,pid,b.i);
  if(b.a==='draw')return skDraw(s,pid);
  if(b.a==='disc')return skPlace(s,pid,b.i,true);
  if(b.a==='place')return skPlace(s,pid,b.i,false);
  if(b.a==='flip')return skDiscardFlip(s,pid,b.i);
  return false;
}
/*ENGINE_END*/

const hostId=()=>{if(mode==='solo')return uid;if(!S)return (roomPlayers(ROOM)[0]||{}).id;const on=new Set(roomPlayers(ROOM).map(p=>p.id));return(S.players.find(p=>on.has(p.id))||S.players[0]).id;};
const isHost=()=>hostId()===uid;
const isAdmin=()=>mySlug==='hitch';const isHostUI=()=>isHost()||isAdmin();
function banner(text,color){const d=h('div',{class:'fxban',style:'--g:'+(color||'#FFE066')},text);document.body.append(d);setTimeout(()=>d.remove(),2300);}
function confetti(){
  if(REDUCE)return;const cols=['#FFE066','#FF8A3D','#7CE7B0','#4D8DF7','#ff5a5f','#c28bff'];
  for(let i=0;i<70;i++){const d=h('i',{class:'cf',style:'left:'+Math.random()*100+'vw;background:'+cols[i%cols.length]+';animation-delay:'+Math.random()*.8+'s;animation-duration:'+(2.2+Math.random()*1.6)+'s;transform:rotate('+Math.random()*360+'deg)'});document.body.append(d);setTimeout(()=>d.remove(),4800);}
}
async function loadFirebase(cfg){
  const V='10.14.1',B='https://www.gstatic.com/firebasejs/'+V+'/';
  const [A,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js')]);
  return makeDbFromSdk(F,F.getFirestore(A.initializeApp(cfg)));
}
const myTurn=()=>!!S&&!isSpec()&&skCan(S,uid);
/* ---- salle ---- */
function myDoc(){return{name:myName||'Joueur',t:(roster.find(p=>p.id===uid)||{}).t||Date.now(),seen:Date.now(),room:BASE+ROOM,sk:1,pf:mySlug,av:myAv};}
function beat(){if(!db||!ROOM)return;if(document.hidden)return;db.doc('lobby/sk_'+uid).set(myDoc()).catch(()=>{});}
function joinRoom(n){
  if(!db)return;
  if(!myName||myName.trim().length<2){pendingJoin=n;render();return;}
  pendingJoin=0;ROOM=n;mode='online';S=null;pickMode='';
  db.doc('lobby/sk_'+uid).set(Object.assign(myDoc(),{t:Date.now()})).catch(()=>{});
  if(stateUnsub){stateUnsub();stateUnsub=null;}
  stateUnsub=db.doc(gp(n)).onSnapshot(sn=>{onState(sn.exists?sn.data():null);},()=>{});
  clearInterval(hb);hb=setInterval(beat,25000);
  try{history.replaceState(null,'',location.pathname+'?table='+n);}catch(e){}
  chatRoomChanged();render();
}
function leaveRoom(){
  if(db&&ROOM)db.doc('lobby/sk_'+uid).delete().catch(()=>{});
  if(stateUnsub){stateUnsub();stateUnsub=null;}
  clearInterval(hb);hb=null;ROOM=0;mode=null;S=null;pickMode='';
  try{history.replaceState(null,'',location.pathname);}catch(e){}
  chatRoomChanged();render();
}
const joinUrl=()=>location.origin+location.pathname+'?table='+ROOM;
function startOnline(){
  const ps=roomPlayers(ROOM).slice(0,MAXP);if(ps.length<MINP)return;
  commit(skNew(ps.map(p=>({id:p.id,name:p.name,av:p.av})),cfg.target));
}
function startSolo(){
  const names=['Karim','Yasmine','Omar','Salma','Nour','Adam','Lina'];
  const ps=[{id:uid,name:myName||'Moi',av:myAv}].concat([...Array(cfg.bots)].map((_,i)=>({id:'bot'+i,name:names[i]+' 🤖',bot:true,av:AVATARS[(i*7+3)%AVATARS.length]})));
  mode='solo';ROOM=0;pickMode='';commit(skNew(ps,cfg.target));
}
const seenLive=new Set();
function commit(s){
  s.ts=Date.now();seenLive.add(s.gid);S=s;onLocalChange();render();
  if(mode==='online'){const c=CLONE(s);chain=chain.then(()=>db.doc(gp(ROOM)).set(c)).catch(()=>banner('Action non envoyée, réessaie.','#E5484D'));}
}
function onState(d){
  const prev=S;
  if(!d){if(mode==='online'){S=null;render();}return;}
  if(prev&&d.rev<prev.rev&&d.gid===prev.gid)return;
  if(!prev||prev.gid!==d.gid){
    if((d.phase==='end'||Date.now()-(d.ts||0)>600000)&&!seenLive.has(d.gid)){if(prev){S=null;render();}return;}
  }
  if(d.phase!=='end')seenLive.add(d.gid);
  S=d;onLocalChange();render();
}
function onLocalChange(){
  if(!S)return;
  const k=S.gid+':'+S.rev;if(k===lastTurnKey)return;lastTurnKey=k;
  if(S.phase==='roundEnd')Snd.play('ok');
  if(S.phase==='end'&&celebrated!==S.gid){celebrated=S.gid;Snd.play('win');setTimeout(confetti,300);}
}
/* ---- actions ---- */
function apply(fn){
  if(!S)return;const s=CLONE(S);
  if(fn(s)){pickMode='';commit(s);}
}
function clickCell(i){
  if(!myTurn())return;
  if(S.phase==='init'){apply(s=>skFlipInit(s,uid,i));Snd.play('place');return;}
  if(pickMode==='disc'&&S.held===null){apply(s=>skPlace(s,uid,i,true));Snd.play('take');return;}
  if(S.held!==null){
    if(pickMode==='flip'){apply(s=>skDiscardFlip(s,uid,i));Snd.play('place');return;}
    apply(s=>skPlace(s,uid,i,false));Snd.play('take');
  }
}
function clickDeck(){if(!myTurn()||S.phase!=='turn'||S.held!==null)return;pickMode='';apply(s=>skDraw(s,uid));Snd.play('place');}
function clickDiscard(){
  if(!myTurn()||S.phase!=='turn')return;
  if(S.held===null){pickMode=pickMode==='disc'?'':'disc';render();}
}
function setFlip(){if(myTurn()&&S.held!==null&&S.src==='deck'){pickMode=pickMode==='flip'?'':'flip';render();}}
function nextRound(){apply(s=>skNextRound(s));}
let botBusy=false;
function botTick(){
  if(!S||botBusy)return;
  if(mode==='online'&&!isHost())return;
  if(S.phase!=='init'&&S.phase!=='turn')return;
  const p=S.players[S.turn];
  if(!p.bot){
    /* hôte : si un joueur humain absent bloque la partie, on ne fait rien */
    return;
  }
  botBusy=true;
  setTimeout(()=>{botBusy=false;if(!S)return;const q=S.players[S.turn];if(!q.bot)return;apply(s=>skBotStep(s,q.id));},S.phase==='init'?600:1100);
}
function endGameHost(){if(mode==='solo'){leaveRoom();return;}db.doc(gp(ROOM)).delete().catch(()=>{});}
/* ---- rendus ---- */
function avEl(p,cls){const a=validAv(p.av)?p.av:null;const e=h('span',{class:'av'+(cls?' '+cls:''),style:'background:hsl('+hue(p.id)+' 45% 38%)'});if(a){e.innerHTML=avSVGa(a);e.classList.add('has');}else e.textContent=(p.name||'?')[0].toUpperCase();return e;}
function renderTop(sub,right){
  const chip=myName?h('span',{class:'pchip'},avEl({id:mySlug||uid,name:myName,av:myAv},'sm'),h('b',null,myName)):null;
  const jeux=h('a',{class:'btn sm',href:'index.html#jeux'},'🎮 Jeux');
  jeux.addEventListener('click',ev=>{ev.preventDefault();showLoader('f7');setTimeout(()=>{location.href='index.html#jeux';},250);});
  return h('div',{class:'top'},h('div',{class:'brand'},'SKYJO',h('small',null,sub||'Le moins de points gagne')),
    right||null,chip,h('button',{class:'btn sm',type:'button',onclick:()=>{Snd.set(!Snd.on);render();}},Snd.on?'🔊 Sons':'🔇 Sons'),jeux);
}
function render(){
  const app=$('app');let view;
  if(!mode)view=renderPicker();else if(mode==='online'&&!S)view=renderLobby();else view=renderGame();
  const keep=document.activeElement&&document.activeElement.id==='nm-in'?{v:document.activeElement.value,s:document.activeElement.selectionStart}:null;
  app.replaceChildren(h('div',{class:'wrap'},view));
  if(keep){const i=$('nm-in');if(i){i.focus();i.value=keep.v;try{i.setSelectionRange(keep.s,keep.s);}catch(e){}}}
  const fab=$('rdchat');if(fab)fab.hidden=mode!=='online';
  botTick();
}
const segEl=(vals,key,fmt,onpick)=>h('div',{class:'seg'},vals.map(v=>h('button',{type:'button',class:cfg[key]===v?'on':'',onclick:()=>{cfg[key]=v;onpick();}},fmt(v))));
function renderPicker(){
  const rooms=[1,2,3,4].map(n=>{const ps=roomPlayers(n);
    return h('button',{class:'rcard',type:'button',onclick:()=>joinRoom(n),disabled:!db||!(myName&&myName.trim().length>=2)},h('b',null,'Table '+n),h('span',{class:'st '+(ps.length?'':'free')},ps.length?ps.length+' joueur'+(ps.length>1?'s':''):'Libre'),h('span',{class:'muted'},ps.length?ps.map(p=>p.name).slice(0,6).join(', '):'Aucun joueur'));});
  const nm=h('input',{id:'nm-in',class:'t',maxlength:'16',placeholder:'Ton pseudo',value:myName,'aria-label':'Pseudo'});
  nm.addEventListener('input',()=>{myName=nm.value.trim().slice(0,16);lsSet(NAME_K,myName);const dis=!db||myName.length<2;document.querySelectorAll('.rcard,#join-go').forEach(b=>b.disabled=dis);const sg=$('solo-go');if(sg)sg.disabled=myName.length<2;});
  const jb=pendingJoin?h('button',{id:'join-go',class:'btn primary',type:'button',disabled:!db||myName.length<2,onclick:()=>joinRoom(pendingJoin)},'➡ Rejoindre la table '+pendingJoin):null;
  return[renderTop(),
    pendingJoin?h('div',{class:'panel'},h('h2',null,'Tu as été invité(e) !'),h('p',{class:'muted'},'Choisis un pseudo pour rejoindre la table '+pendingJoin+'.'),nm,jb):null,
    h('div',{class:'panel'},h('h2',null,'Skyjo · le moins de points gagne'),
      h('p',{class:'muted'},'Chacun a 12 cartes cachées (4 colonnes de 3). À ton tour, pioche ou prends la défausse, et améliore ta grille. 2 à 8 joueurs.'),
      h('div',{class:'rules'},
        h('div',null,h('b',null,'Début'),' : retourne 2 cartes. La plus grosse somme commence.'),
        h('div',null,h('b',null,'Ton tour'),' : prends la défausse (et remplace une carte) ou pioche : remplace une carte, ou défausse et retourne une carte cachée.'),
        h('div',null,h('b',null,'Colonne'),' : 3 cartes identiques face visible dans une colonne = elle disparaît (0 point).'),
        h('div',null,h('b',null,'Fin de manche'),' : quand quelqu\'un a tout retourné, les autres jouent un dernier tour. S\'il n\'a pas le plus petit score, ses points sont doublés !'),
        h('div',null,h('b',null,'Partie'),' : fini quand quelqu\'un atteint 100 points. Le plus petit total gagne.')),
      pendingJoin?null:h('div',{class:'stack'},h('p',{class:'muted'},'Ton pseudo :'),nm)),
    h('div',{class:'panel'},h('h2',null,'Jouer en ligne'),h('div',{class:'rooms'},rooms),!db?h('p',{class:'err'},'Connexion à la base impossible : seul le mode solo est disponible.'):null),
    h('div',{class:'panel'},h('h2',null,'Solo contre l\'ordinateur'),
      h('div',{class:'row'},h('span',null,'Adversaires'),segEl([1,2,3,4,5,6,7],'bots',v=>String(v),render)),
      h('div',{class:'row'},h('span',null,'Objectif'),segEl([50,100],'target',v=>v+' pts',render)),
      h('button',{id:'solo-go',class:'btn primary',type:'button',disabled:myName.length<2,onclick:startSolo},'🤖 Lancer la partie'))];
}
function renderLobby(){
  const ps=roomPlayers(ROOM).slice(0,MAXP),host=ps[0]&&ps[0].id===uid,can=host&&ps.length>=MINP;
  return[renderTop('Table '+ROOM,h('button',{class:'btn sm',type:'button',onclick:leaveRoom},'↩ Quitter la table')),
    h('div',{class:'panel'},h('h2',null,'Salle d\'attente · Table '+ROOM),
      ...ps.map((p,i)=>h('div',{class:'pl'},avEl(p),h('b',null,p.name+(p.id===uid?' (toi)':'')),i===0?h('span',{class:'muted'},'Hôte'):null)),
      h('p',{class:'muted'},ps.length+' joueur'+(ps.length>1?'s':'')+' · 2 à 8 joueurs'),
      h('button',{class:'btn sm',type:'button',onclick:()=>{const u=joinUrl();(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>banner('Lien copié ✔','#7CE7B0')).catch(()=>prompt('Copie ce lien :',u));}},'📋 Copier le lien d\'invitation'),
      host?h('div',{class:'stack'},h('div',{class:'row'},h('span',null,'Objectif'),segEl([50,100],'target',v=>v+' pts',render)),h('button',{class:'btn primary',type:'button',disabled:!can,onclick:startOnline},'▶ Lancer la partie'),can?null:h('p',{class:'muted'},'Il faut au moins 2 joueurs.')):h('p',{class:'muted'},'L\'hôte lance la partie…'))];
}
const colorOf=v=>v<0?'c-neg':v===0?'c-zero':v<=4?'c-low':v<=8?'c-mid':'c-high';
function cardEl(v,up,o){
  o=o||{};
  if(v===SK_GONE)return h('div',{class:'sk gone'});
  const b=h(o.can?'button':'div',{class:'sk '+(up?'up '+colorOf(v):'down')+(o.cls?' '+o.cls:'')+(o.can?' can':''),type:o.can?'button':null,onclick:o.can?o.on:null,'aria-label':up?'Carte '+v:'Carte cachée'},up?h('b',null,String(v)):null);
  return b;
}
function board(p,mine,small){
  const s=S,c=s.cards[p.id],u=s.up[p.id],cur=s.phase!=='end'&&s.phase!=='roundEnd'&&skCur(s)===p.id;
  const sum=c.reduce((a,v,i)=>a+(u[i]&&v!==SK_GONE?v:0),0);
  const can=mine&&myTurn();
  const cells=c.map((v,i)=>{
    let ok=false;
    if(can){
      if(s.phase==='init')ok=!u[i];
      else if(s.held!==null)ok=pickMode==='flip'?(!u[i]&&v!==SK_GONE):v!==SK_GONE;
      else ok=pickMode==='disc'&&v!==SK_GONE;
    }
    return cardEl(v,!!u[i],{can:ok,on:()=>clickCell(i),cls:small?'sm':''});
  });
  return h('div',{class:'bd'+(mine?' mine':'')+(cur?' turn':'')+(small?' small':'')},
    h('div',{class:'bh'},avEl(p,'sm'),h('b',null,p.name+(mine?' (toi)':'')),h('span',{class:'sc'},s.totals[p.id]+' pts'),h('small',null,'visible : '+sum)),
    h('div',{class:'bg'},cells));
}
function renderGame(){
  const s=S,spec=isSpec(),me=uid;
  const out=[renderTop('Manche '+(s.round+1)+' · objectif '+s.target,h('button',{class:'btn sm',type:'button',onclick:()=>{if(confirm('Quitter la partie ?'))leaveRoom();}},'↩ Quitter'))];
  const cur=skCur(s),curP=s.players.find(p=>p.id===cur),mt=myTurn();
  let msg='';
  if(s.phase==='init')msg=mt?'Retourne 2 cartes ('+(s.flips%2)+'/2)':curP.name+' retourne ses cartes…';
  else if(s.phase==='turn'){
    if(mt){msg=s.held!==null?(pickMode==='flip'?'Touche une carte cachée à retourner':'Tu as pioché '+s.held+' : touche la carte à remplacer, ou défausse-la'):(pickMode==='disc'?'Touche la carte à remplacer par la défausse':'À toi ! Pioche ou prends la défausse');}
    else msg='Tour de '+curP.name+(s.last?' · dernier tour !':'');
  }
  out.push(h('div',{class:'stbar'+(mt?' mine':'')},h('span',null,msg)));
  /* adversaires */
  const opps=s.players.filter(p=>p.id!==me);
  if(opps.length)out.push(h('div',{class:'opps'},opps.map(p=>board(p,false,true))));
  /* centre */
  const top=skTop(s),canDraw=mt&&s.phase==='turn'&&s.held===null,canDisc=canDraw;
  out.push(h('div',{class:'center'},
    h('div',{class:'pile'},h('small',null,'Pioche ('+s.deck.length+')'),h('button',{type:'button',class:'sk down big'+(canDraw?' can':''),disabled:!canDraw,onclick:clickDeck,'aria-label':'Piocher'})),
    h('div',{class:'pile'},h('small',null,'Défausse'),cardEl(top,true,{cls:'big'+(pickMode==='disc'?' sel':''),can:canDisc,on:clickDiscard})),
    s.held!==null?h('div',{class:'pile held'},h('small',null,'Ta carte'),cardEl(s.held,true,{cls:'big'}),mt&&s.src==='deck'?h('button',{type:'button',class:'btn sm'+(pickMode==='flip'?' primary':''),onclick:setFlip},pickMode==='flip'?'Annuler':'Défausser + retourner'):null):null));
  /* ma grille */
  if(!spec)out.push(board(s.players.find(p=>p.id===me),true,false));
  /* score */
  out.push(h('div',{class:'panel lglog'},s.players.map(p=>h('span',{class:'tot'},p.name+' : ',h('b',null,String(s.totals[p.id]))))));
  if(s.phase==='roundEnd'||s.phase==='end')out.push(overlay());
  return out;
}
function overlay(){
  const s=S,r=s.res,rk=s.players.slice().sort((a,b)=>s.totals[a.id]-s.totals[b.id]);
  const fin=s.phase==='end';
  return h('div',{class:'ov'},h('div',{class:'ovc'},
    h('h3',null,fin?'🏆 Fin de partie !':'Fin de la manche '+(s.round+1)),
    fin?h('p',{class:'bigtxt'},rk[0].id===uid?'Tu as gagné ! 🎉':rk[0].name+' gagne !'):null,
    r&&r.doubled?h('p',{class:'muted'},'⚠️ '+skNm(s,s.last)+' n\'avait pas le plus petit score : points doublés !'):null,
    ...rk.map((p,i)=>h('div',{class:'ovr'+(i===0?' best':'')},h('span',null,(i+1)+'.'),h('b',null,p.name),h('small',null,'+'+r.add[p.id]),h('span',{class:'p'},String(s.totals[p.id])))),
    h('div',{class:'row ctr'},
      fin?((mode==='solo'||isHostUI())?h('button',{class:'btn primary',type:'button',onclick:endGameHost},mode==='solo'?'↩ Menu':'🔁 Rejouer'):h('p',{class:'muted'},'L\'hôte peut relancer…'))
         :((mode==='solo'||isHostUI())?h('button',{class:'btn primary',type:'button',onclick:nextRound},'Manche suivante ▶'):h('p',{class:'muted'},'En attente de l\'hôte…')),
      fin?h('button',{class:'btn',type:'button',onclick:leaveRoom},'Quitter'):null)));
}
/* ---- démarrage ---- */
async function boot(){
  setTimeout(hideLoader,6000);
  uid=lsGet('f7id');if(!uid){uid='g_'+Math.random().toString(36).slice(2,12);lsSet('f7id',uid);}
  const m=/[?&]table=(\d{1,2})/.exec(location.search);if(m)pendingJoin=+m[1];
  chatBox();render();
  if(window.F7_FIREBASE){
    try{db=await loadFirebase(window.F7_FIREBASE);}catch(e){db=null;}
    if(db){
      lobUnsub=db.collection('lobby').onSnapshot(sn=>{
        roster=sn.docs.filter(d=>d.id.startsWith('sk_')).map(d=>{const v=d.data()||{};return{id:d.id.slice(3),name:String(v.name||'?').slice(0,16),t:+v.t||0,seen:+v.seen||0,room:+v.room||0,pf:String(v.pf||''),av:v.av};});
        if(!mode||(mode==='online'&&!S))render();
      },()=>{});
      setInterval(()=>{if(!mode||(mode==='online'&&!S))render();},8000);
    }
    startChat();
    if(pendingJoin&&db&&myName.trim().length>=2)joinRoom(pendingJoin);else render();
  }
  hideLoader();
  window.addEventListener('beforeunload',()=>{if(db&&ROOM)db.doc('lobby/sk_'+uid).delete().catch(()=>{});});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)beat();});
}

boot();
