<script>
(()=>{
const $=id=>document.getElementById(id);
const T3=window.THREE;
if(!T3){$('err').hidden=false;$('err').textContent='Moteur 3D introuvable.';return;}
const touch=matchMedia('(pointer:coarse)').matches;
let renderer;
try{renderer=new T3.WebGLRenderer({canvas:$('c'),antialias:!touch,powerPreference:'high-performance'});}catch(e){$('err').hidden=false;$('err').textContent='WebGL indisponible sur cet appareil.';return;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,touch?1.5:1.75));
renderer.outputColorSpace=T3.SRGBColorSpace;
const scene=new T3.Scene();
scene.background=new T3.Color(0x9fd8ff);
scene.fog=new T3.Fog(0xd6efff,320,1700);
const camera=new T3.PerspectiveCamera(62,1,.3,4000);
function rs(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',rs);rs();
/* ---------- matériaux ---------- */
const gm=(()=>{const d=new Uint8Array([120,190,255]);const t=new T3.DataTexture(d,3,1,T3.RedFormat);t.minFilter=t.magFilter=T3.NearestFilter;t.needsUpdate=true;return t;})();
const toon=(c,o)=>new T3.MeshToonMaterial(Object.assign({color:c,gradientMap:gm},o||{}));
const olMat=new T3.MeshBasicMaterial({color:0x1a1233,side:T3.BackSide});
function outline(m,s){const o=new T3.Mesh(m.geometry,olMat);o.scale.setScalar(s||1.07);m.add(o);return m;}
scene.add(new T3.HemisphereLight(0xdff2ff,0x7aa860,1.25));
const sun=new T3.DirectionalLight(0xfff0cf,1.9);sun.position.set(180,300,120);scene.add(sun);
const cvs=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c;};
const tex=(c,rx,ry)=>{const t=new T3.CanvasTexture(c);t.colorSpace=T3.SRGBColorSpace;t.wrapS=t.wrapT=T3.RepeatWrapping;if(rx)t.repeat.set(rx,ry);t.anisotropy=4;return t;};
/* ---------- piste ---------- */
const HW=11,KERB=2.2,MAXLAT=HW+KERB+6.5,LAPS=3;
const CPraw=[[0,0,0],[120,0,0],[230,-30,3],[300,-110,6],[310,-210,7],[250,-290,5],[150,-320,3],[60,-290,1],[10,-220,0],[-60,-180,1],[-150,-200,4],[-240,-160,6],[-270,-70,5],[-230,30,2],[-140,70,0],[-60,40,0]];
const curve=new T3.CatmullRomCurve3(CPraw.map(a=>new T3.Vector3(a[0],a[2],a[1])),true,'centripetal');
const M=900,TL=curve.getLength(),SP=TL/M;
const P=[],TG=[],R=[],SL=[];
for(let i=0;i<M;i++)P.push(curve.getPointAt(i/M));
for(let i=0;i<M;i++){const a=P[(i+M-1)%M],b=P[(i+1)%M];let tx=b.x-a.x,tz=b.z-a.z;const hl=Math.hypot(tx,tz);tx/=hl;tz/=hl;TG.push({x:tx,z:tz});R.push({x:-tz,z:tx});SL.push((b.y-a.y)/hl);}
const edgeY=(y,lat)=>{lat=Math.abs(lat);if(lat<=HW+KERB)return y;return Math.max(-.5,y-(lat-HW-KERB)*(y+.5)/(y*1.5+3));};
function ribbon(o0,o1,y0,y1,mat,vrep){
  const pos=[],uv=[],idx=[];
  for(let i=0;i<=M;i++){const k=i%M,p=P[k],r=R[k];
    pos.push(p.x+r.x*o0,p.y+y0,p.z+r.z*o0,p.x+r.x*o1,p.y+y1,p.z+r.z*o1);
    uv.push(0,i/M*vrep,1,i/M*vrep);}
  for(let i=0;i<M;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
  const g=new T3.BufferGeometry();g.setAttribute('position',new T3.Float32BufferAttribute(pos,3));g.setAttribute('uv',new T3.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
  const m=new T3.Mesh(g,mat);scene.add(m);return m;
}
/* sol */
{
  const gt=tex(cvs(256,256,(c,w,h)=>{c.fillStyle='#4cc552';c.fillRect(0,0,w,h);for(let i=0;i<260;i++){c.fillStyle=Math.random()<.5?'rgba(255,255,255,.07)':'rgba(0,70,20,.09)';const r=4+Math.random()*14;c.beginPath();c.arc(Math.random()*w,Math.random()*h,r,0,7);c.fill();}c.fillStyle='rgba(0,80,20,.12)';c.fillRect(0,0,w/2,h/2);c.fillRect(w/2,h/2,w/2,h/2);}),90,90);
  const g=new T3.Mesh(new T3.PlaneGeometry(7000,7000),toon(0xffffff,{map:gt}));g.rotation.x=-Math.PI/2;g.position.y=-.5;scene.add(g);
}
/* route */
const roadTex=tex(cvs(256,512,(c,w,h)=>{c.fillStyle='#5d6079';c.fillRect(0,0,w,h);for(let i=0;i<900;i++){c.fillStyle=Math.random()<.5?'rgba(255,255,255,.06)':'rgba(0,0,0,.08)';c.fillRect(Math.random()*w,Math.random()*h,2+Math.random()*3,2+Math.random()*3);}c.fillStyle='#f4f4fb';c.fillRect(8,0,8,h);c.fillRect(w-16,0,8,h);c.fillStyle='rgba(255,255,255,.85)';for(let k=0;k<4;k++){c.fillRect(w/2-4,k*128+16,8,64);}c.fillStyle='rgba(0,0,0,.12)';c.fillRect(w*.22,0,w*.14,h);c.fillRect(w*.64,0,w*.14,h);}),1,1);
ribbon(-HW,HW,.02,.02,toon(0xffffff,{map:roadTex}),TL/42);
const kerbTex=tex(cvs(32,64,(c,w,h)=>{c.fillStyle='#fff';c.fillRect(0,0,w,h);c.fillStyle='#ee3b3b';c.fillRect(0,0,w,h/2);}),1,1);
const kerbM=toon(0xffffff,{map:kerbTex});
ribbon(-HW-KERB,-HW,.05,.05,kerbM,TL/4.4);ribbon(HW,HW+KERB,.05,.05,kerbM,TL/4.4);
{ // talus
  const mk=(sgn)=>{const pos=[],idx=[];for(let i=0;i<=M;i++){const k=i%M,p=P[k],r=R[k],w=p.y*1.5+3;pos.push(p.x+r.x*sgn*(HW+KERB),p.y+.02,p.z+r.z*sgn*(HW+KERB),p.x+r.x*sgn*(HW+KERB+w),-.5,p.z+r.z*sgn*(HW+KERB+w));}
    for(let i=0;i<M;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
    const g=new T3.BufferGeometry();g.setAttribute('position',new T3.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();scene.add(new T3.Mesh(g,toon(0x3fb34a,{side:T3.DoubleSide})));};
  mk(1);mk(-1);
}
/* ciel */
{
  const sk=new T3.Mesh(new T3.SphereGeometry(3200,24,16),new T3.MeshBasicMaterial({side:T3.BackSide,fog:false,map:tex(cvs(8,256,(c,w,h)=>{const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#1f6fe0');g.addColorStop(.38,'#5fb4ff');g.addColorStop(.5,'#cdebff');g.addColorStop(.52,'#cdebff');g.addColorStop(1,'#bfe3ff');c.fillStyle=g;c.fillRect(0,0,w,h);}),0,0)}));scene.add(sk);
  const ct=new T3.CanvasTexture(cvs(128,64,(c,w,h)=>{c.fillStyle='#fff';[[36,38,22],[62,30,28],[90,38,22],[60,42,26]].forEach(a=>{c.beginPath();c.arc(a[0],a[1],a[2],0,7);c.fill();});}));
  window.__clouds=new T3.Group();for(let i=0;i<16;i++){const s=new T3.Sprite(new T3.SpriteMaterial({map:ct,transparent:true,opacity:.92,fog:false,depthWrite:false}));const a=Math.random()*6.28,r=500+Math.random()*1800;s.position.set(Math.cos(a)*r,260+Math.random()*220,Math.sin(a)*r);const k=220+Math.random()*260;s.scale.set(k,k/2,1);__clouds.add(s);}scene.add(__clouds);
  for(let i=0;i<16;i++){const a=i/16*6.283+Math.random()*.3,r=1500+Math.random()*500,h=260+Math.random()*320;const m=new T3.Mesh(new T3.ConeGeometry(h*.8,h,6),toon(i%3?0x6f9bd9:0x5fae7a));m.position.set(Math.cos(a)*r,h/2-20,Math.sin(a)*r);scene.add(m);if(i%3){const cap=new T3.Mesh(new T3.ConeGeometry(h*.26,h*.3,6),toon(0xffffff));cap.position.set(m.position.x,h-20-h*.15+3,m.position.z);scene.add(cap);}}
}
/* lac */
const LAKE={x:135,z:-170,r:58};
{const s=new T3.Mesh(new T3.CircleGeometry(LAKE.r+7,40),toon(0xf3dc9a));s.rotation.x=-Math.PI/2;s.position.set(LAKE.x,-.42,LAKE.z);scene.add(s);const w=new T3.Mesh(new T3.CircleGeometry(LAKE.r,40),new T3.MeshToonMaterial({color:0x36b4ff,gradientMap:gm,transparent:true,opacity:.92}));w.rotation.x=-Math.PI/2;w.position.set(LAKE.x,-.35,LAKE.z);scene.add(w);}
/* décor */
function roadDist(x,z){let b=1e9;for(let i=0;i<M;i+=2){const d=Math.hypot(P[i].x-x,P[i].z-z);if(d<b)b=d;}return b;}
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
{
  const spots=[];let tries=0;while(spots.length<520&&tries<6000){tries++;const x=(rnd()-.5)*1300,z=(rnd()-.5)*1100-120;if(Math.hypot(x-LAKE.x,z-LAKE.z)<LAKE.r+14)continue;if(roadDist(x,z)<32)continue;spots.push([x,z]);}
  for(let i=6;i<M;i+=9){const s=rnd()<.5?-1:1,off=MAXLAT+6+rnd()*26;const x=P[i].x+R[i].x*s*off,z=P[i].z+R[i].z*s*off;if(Math.hypot(x-LAKE.x,z-LAKE.z)<LAKE.r+12)continue;if(roadDist(x,z)<MAXLAT+4)continue;spots.push([x,z]);}
  const A=spots.filter((_,i)=>i%2===0),B=spots.filter((_,i)=>i%2===1);
  const dm=new T3.Object3D();
  const inst=(geo,mat,list,fn)=>{const im=new T3.InstancedMesh(geo,mat,list.length);list.forEach((s,i)=>{dm.rotation.set(0,0,0);dm.scale.setScalar(1);fn(dm,s,i,im);dm.updateMatrix();im.setMatrixAt(i,dm.matrix);});im.instanceMatrix.needsUpdate=true;if(im.instanceColor)im.instanceColor.needsUpdate=true;scene.add(im);return im;};
  const ts=s=>.8+(Math.abs(s[0]*7+s[1]*3)%5)/5*.9;
  inst(new T3.CylinderGeometry(.5,.7,3,6),toon(0x7a4a22),spots,(d,s)=>{d.position.set(s[0],1,s[1]);d.scale.setScalar(ts(s));});
  const cm=toon(0xffffff);
  inst(new T3.ConeGeometry(4.2,7,8),cm,A,(d,s,i,im)=>{const k=ts(s);d.position.set(s[0],5.2*k,s[1]);d.scale.setScalar(k);d.rotation.set(0,s[0],0);im.setColorAt(i,new T3.Color().setHSL(.33+((i*37)%10)/200,.62,.34+((i*13)%7)/60));});
  inst(new T3.ConeGeometry(3.1,6,8),cm,A,(d,s,i,im)=>{const k=ts(s);d.position.set(s[0],8.6*k,s[1]);d.scale.setScalar(k);d.rotation.set(0,s[1],0);im.setColorAt(i,new T3.Color().setHSL(.33+((i*37)%10)/200,.66,.4+((i*13)%7)/60));});

function pickItem(k){const pos=rankOf(k),fr=(pos-1)/5,w={turbo:50-18*fr,oil:34-22*fr,rocket:16+40*fr};let s=w.turbo+w.oil+w.rocket,r=Math.random()*s;if((r-=w.turbo)<0)return'turbo';if((r-=w.oil)<0)return'oil';return'rocket';}
function useItem(k){

  if(it==='turbo'){k.boost=Math.max(k.boost,1.9);if(k.isP){toast('⚡ TURBO !');beep(320,.5,'sawtooth',.1);}}

function updObjs(dt){
  objs.oil.forEach(o=>{o.t-=dt;o.grace-=dt;karts.forEach(k=>{if(o.t<=0)return;if(k===o.own&&o.grace>0)return;const dx=k.pos.x-o.m.position.x,dz=k.pos.z-o.m.position.z;if(dx*dx+dz*dz<4.8&&k.spin<=0){spinOut(k,1.15);if(k.isP)toast('🛢️ Dérapage !');o.t=0;}});if(o.t<=0)scene.remove(o.m);});objs.oil=objs.oil.filter(o=>o.t>0);

    emit(o.pos.x-Math.sin(o.yaw)*1.2,o.pos.y,o.pos.z-Math.cos(o.yaw)*1.2,(Math.random()-.5)*2,(Math.random()-.5)*2,(Math.random()-.5)*2,0xffa53a,.35);

    if(o.t<=0)scene.remove(o.m);});objs.miss=objs.miss.filter(o=>o.t>0);

function botInp(k){
  const look=9+Math.floor(Math.abs(k.speed)/6),ti=(k.idx+look)%M,tp=P[ti],tr=R[ti];

  objs.oil.forEach(o=>{const dx=o.m.position.x-k.pos.x,dz=o.m.position.z-k.pos.z;if(dx*dx+dz*dz<500&&(dx*sy+dz*cy)>0){const s=((dx*cy-dz*sy)>0?1:-1);tx-=cy*s*3;tz+=sy*s*3;}});
  let d=Math.atan2(tx-k.pos.x,tz-k.pos.z)-k.yaw;d=Math.atan2(Math.sin(d),Math.cos(d));

  const a=TG[k.idx],b=TG[(k.idx+30)%M],ang=Math.acos(Math.max(-1,Math.min(1,a.x*b.x+a.z*b.z)));
  let rb=1;if(!k.isP&&P0){rb=1+Math.max(-1,Math.min(1,(P0.prog-k.prog)/350))*.07;}
  const tgt=60*(k.isP?.95:k.top)*rb*(1-Math.min(.4,ang*1.05));
  if(k.item&&!k.cd){k.cd=1;setTimeout(()=>{k.cd=0;},900+Math.random()*1500);if(k.item==='turbo'||(k.item==='rocket'&&karts.some(o=>o!==k&&o.prog>k.prog&&o.prog-k.prog<M*.12))||(k.item==='oil'&&karts.some(o=>o!==k&&o.prog<k.prog&&k.prog-o.prog<M*.05)))useItem(k);}
  return{steer,gas:k.speed<tgt?1:0,brake:k.speed>tgt+10?1:0,drift:0};
}
function collide(){
  for(let i=0;i<karts.length;i++)for(let j=i+1;j<karts.length;j++){const a=karts[i],b=karts[j];const dx=b.pos.x-a.pos.x,dz=b.pos.z-a.pos.z,d=Math.hypot(dx,dz);if(d<2.7&&d>.001){const o=(2.7-d)/2,nx=dx/d,nz=dz/d;a.pos.x-=nx*o;a.pos.z-=nz*o;b.pos.x+=nx*o;b.pos.z+=nz*o;const rv=(b.vx-a.vx)*nx+(b.vz-a.vz)*nz;if(rv<0){const j2=-rv*.55;a.vx-=nx*j2;a.vz-=nz*j2;b.vx+=nx*j2;b.vz+=nz*j2;}if(a.isP||b.isP){shake=Math.max(shake,.12);}}}
}
/* ---------- entrées ---------- */
const K={},TB={l:0,r:0,d:0};
addEventListener('keydown',e=>{K[e.code]=1;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if((e.code==='Space'||e.code==='KeyE')&&state==='race'&&!P0.fin)useItem(P0);});

const hold=(id,key)=>{const b=$(id);const on=e=>{e.preventDefault();TB[key]=1;b.classList.add('dn');};const off=e=>{e.preventDefault();TB[key]=0;b.classList.remove('dn');};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,off));};

function playerInp(){const l=K.ArrowLeft||K.KeyA||TB.l,r=K.ArrowRight||K.KeyD||TB.r;return{steer:(r?1:0)-(l?1:0),gas:(K.ArrowUp||K.KeyW||touch)?1:0,brake:(K.ArrowDown||K.KeyS)?1:0,drift:(K.ShiftLeft||K.ShiftRight||TB.d)?1:0};}
/* ---------- visuel karts ---------- */
function syncVis(k){
  const sl=SL[k.idx]||0;
  k.g.position.set(k.pos.x,k.pos.y,k.pos.z);k.g.rotation.y=k.yaw+k.spinYaw;

/* ---------- HUD ---------- */

const mmc=$('mm'),mx=mmc.getContext('2d');let mmBg=null;
(()=>{let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;P.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);z0=Math.min(z0,p.z);z1=Math.max(z1,p.z);});const s=(190-28)/Math.max(x1-x0,z1-z0);window.__mm={x0,z0,s,ox:(190-(x1-x0)*s)/2,oz:(190-(z1-z0)*s)/2};

const hex6=n=>'#'+n.toString(16).padStart(6,'0');
let lastPos=0;
function hud(){

  if(pos!==lastPos){const e=$('pos');e.innerHTML=pos+'<small>/6</small>';e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop');lastPos=pos;}

  const tt=Math.max(0,raceT),mn=Math.floor(tt/60),sc=(tt-mn*60).toFixed(1);$('tm').textContent=mn+':'+(sc<10?'0':'')+sc;

}
function showEnd(){const r=rankList(),box=$('res');box.innerHTML='';r.forEach((k,i)=>{const d=document.createElement('div');if(k.isP)d.className='me';d.innerHTML='<i>'+(i+1)+'</i><u style="background:'+hex6(k.spec.col)+'"></u><span>'+k.spec.n+'</span><em>'+(k.fin?k.finT.toFixed(1)+' s':'en course')+'</em>';box.append(d);});$('end').hidden=false;}
/* ---------- boucle ---------- */
let camYaw=0,camInit=false,fov=62,last=performance.now();
function update(dt){
  time+=dt;
  if(window.__clouds)__clouds.rotation.y+=dt*.002;
  boxes.forEach(b=>{b.m.rotation.y+=dt*1.8;b.m.rotation.x=Math.sin(time*1.5+b.i)*.3;b.m.position.y=P[b.i].y+1.7+Math.sin(time*2+b.l)*.25;if(!b.alive){b.t-=dt;if(b.t<=0){b.alive=true;b.m.visible=true;}}});

}
