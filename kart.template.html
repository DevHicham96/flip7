<script>
(()=>{
const $=id=>document.getElementById(id);
const T3=window.THREE;
if(!T3){$('err').hidden=false;$('err').textContent='Moteur 3D introuvable.';return;}
const touch=matchMedia('(pointer:coarse)').matches;
let renderer;
try{renderer=new T3.WebGLRenderer({canvas:$('c'),antialias:!touch,powerPreference:'high-performance'});}catch(e){$('err').hidden=false;$('err').textContent='WebGL indisponible sur cet appareil.';return;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,touch?1.5:1.75));
renderer.outputColorSpace=T3.SRGBColorSpace;
const scene=new T3.Scene();
scene.background=new T3.Color(0x9fd8ff);
scene.fog=new T3.Fog(0xd6efff,320,1700);
const camera=new T3.PerspectiveCamera(62,1,.3,4000);
function rs(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',rs);rs();
/* ---------- matériaux ---------- */
const gm=(()=>{const d=new Uint8Array([120,190,255]);const t=new T3.DataTexture(d,3,1,T3.RedFormat);t.minFilter=t.magFilter=T3.NearestFilter;t.needsUpdate=true;return t;})();
const toon=(c,o)=>new T3.MeshToonMaterial(Object.assign({color:c,gradientMap:gm},o||{}));
const olMat=new T3.MeshBasicMaterial({color:0x1a1233,side:T3.BackSide});
function outline(m,s){const o=new T3.Mesh(m.geometry,olMat);o.scale.setScalar(s||1.07);m.add(o);return m;}
scene.add(new T3.HemisphereLight(0xdff2ff,0x7aa860,1.25));
const sun=new T3.DirectionalLight(0xfff0cf,1.9);sun.position.set(180,300,120);scene.add(sun);
const cvs=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c;};
const tex=(c,rx,ry)=>{const t=new T3.CanvasTexture(c);t.colorSpace=T3.SRGBColorSpace;t.wrapS=t.wrapT=T3.RepeatWrapping;if(rx)t.repeat.set(rx,ry);t.anisotropy=4;return t;};

/* ---------- pubs ---------- */
const adReg=[];
function drawAd(c,w,h,kind){
  c.clearRect(0,0,w,h);c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';
  const ag=(x0,x1)=>{const g=c.createLinearGradient(x0,0,x1,h);g.addColorStop(0,'#2a1466');g.addColorStop(1,'#7a3cff');c.fillStyle=g;c.fillRect(x0,0,x1-x0,h);const cx=(x0+x1)/2,fs=Math.min(h*.36,(x1-x0)/7.6);c.font=fs+"px 'Lilita One',Nunito,Arial,sans-serif";c.lineWidth=fs*.16;c.strokeStyle='#1b0a3a';c.fillStyle='#ffe24a';c.strokeText('ATELIER GAMING',cx,h*.44);c.fillText('ATELIER GAMING',cx,h*.44);c.font='900 '+fs*.36+"px Nunito,Arial,sans-serif";c.fillStyle='#fff';c.fillText('🎮 FLIP7 · RAMI · QUIZ · KART RUSH',cx,h*.78);};
  const en=(x0,x1)=>{const g=c.createLinearGradient(x0,0,x1,h);g.addColorStop(0,'#0aa88f');g.addColorStop(1,'#1560d4');c.fillStyle=g;c.fillRect(x0,0,x1-x0,h);const cx=(x0+x1)/2,fs=Math.min(h*.42,(x1-x0)/5.2);c.fillStyle='#fff';c.font='900 '+fs+"px Nunito,Arial,sans-serif";c.fillText('ENEDIS',cx,h*.45);c.font='900 '+fs*.3+"px Nunito,Arial,sans-serif";c.fillText('⚡ la pause café ☕',cx,h*.8);};
  if(kind==='ag')ag(0,w);else if(kind==='en')en(0,w);else if(kind==='both'){ag(0,w/2);en(w/2,w);}
  else{const t=kind==='roadEn'?'ENEDIS ⚡':'ATELIER GAMING';const fs=Math.min(h*.62,w/(t.length*.62));c.font=fs+"px 'Lilita One',Nunito,Arial,sans-serif";c.lineWidth=fs*.1;c.strokeStyle='rgba(60,30,120,.5)';c.fillStyle=kind==='roadEn'?'rgba(120,255,235,.92)':'rgba(255,255,255,.92)';c.strokeText(t,w/2,h/2);c.fillText(t,w/2,h/2);return;}
  if(kind!=='sticker'){c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=Math.max(4,h*.03);c.strokeRect(c.lineWidth/2,c.lineWidth/2,w-c.lineWidth,h-c.lineWidth);}
}
function adTex(kind,w,h){const cv=document.createElement('canvas');cv.width=w;cv.height=h;drawAd(cv.getContext('2d'),w,h,kind);const t=new T3.CanvasTexture(cv);t.colorSpace=T3.SRGBColorSpace;t.anisotropy=4;adReg.push({t,cv,kind});return t;}
const ADS={ag:adTex('ag',1024,360),en:adTex('en',1024,360),both:adTex('both',1024,360),sticker:adTex('ag',512,176),road:adTex('road',1024,256),roadEn:adTex('roadEn',1024,256)};
if(document.fonts&&document.fonts.load)Promise.all([document.fonts.load("48px 'Lilita One'"),document.fonts.load('900 48px Nunito')]).then(()=>adReg.forEach(a=>{drawAd(a.cv.getContext('2d'),a.cv.width,a.cv.height,a.kind);a.t.needsUpdate=true;})).catch(()=>{});
/* ---------- piste ---------- */
const HW=11,KERB=2.2,MAXLAT=HW+KERB+6.5,LAPS=3;
const CPraw=[[0,0,0],[120,0,0],[230,-30,3],[300,-110,6],[310,-210,7],[250,-290,5],[150,-320,3],[60,-290,1],[10,-220,0],[-60,-180,1],[-150,-200,4],[-240,-160,6],[-270,-70,5],[-230,30,2],[-140,70,0],[-60,40,0]];
const curve=new T3.CatmullRomCurve3(CPraw.map(a=>new T3.Vector3(a[0],a[2],a[1])),true,'centripetal');
const M=900,TL=curve.getLength(),SP=TL/M;
const P=[],TG=[],R=[],SL=[];
for(let i=0;i<M;i++)P.push(curve.getPointAt(i/M));
for(let i=0;i<M;i++){const a=P[(i+M-1)%M],b=P[(i+1)%M];let tx=b.x-a.x,tz=b.z-a.z;const hl=Math.hypot(tx,tz);tx/=hl;tz/=hl;TG.push({x:tx,z:tz});R.push({x:-tz,z:tx});SL.push((b.y-a.y)/hl);}
const edgeY=(y,lat)=>{lat=Math.abs(lat);if(lat<=HW+KERB)return y;return Math.max(-.5,y-(lat-HW-KERB)*(y+.5)/(y*1.5+3));};
function ribbon(o0,o1,y0,y1,mat,vrep){
  const pos=[],uv=[],idx=[];
  for(let i=0;i<=M;i++){const k=i%M,p=P[k],r=R[k];
    pos.push(p.x+r.x*o0,p.y+y0,p.z+r.z*o0,p.x+r.x*o1,p.y+y1,p.z+r.z*o1);
    uv.push(0,i/M*vrep,1,i/M*vrep);}
  for(let i=0;i<M;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
  const g=new T3.BufferGeometry();g.setAttribute('position',new T3.Float32BufferAttribute(pos,3));g.setAttribute('uv',new T3.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
  const m=new T3.Mesh(g,mat);scene.add(m);return m;
}
/* sol */
{
  const gt=tex(cvs(256,256,(c,w,h)=>{c.fillStyle='#4cc552';c.fillRect(0,0,w,h);for(let i=0;i<260;i++){c.fillStyle=Math.random()<.5?'rgba(255,255,255,.07)':'rgba(0,70,20,.09)';const r=4+Math.random()*14;c.beginPath();c.arc(Math.random()*w,Math.random()*h,r,0,7);c.fill();}c.fillStyle='rgba(0,80,20,.12)';c.fillRect(0,0,w/2,h/2);c.fillRect(w/2,h/2,w/2,h/2);}),90,90);
  const g=new T3.Mesh(new T3.PlaneGeometry(7000,7000),toon(0xffffff,{map:gt}));g.rotation.x=-Math.PI/2;g.position.y=-.5;scene.add(g);
}

function blimp(dt){BL.phi+=dt*.035;const a=BL.phi,cx=20,cz=-130,R0=370;BL.g.position.set(cx+Math.cos(a)*R0,150+Math.sin(a*3)*6,cz+Math.sin(a)*R0);BL.g.rotation.y=-a-Math.PI/2;}

function update(dt){

  blimp(dt);
  boxes.forEach(b=>{b.m.rotation.y+=dt*1.8;b.m.rotation.x=Math.sin(time*1.5+b.i)*.3;b.m.position.y=P[b.i].y+1.7+Math.sin(time*2+b.l)*.25;if(!b.alive){b.t-=dt;if(b.t<=0){b.alive=true;b.m.visible=true;}}});

    if(cd<=.6){state='race';m.className='msg pop go';m.textContent='GO !';void m.offsetWidth;beep(880,.5,'square',.13);setTimeout(()=>{if(state==='race')$('msg').textContent='';},1000);}}

    });

  if(state==='top'){}
  else if(state==='title'||state==='lobby'){camYaw+=dt*.35;const a=camYaw+k.yaw+2.5;camera.position.set(k.pos.x+Math.sin(a)*10,k.pos.y+4,k.pos.z+Math.cos(a)*10);camera.lookAt(k.pos.x,k.pos.y+1.6,k.pos.z);camera.fov=50;viewOffset();camera.updateProjectionMatrix();camInit=false;}
  else{
    if(!camInit){camYaw=k.yaw;camInit=true;}
    let dy=k.yaw-camYaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));camYaw+=dy*Math.min(1,dt*(k.drift?3:5.5));

    if(shake>0){camera.position.x+=(Math.random()-.5)*shake*1.4;camera.position.y+=(Math.random()-.5)*shake*1.4;}
    camera.lookAt(k.pos.x+Math.sin(camYaw)*4,k.pos.y+1.5,k.pos.z+Math.cos(camYaw)*4);
    const tf=(camera.aspect<1?72:60)+Math.min(1,Math.abs(k.speed)/60)*6+(k.boost>0?14:0);fov+=(tf-fov)*Math.min(1,dt*5);camera.fov=fov;viewOffset();camera.updateProjectionMatrix();
  }
  shake=Math.max(0,shake-dt);
  if(engG&&AC){const pc=Math.abs(P0.speed)/60;engG.gain.value=(state==='race'||state==='over')?.035+pc*.03:0;eng.frequency.value=55+pc*170+(P0.boost>0?60:0);}
}
function frame(t){
