<style>

.cell.conge{border-color:var(--blue);background:#4da3ff22}.cell.today{box-shadow:0 0 0 3px var(--gold)}.cell.fut{opacity:.8}

.ent .form{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}

.sug b{color:var(--gold)}.mut{color:var(--mut);font-size:13px}

.toast.on{opacity:1;transform:translate(-50%,0)}
.ver{text-align:center;color:var(--mut);font-size:12px}
</style></head><body>
<div class="w">
<header>
  <div><h1>✅ Suivi Imputations</h1><p class="sub">Note tes jours travaillés et tes tickets Jira. L'outil te dit chaque jour ce qu'il reste à imputer et où. Données privées : sur cet appareil, avec synchro optionnelle.</p></div>
  <a class="back" href="index.html">⬅ Retour aux jeux</a>
</header>
<nav class="tabs" id="tabs"></nav>
<div id="view"></div>
<div class="ver" id="ver"></div>
</div>
<div class="ov" id="ov" hidden><div class="mod" id="mod"></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DOWS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const DAYS=[.25,.5,.75,1];
const STAT={work:'Travaillé',conge:'Congé',rtt:'RTT',abs:'Absence'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const D=(y,m,d)=>new Date(y,m,d,12);
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return D(y,m-1,d);};
const addDays=(d,n)=>D(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dow=d=>(d.getDay()+6)%7;
const r2=n=>Math.round(n*100)/100;
const nf=n=>String(r2(n)).replace('.',',');
const fmtL=k=>{const d=fromKey(k);return ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'][dow(d)]+' '+d.getDate()+' '+MONTHS[d.getMonth()].toLowerCase();};
const uid=()=>Math.random().toString(36).slice(2,9);
$('ver').textContent=window.AT_VER||'';
let tt=0;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200);}
/* ---------- stockage ---------- */
const SK='atimp1';
let S={days:{},sprints:[]};
try{const v=JSON.parse(localStorage.getItem(SK)||'null');if(v&&v.days&&v.sprints)S=v;}catch(e){}
function save(noSync){if(!noSync)S.t=Date.now();try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){toast('⚠️ Sauvegarde impossible (stockage bloqué)');}if(!noSync)queuePush();}
/* ---------- synchro Firebase (1 document par code secret) ---------- */
const CK='atimpcode';let code='';try{code=localStorage.getItem(CK)||'';}catch(e){}
let fdb=null,fl=null,pt=0,syncSt=code?'…':'off';
async function fbLoad(){if(fdb)return fdb;if(!window.F7_FIREBASE)throw new Error('nofb');if(!fl)fl=(async()=>{const V='10.14.1',B='https://www.gstatic.com/firebasejs/'+V+'/';const[A,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js')]);const fs=F.getFirestore(A.initializeApp(window.F7_FIREBASE,'imp'));fdb={F,ref:c=>F.doc(fs,'game/imp_'+c)};return fdb;})();return fl;}
const goodCode=c=>/^[A-Z2-9]{16}$/.test(c);
function newCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789',a=new Uint32Array(16);crypto.getRandomValues(a);return[...a].map(x=>A[x%A.length]).join('');}
function setCode(c){code=c;try{if(c)localStorage.setItem(CK,c);else localStorage.removeItem(CK);}catch(e){}}
function queuePush(){if(!code)return;clearTimeout(pt);syncSt='⏳';pt=setTimeout(push,3000);}
async function push(){if(!code)return;try{const d=await fbLoad();await d.F.setDoc(d.ref(code),{j:JSON.stringify(S),t:S.t||Date.now()});syncSt='ok';}catch(e){syncSt='err';}if(tab==='dat')render();}
async function pull(first){if(!code)return;try{const d=await fbLoad(),sn=await d.F.getDoc(d.ref(code));
  if(sn.exists()){const r=sn.data(),v=JSON.parse(r.j);if(v&&v.days&&Array.isArray(v.sprints)&&(first==='force'||(r.t||0)>(S.t||0))){S=v;S.t=r.t||Date.now();save(true);render();syncSt='ok';return true;}syncSt='ok';if((S.t||0)>(r.t||0))push();}
  else push();}catch(e){syncSt='err';}if(tab==='dat')render();}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(pt){clearTimeout(pt);pt=0;push();}}else pull();});
/* ---------- jours fériés FR ---------- */
const hcache={};
function holidays(y){if(hcache[y])return hcache[y];
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  const p=D(y,mo-1,da),H={};const add=(dt,n)=>{H[key(dt)]=n;};
  add(D(y,0,1),'Jour de l\'an');add(addDays(p,1),'Lundi de Pâques');add(D(y,4,1),'Fête du travail');add(D(y,4,8),'Victoire 1945');add(addDays(p,39),'Ascension');add(addDays(p,50),'Lundi de Pentecôte');add(D(y,6,14),'Fête nationale');add(D(y,7,15),'Assomption');add(D(y,10,1),'Toussaint');add(D(y,10,11),'Armistice');add(D(y,11,25),'Noël');
  return hcache[y]=H;}
const holName=k=>holidays(+k.slice(0,4))[k]||'';
const isOff=k=>{const d=fromKey(k);return dow(d)>4||!!holName(k);};
/* ---------- calculs ---------- */
const todayK=key(new Date());
const rec=k=>S.days[k]||null;
const stOf=k=>{const r=rec(k);return r&&r.st?r.st:'work';};
const ents=k=>{const r=rec(k);return r&&r.e?r.e:[];};
const sumD=(arr,f)=>r2(arr.reduce((s,e)=>s+(f(e)?+e.d||0:0),0));
/* un jour travaillé "dû" = jour ouvré, statut travaillé, passé ou aujourd'hui */
function dayInfo(k){
  const off=isOff(k),st=stOf(k),e=ents(k);
  const worked=!off&&st==='work',past=k<=todayK;
  const logged=sumD(e,()=>true),imp=Math.min(1,sumD(e,x=>x.imp));
  return{k,off,st,worked,past,due:worked&&past?1:0,logged,imp:worked?imp:0,miss:worked&&past?r2(Math.max(0,1-imp)):0,
    state:off?'off':st!=='work'?'conge':!past?'fut':imp>=1?'ok':imp>0?'part':'miss'};}
function monthKeys(y,m){const n=new Date(y,m+1,0).getDate(),a=[];for(let i=1;i<=n;i++)a.push(y+'-'+pad(m+1)+'-'+pad(i));return a;}
function sprintOf(k){return S.sprints.find(s=>s.start&&s.end&&k>=s.start&&k<=s.end)||null;}
function sprintStats(s){let w=0,im=0,miss=0;
  for(let d=fromKey(s.start);key(d)<=s.end;d=addDays(d,1)){const i=dayInfo(key(d));w+=i.due;im+=i.imp;miss+=i.miss;}
  const logged=Object.keys(S.days).filter(k=>k>=s.start&&k<=s.end&&!isOff(k)&&stOf(k)==='work').reduce((t,k)=>t+Math.min(1,sumD(ents(k),()=>true)),0);
  return{w:r2(w),im:r2(im),miss:r2(miss),logged:r2(logged)};}
function monthStats(y,m){const ks=monthKeys(y,m);let ouv=0,due=0,imp=0,miss=0,conge=0;const bySp={},byPr={};
  for(const k of ks){const off=isOff(k);if(!off)ouv++;const i=dayInfo(k);if(!off&&i.st!=='work')conge++;due+=i.due;imp+=i.imp;miss+=i.miss;
    if(!off&&i.st==='work')for(const e of ents(k)){if(!e.imp)continue;const sp=e.sprint||(sprintOf(k)||{}).name||'(sans sprint)',pr=e.proj||'(sans projet)';bySp[sp]=r2((bySp[sp]||0)+(+e.d||0));byPr[pr]=r2((byPr[pr]||0)+(+e.d||0));}}
  return{ouv,due:r2(due),imp:r2(imp),miss:r2(miss),conge,pct:due?Math.round(imp/due*100):100,bySp,byPr};}
function alerts(y,m){const out=[],ks=monthKeys(y,m).filter(k=>k<=todayK);
  const noImp=[],part=[];for(const k of ks){const i=dayInfo(k);if(!i.worked)continue;if(i.imp===0)noImp.push(k);else if(i.imp<1)part.push(k);}
  if(noImp.length)out.push({c:'r',t:`⛔ ${noImp.length} jour(s) travaillé(s) sans aucune imputation : ${noImp.slice(-6).map(k=>k.slice(8)+'/'+k.slice(5,7)).join(', ')}${noImp.length>6?'…':''}`,a:'reg'});
  if(part.length)out.push({c:'o',t:`⚠️ ${part.length} jour(s) partiellement imputé(s) : ${part.slice(-6).map(k=>k.slice(8)+'/'+k.slice(5,7)).join(', ')}`,a:'reg'});
  for(const s of S.sprints){if(s.end<todayK){const st=sprintStats(s);if(st.miss>0)out.push({c:'r',t:`🏁 Sprint « ${esc(s.name)} » terminé avec ${nf(st.miss)} jour(s) manquant(s)`,a:'reg'});}
    else if(s.start<=todayK){const st=sprintStats(s);const left=Math.round((fromKey(s.end)-new Date())/864e5);if(left<=2&&st.miss>0)out.push({c:'o',t:`⏳ Sprint « ${esc(s.name)} » se termine bientôt (${nf(st.miss)} j à imputer)`,a:'reg'});}}
  const now=new Date(),dw=dow(now);
  if(dw>=3&&dw<=4){const wk=[];for(let i=0;i<=dw;i++)wk.push(key(addDays(now,i-dw)));const miss=r2(wk.reduce((t,k)=>t+dayInfo(k).miss,0));out.push({c:'b',t:dw===4?`📅 C'est vendredi : vérifie tes imputations de la semaine (${nf(miss)} j manquant${miss>1?'s':''}).`:`📅 Fin de semaine proche : ${nf(miss)} j à imputer cette semaine.`,a:'reg'});}
  const ms=monthStats(y,m);if(ms.due&&Math.abs(ms.due-ms.imp)>=.25)out.push({c:'o',t:`📊 Écart du mois : ${nf(ms.due)} j travaillés pour ${nf(ms.imp)} j imputés.`,a:'reg'});
  if(!out.length)out.push({c:'g',t:'✅ Tu es à jour : aucune imputation manquante.'});
  return out;}
/* ---------- navigation ---------- */
let tab='dash',cur=new Date(),filt={m:'',sp:'',pr:'',tk:'',im:''};
const TABS=[['dash','📊 Tableau de bord'],['cal','🗓️ Calendrier'],['reg','🧭 Où imputer ?'],['spr','🏁 Sprints'],['his','📚 Historique'],['dat','💾 Données']];
function nav(){$('tabs').innerHTML=TABS.map(t=>`<button class="tab${t[0]===tab?' on':''}" data-t="${t[0]}">${t[1]}</button>`).join('');}
$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(b){tab=b.dataset.t;render();}};
const Y=()=>cur.getFullYear(),M=()=>cur.getMonth();
function monthBar(){return`<div class="calh"><button class="nav" data-mv="-1" aria-label="Mois précédent">‹</button><h3>${MONTHS[M()]} ${Y()}</h3><button class="nav" data-mv="1" aria-label="Mois suivant">›</button></div>`;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-mv]');if(b){cur=new Date(Y(),M()+ +b.dataset.mv,1);render();}});
function render(){nav();const v=$('view');({dash:vDash,cal:vCal,reg:vReg,spr:vSpr,his:vHis,dat:vDat})[tab](v);}
/* ---------- tableau de bord ---------- */
function bars(o){const e=Object.entries(o).sort((a,b)=>b[1]-a[1]);if(!e.length)return'<p class="mut">Rien d\'imputé ce mois-ci.</p>';const mx=Math.max(...e.map(x=>x[1]));
  return e.map(([k,v])=>`<div class="bar"><span title="${esc(k)}">${esc(k)}</span><i><u style="width:${v/mx*100}%"></u></i><b>${nf(v)} j</b></div>`).join('');}
function donut(p){const R=52,C=2*Math.PI*R;return`<svg viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="${p}% imputé"><circle cx="70" cy="70" r="${R}" fill="none" stroke="#ffffff1c" stroke-width="16"/><circle cx="70" cy="70" r="${R}" fill="none" stroke="${p>=100?'#34d399':p>=60?'#ffa94d':'#ff5a6a'}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C*Math.min(1,p/100)} ${C}" transform="rotate(-90 70 70)"/><text x="70" y="78" text-anchor="middle" font-family="Lilita One" font-size="30" fill="#f1f3ff">${p}%</text></svg>`;}
function vDash(v){const ms=monthStats(Y(),M()),al=alerts(Y(),M()),tk=todayK,ti=dayInfo(tk),te=ents(tk);
  let td='';if(isOff(tk))td='<p class="mut">Aujourd\'hui est un jour non travaillé 🎉</p>';
  else td=`<p>${te.length?te.map(e=>`${e.imp?'✅':'❌'} <b>${esc(e.tk||'—')}</b> ${esc(e.desc||'')} · ${nf(e.d)} j`).join('<br>'):'<span class="mut">Rien de noté aujourd\'hui.</span>'}</p><button class="btn sm" data-open="${tk}">✏️ Renseigner aujourd'hui</button>`;
  v.innerHTML=`<section class="card">${monthBar()}<div class="kpis">
   <div class="kpi"><span>Jours ouvrés</span><b>${ms.ouv}</b></div><div class="kpi b"><span>Jours travaillés</span><b>${nf(ms.due)}</b></div>
   <div class="kpi g"><span>Imputés Jira</span><b>${nf(ms.imp)}</b></div><div class="kpi ${ms.miss?'r':'g'}"><span>Restant à imputer</span><b>${nf(ms.miss)}</b></div>
   <div class="kpi"><span>Congés / absences</span><b>${ms.conge}</b></div></div></section>
  <div class="two"><section class="card"><h2>Aujourd'hui</h2>${td}${ti.worked?`<p class="mut">Imputé : ${nf(ti.imp)} / 1 j</p>`:''}</section>
  <section class="card"><h2>🔔 Alertes</h2>${al.map(a=>`<div class="alert ${a.c}"><span>${a.t}</span>${a.a?`<button class="btn sm" data-go="${a.a}">Régulariser</button>`:''}</div>`).join('')}</section></div>
  <div class="two"><section class="card" style="display:grid;place-items:center;text-align:center"><h2>Imputation du mois</h2>${donut(ms.pct)}<p class="mut">${nf(ms.imp)} j imputés sur ${nf(ms.due)} j travaillés</p></section>
  <section class="card"><h2>Par sprint</h2>${bars(ms.bySp)}<h2 style="margin-top:14px">Par projet</h2>${bars(ms.byPr)}</section></div>`;}
/* ---------- calendrier ---------- */
function vCal(v){const first=D(Y(),M(),1),lead=dow(first),ks=monthKeys(Y(),M());let h=`<section class="card">${monthBar()}<div class="grid">${DOWS.map(d=>`<div class="dh">${d}</div>`).join('')}`;
  for(let i=0;i<lead;i++)h+='<div></div>';
  for(const k of ks){const i=dayInfo(k),hn=holName(k),e=ents(k);const cls=i.state==='off'?'off':i.state;
    const sm=hn?hn:i.st!=='work'?STAT[i.st]:e.length?e.map(x=>x.tk||'—').join(', '):'';
    h+=`<button class="cell ${cls}${k===todayK?' today':''}" data-open="${k}"><span>${+k.slice(8)}</span><small>${esc(sm)}</small><small>${i.worked&&(e.length||i.past)?nf(i.imp)+'/1 j':''}</small></button>`;}
  h+=`</div><div class="leg"><span><i style="background:#34d399"></i>Imputé</span><span><i style="background:#ffa94d"></i>Partiel</span><span><i style="background:#ff5a6a"></i>Non imputé</span><span><i style="background:#4da3ff"></i>Congé / RTT / absence</span><span><i style="background:#171a3a"></i>Week-end / férié</span></div></section>`;
  v.innerHTML=h;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)openDay(b.dataset.open);const g=e.target.closest('[data-go]');if(g){tab=g.dataset.go;render();}});
/* ---------- édition d'un jour ---------- */
let ed=null;
function datalist(id,vals){return`<datalist id="${id}">${[...new Set(vals)].filter(Boolean).map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`;}
function allEnts(){const a=[];for(const k in S.days)for(const e of ents(k))a.push(Object.assign({k},e));return a;}
function openDay(k){const r=rec(k);ed={k,st:r&&r.st||'work',e:JSON.parse(JSON.stringify(ents(k)))};if(!ed.e.length&&!isOff(k)&&ed.st==='work'){const sp=sprintOf(k);ed.e.push({id:uid(),proj:sp?sp.proj:'',sprint:sp?sp.name:'',tk:'',desc:'',d:1,imp:false});}drawDay();$('ov').hidden=false;}
function drawDay(){const k=ed.k,all=allEnts();const tot=sumD(ed.e,()=>true);
  $('mod').innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0;font:400 22px 'Lilita One';color:var(--gold)">${esc(fmtL(k))}</h2><button class="btn alt sm" id="dx">✕</button></div>
  ${holName(k)?`<p class="mut">🎌 ${esc(holName(k))} (jour férié)</p>`:''}
  <label>Statut<select id="dst">${Object.entries(STAT).map(([a,b])=>`<option value="${a}"${ed.st===a?' selected':''}>${b}</option>`).join('')}</select></label>
  ${ed.st==='work'?`<div id="ents">${ed.e.map((e,i)=>`<div class="ent"><div class="form">
    <label>Projet<input data-f="proj" data-i="${i}" list="dlp" value="${esc(e.proj)}"></label>
    <label>Sprint<input data-f="sprint" data-i="${i}" list="dls" value="${esc(e.sprint)}"></label>
    <label>Ticket Jira<input data-f="tk" data-i="${i}" list="dlt" placeholder="PROJ-123" value="${esc(e.tk)}"></label>
    <label>Durée<select data-f="d" data-i="${i}">${DAYS.map(d=>`<option value="${d}"${+e.d===d?' selected':''}>${nf(d)} j</option>`).join('')}</select></label></div>
    <label>Description<input data-f="desc" data-i="${i}" value="${esc(e.desc)}"></label>
    <div class="row" style="justify-content:space-between"><label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:14px;color:var(--fg)"><input type="checkbox" data-f="imp" data-i="${i}" style="width:20px;height:20px"${e.imp?' checked':''}> Imputé dans Jira</label><button class="btn bad sm" data-rm="${i}">🗑 Retirer</button></div></div>`).join('')}</div>
    <div class="row"><button class="btn alt" id="addE">➕ Ajouter un ticket</button><span class="mut">Total noté : ${nf(tot)} j${tot>1?' ⚠️ plus d\'1 jour':''}</span></div>
    ${datalist('dlp',all.map(e=>e.proj).concat(S.sprints.map(s=>s.proj)))}${datalist('dls',S.sprints.map(s=>s.name).concat(all.map(e=>e.sprint)))}${datalist('dlt',all.map(e=>e.tk))}`:'<p class="mut">Ce jour n\'est pas compté comme travaillé.</p>'}
  <div class="row"><button class="btn ok" id="sv">💾 Enregistrer</button><button class="btn alt" id="clr">Effacer le jour</button></div>`;}
$('mod').addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f||!ed)return;const i=+t.dataset.i;ed.e[i][f]=f==='imp'?t.checked:f==='d'?+t.value:t.value;if(f==='proj'||f==='sprint'||f==='d'){}});
$('mod').addEventListener('click',e=>{if(!ed)return;const t=e.target;
  if(t.id==='dx'){close();}
  else if(t.id==='addE'){const sp=sprintOf(ed.k);ed.e.push({id:uid(),proj:sp?sp.proj:'',sprint:sp?sp.name:'',tk:'',desc:'',d:r2(Math.max(.25,1-sumD(ed.e,()=>true))),imp:false});drawDay();}
  else if(t.dataset.rm!=null){ed.e.splice(+t.dataset.rm,1);drawDay();}
  else if(t.id==='clr'){delete S.days[ed.k];save();close();render();toast('Jour effacé');}
  else if(t.id==='sv'){const k=ed.k,e=ed.e.filter(x=>(String(x.tk)+String(x.desc)+String(x.proj)).trim()).map(x=>Object.assign(x,{tk:String(x.tk).trim().toUpperCase()}));
    if(ed.st==='work'&&sumD(e,()=>true)>1){toast('⚠️ Plus d\'1 jour noté : corrige les durées');return;}
    if(ed.st==='work'&&!e.length)delete S.days[k];else S.days[k]={st:ed.st,e:ed.st==='work'?e:[]};save();close();render();toast('Enregistré ✅');}});
$('mod').addEventListener('change',e=>{if(e.target.id==='dst'&&ed){ed.st=e.target.value;if(ed.st==='work'&&!ed.e.length)ed.e.push({id:uid(),proj:'',sprint:'',tk:'',desc:'',d:1,imp:false});drawDay();}});
function close(){$('ov').hidden=true;ed=null;}
$('ov').addEventListener('click',e=>{if(e.target.id==='ov')close();});
/* ---------- assistant de régularisation ---------- */
function suggest(k){const sp=sprintOf(k),kd=fromKey(k).getTime(),m=new Map();
  for(const e of allEnts()){if(!e.tk)continue;const x=m.get(e.tk)||{tk:e.tk,proj:e.proj,sprint:e.sprint,desc:e.desc,n:0,sc:0,last:'',near:0,sameSp:false,own:false};
    x.n++;if(e.k>x.last){x.last=e.k;x.desc=e.desc||x.desc;x.proj=e.proj||x.proj;x.sprint=e.sprint||x.sprint;}
    const dd=Math.abs(fromKey(e.k).getTime()-kd)/864e5;if(dd<=3&&e.k!==k)x.near++;if(sp&&e.sprint===sp.name)x.sameSp=true;if(e.k===k)x.own=true;m.set(e.tk,x);}
  const a=[...m.values()];a.forEach(x=>{x.sc=(x.own?5:0)+(x.sameSp?3:0)+x.near*2+Math.min(x.n,5)*.5;x.why=[x.own?'déjà noté ce jour-là':'',x.near?`utilisé ${x.near}× à ±3 jours`:'',x.sameSp?'même sprint':'',`${x.n} fois dans ton historique`].filter(Boolean).join(' · ');});
  return a.sort((p,q)=>q.sc-p.sc||(q.last>p.last?1:-1)).slice(0,4);}
function vReg(v){const ks=monthKeys(Y(),M()).filter(k=>dayInfo(k).miss>0);
  let h=`<section class="card">${monthBar()}<h2>🧭 Où dois-je imputer mes jours ?</h2><p class="mut">Les propositions viennent uniquement de ton historique. Rien n'est imputé sans ta validation.</p>`;
  if(!ks.length)h+='<div class="alert g">✅ Aucun jour à régulariser ce mois-ci.</div>';
  for(const k of ks){const i=dayInfo(k),sp=sprintOf(k),own=ents(k).filter(e=>!e.imp),sg=suggest(k);
    h+=`<div class="ent" style="margin:12px 0"><div class="row" style="justify-content:space-between"><b>${esc(fmtL(k))}</b><span class="pill ${i.imp>0?'o':'r'}">${nf(i.miss)} j manquant${i.miss>1?'s':''}</span></div>
    <span class="mut">${sp?'Sprint : '+esc(sp.name)+(sp.proj?' · '+esc(sp.proj):''):'Aucun sprint défini pour cette date'}</span>`;
    if(own.length)h+=own.map(e=>`<div class="sug"><div>Noté ce jour : <b>${esc(e.tk||'—')}</b> ${esc(e.desc||'')} · ${nf(e.d)} j</div><button class="btn ok sm" data-mark="${k}|${e.id}">Marquer imputé</button></div>`).join('');
    if(sg.length)h+=`<div class="mut" style="margin-top:4px">Tickets proposés (tu choisis) :</div>`+sg.map(x=>`<div class="sug"><div><b>${esc(x.tk)}</b> ${esc(x.desc||'')}<br><span class="mut">${esc(x.proj||'')} ${x.why?'· '+esc(x.why):''}</span></div>
      <div class="row"><select id="q_${k}_${esc(x.tk)}" style="width:92px">${DAYS.filter(d=>d<=i.miss+.001).map(d=>`<option value="${d}"${d===i.miss?' selected':''}>${nf(d)} j</option>`).join('')}</select><button class="btn sm" data-add="${k}|${esc(x.tk)}">Valider</button></div></div>`).join('');
    else if(!own.length)h+='<p class="mut">Pas encore d\'historique de tickets : ouvre le jour pour en noter un.</p>';
    h+=`<div><button class="btn alt sm" data-open="${k}">✏️ Ouvrir le jour</button></div></div>`;}
  v.innerHTML=h+'</section>';}
document.addEventListener('click',e=>{const m=e.target.closest('[data-mark]'),a=e.target.closest('[data-add]');
  if(m){const[k,id]=m.dataset.mark.split('|'),x=ents(k).find(z=>z.id===id);if(x){x.imp=true;save();render();toast('Marqué imputé ✅');}}
  if(a){const[k,tk]=a.dataset.add.split('|'),sel=document.getElementById('q_'+k+'_'+tk),src=allEnts().filter(z=>z.tk===tk).sort((p,q)=>q.k>p.k?1:-1)[0];if(!src||!sel)return;
    const d=+sel.value;if(!S.days[k])S.days[k]={st:'work',e:[]};S.days[k].e.push({id:uid(),proj:src.proj,sprint:(sprintOf(k)||{}).name||src.sprint,tk,desc:src.desc,d,imp:true});save();render();toast('Imputation ajoutée ✅');}});
/* ---------- sprints ---------- */
function vSpr(v){let h=`<section class="card"><h2>➕ Nouveau sprint</h2><div class="form"><label>Nom<input id="sn" placeholder="Sprint 24"></label><label>Projet<input id="sp" placeholder="PROJ"></label><label>Début<input id="ss" type="date"></label><label>Fin<input id="se" type="date"></label><button class="btn" id="sa">Ajouter</button></div></section>
  <section class="card"><h2>🏁 Mes sprints</h2>`;
  if(!S.sprints.length)h+='<p class="mut">Aucun sprint. Ajoute-en un : les jours seront rattachés automatiquement selon la date.</p>';
  else h+=`<div class="tw"><table><tr><th>Sprint</th><th>Projet</th><th>Période</th><th>Travaillés</th><th>Imputés</th><th>Restant</th><th></th></tr>${[...S.sprints].sort((a,b)=>b.start>a.start?1:-1).map(s=>{const t=sprintStats(s);return`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.proj)}</td><td>${s.start.split('-').reverse().join('/')} → ${s.end.split('-').reverse().join('/')}</td><td>${nf(t.w)}</td><td>${nf(t.im)}</td><td><span class="pill ${t.miss?'r':'g'}">${nf(t.miss)}</span></td><td><button class="btn bad sm" data-ds="${s.id}">🗑</button></td></tr>`;}).join('')}</table></div>`;
  v.innerHTML=h+'</section>';}
document.addEventListener('click',e=>{if(e.target.id==='sa'){const n=$('sn').value.trim(),a=$('ss').value,b=$('se').value;if(!n||!a||!b||b<a){toast('Nom, début et fin valides requis');return;}S.sprints.push({id:uid(),name:n,proj:$('sp').value.trim(),start:a,end:b});save();render();toast('Sprint ajouté');}
  const d=e.target.closest('[data-ds]');if(d&&confirm('Supprimer ce sprint ?')){S.sprints=S.sprints.filter(s=>s.id!==d.dataset.ds);save();render();}});
/* ---------- historique ---------- */
function rows(){const a=[];for(const k of Object.keys(S.days).sort().reverse()){const r=S.days[k];if(r.st&&r.st!=='work'){a.push({k,st:STAT[r.st],proj:'',sprint:'',tk:'',desc:'',d:'',imp:''});continue;}
  for(const e of r.e||[])a.push({k,st:'Travaillé',proj:e.proj||'',sprint:e.sprint||(sprintOf(k)||{}).name||'',tk:e.tk||'',desc:e.desc||'',d:e.d,imp:e.imp?'Oui':'Non'});}return a;}
function fRows(){return rows().filter(r=>(!filt.m||r.k.startsWith(filt.m))&&(!filt.sp||r.sprint===filt.sp)&&(!filt.pr||r.proj===filt.pr)&&(!filt.tk||r.tk.includes(filt.tk.toUpperCase()))&&(!filt.im||r.imp===filt.im));}
function vHis(v){const all=rows(),opt=(a,s)=>'<option value="">Tous</option>'+[...new Set(a)].filter(Boolean).sort().map(x=>`<option${x===s?' selected':''}>${esc(x)}</option>`).join('');
  const r=fRows();v.innerHTML=`<section class="card"><h2>📚 Historique</h2><div class="form">
   <label>Mois<select data-fl="m">${opt(all.map(x=>x.k.slice(0,7)),filt.m)}</select></label><label>Sprint<select data-fl="sp">${opt(all.map(x=>x.sprint),filt.sp)}</select></label>
   <label>Projet<select data-fl="pr">${opt(all.map(x=>x.proj),filt.pr)}</select></label><label>Ticket<input data-fl="tk" value="${esc(filt.tk)}" placeholder="PROJ-123"></label>
   <label>Imputation<select data-fl="im"><option value="">Tous</option><option${filt.im==='Oui'?' selected':''}>Oui</option><option${filt.im==='Non'?' selected':''}>Non</option></select></label></div>
   <div class="row" style="margin:12px 0"><button class="btn" id="xx">⬇ Excel (.xlsx)</button><button class="btn alt" id="xc">⬇ CSV</button><span class="mut">${r.length} ligne(s) · ${nf(r.reduce((t,x)=>t+(+x.d||0),0))} j</span></div>
   <div class="tw"><table><tr><th>Date</th><th>Statut</th><th>Projet</th><th>Sprint</th><th>Ticket</th><th>Description</th><th>Jours</th><th>Imputé</th></tr>${r.map(x=>`<tr><td>${x.k.split('-').reverse().join('/')}</td><td>${x.st}</td><td>${esc(x.proj)}</td><td>${esc(x.sprint)}</td><td><b>${esc(x.tk)}</b></td><td>${esc(x.desc)}</td><td>${x.d===''?'':nf(x.d)}</td><td>${x.imp?`<span class="pill ${x.imp==='Oui'?'g':'r'}">${x.imp}</span>`:''}</td></tr>`).join('')||'<tr><td colspan="8" class="mut">Aucune ligne.</td></tr>'}</table></div></section>`;}
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.fl;if(f&&e.target.tagName==='INPUT'){filt[f]=e.target.value;const p=e.target.selectionStart;vHis($('view'));const n=document.querySelector('[data-fl="tk"]');if(n){n.focus();n.setSelectionRange(p,p);}}});
document.addEventListener('change',e=>{const f=e.target.dataset&&e.target.dataset.fl;if(f&&e.target.tagName==='SELECT'){filt[f]=e.target.value;vHis($('view'));}});
const HEAD=['Date','Statut','Projet','Sprint','Ticket','Description','Jours','Imputé'];
function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const csvc=s=>{s=String(s==null?'':s);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"';};
function exportCSV(){const r=fRows();const t=[HEAD.map(csvc).join(';')].concat(r.map(x=>[x.k,x.st,x.proj,x.sprint,x.tk,x.desc,x.d===''?'':String(x.d).replace('.',','),x.imp].map(csvc).join(';'))).join('\r\n');dl('imputations.csv',new Blob(['﻿'+t],{type:'text/csv;charset=utf-8'}));}
function exportXLSX(){const go=()=>{try{const r=fRows(),ws=XLSX.utils.aoa_to_sheet([HEAD].concat(r.map(x=>[x.k,x.st,x.proj,x.sprint,x.tk,x.desc,x.d===''?'':+x.d,x.imp]))),wb=XLSX.utils.book_new();ws['!cols']=[{wch:11},{wch:10},{wch:12},{wch:14},{wch:12},{wch:36},{wch:7},{wch:8}];XLSX.utils.book_append_sheet(wb,ws,'Imputations');XLSX.writeFile(wb,'imputations.xlsx');}catch(e){toast('Excel indisponible : export CSV');exportCSV();}};
  if(window.XLSX)return go();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=go;s.onerror=()=>{toast('Excel indisponible hors ligne : export CSV');exportCSV();};document.head.appendChild(s);}
document.addEventListener('click',e=>{if(e.target.id==='xc')exportCSV();if(e.target.id==='xx')exportXLSX();});
/* ---------- données ---------- */
function vDat(v){v.innerHTML=`<section class="card"><h2>💾 Mes données</h2>
  <p class="mut">Tout est stocké dans ce navigateur. Tu peux aussi le synchroniser entre tes appareils avec un code secret, ou faire une sauvegarde en fichier.</p>
  <div class="row"><button class="btn" id="bx">⬇ Sauvegarde (.json)</button><label class="btn alt" style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--fg);cursor:pointer;display:inline-block">⬆ Restaurer<input id="bi" type="file" accept=".json,application/json" hidden></label><button class="btn bad" id="bz">🗑 Tout effacer</button></div></section>
  <section class="card"><h2>🔄 Synchronisation entre appareils</h2>${code?`<p>Synchro <b>activée</b> ${syncSt==='ok'?'✅':syncSt==='err'?'⚠️ erreur réseau':'⏳'}</p><p class="mut">Ton code secret (à saisir sur ton autre appareil, ne le partage pas) :</p><p style="font:900 20px monospace;letter-spacing:.08em;word-break:break-all;color:var(--gold)">${esc(code.replace(/(.{4})/g,'$1 ').trim())}</p><div class="row"><button class="btn alt" id="sysc">📋 Copier le code</button><button class="btn" id="sysp">⬆ Forcer l'envoi</button><button class="btn alt" id="sysf">⬇ Forcer la récupération</button><button class="btn bad" id="syso">Désactiver</button></div>`:`<p class="mut">Tes imputations sont enregistrées en ligne sous un code secret aléatoire : seul qui a ce code peut les retrouver. Garde-le pour toi.</p><div class="row"><button class="btn ok" id="sysn">✨ Activer la synchro</button></div><div class="form" style="margin-top:12px"><label>J'ai déjà un code<input id="scin" placeholder="XXXX XXXX XXXX XXXX" autocapitalize="characters"></label><button class="btn" id="sysj">Rejoindre</button></div>`}</section>
  <section class="card"><h2>🔗 Jira</h2><p class="mut">Cette version ne se connecte pas à Jira : un navigateur ne peut pas appeler l'API Jira directement, et un token ne doit pas être stocké en clair. Tu notes tes tickets ici, tu imputes dans Jira, puis tu coches « Imputé ». L'historique s'exporte en Excel pour comparer avec tes worklogs.</p></section>`;}
document.addEventListener('click',e=>{if(e.target.id==='bx')dl('imputations-sauvegarde.json',new Blob([JSON.stringify(S)],{type:'application/json'}));
  const id=e.target.id;
  if(id==='sysn'){if(!window.F7_FIREBASE){toast('Synchro indisponible hors du site');return;}setCode(newCode());syncSt='⏳';push();render();}
  else if(id==='sysj'){const c=$('scin').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(!goodCode(c)){toast('Code invalide (16 caractères)');return;}setCode(c);fbLoad().then(d=>d.F.getDoc(d.ref(c))).then(sn=>{if(!sn.exists()){setCode('');toast('Code introuvable');render();return;}pull('force').then(()=>toast('Données récupérées ✅'));}).catch(()=>{setCode('');toast('Réseau indisponible');render();});}
  else if(id==='sysc'){try{navigator.clipboard.writeText(code).then(()=>toast('Code copié'),()=>toast('Copie impossible'));}catch(x){toast('Copie impossible');}}
  else if(id==='sysp'){S.t=Date.now();push().then(()=>toast('Envoyé'));}
  else if(id==='sysf'){pull('force').then(()=>toast('Récupéré'));}
  else if(id==='syso'&&confirm('Désactiver la synchro sur cet appareil ? (les données en ligne restent)')){setCode('');render();}
  if(e.target.id==='bz'&&confirm('Effacer toutes les données ?')){S={days:{},sprints:[]};save();render();toast('Données effacées');}});
document.addEventListener('change',e=>{if(e.target.id==='bi'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(!v||typeof v.days!=='object'||!Array.isArray(v.sprints))throw 0;S=v;save();render();toast('Sauvegarde restaurée ✅');}catch(x){toast('Fichier invalide');}};r.readAsText(f);}});
