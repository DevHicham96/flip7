<style>:root{--bg1:#1a1464;--bg2:#4a1fb8;--pur:#6c3df0;--pur2:#3a1d9c;--yel:#FFD23F;--yel2:#F5A800;--ink:#1f1650;--ink2:#6a5fa8;--card:#fff;--blue:#3B82F6;--f-display:'Baloo 2','Fredoka',system-ui,sans-serif;--f-body:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html{background:#1a1464}
body{margin:0;color:#fff;font:15px/1.45 var(--f-body);padding:12px max(12px,env(safe-area-inset-right)) 90px max(12px,env(safe-area-inset-left));min-height:100vh;position:relative;background:radial-gradient(circle at 12% 8%,rgba(108,61,240,.75) 0 18%,transparent 40%),radial-gradient(circle at 92% 92%,rgba(59,130,246,.55) 0 14%,transparent 38%),linear-gradient(160deg,var(--bg1),var(--bg2) 70%,#6d2fd6);background-attachment:fixed}
body::before,body::after{content:'';position:fixed;z-index:0;pointer-events:none;border-radius:50%}

.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;display:grid;gap:14px}
h1,h2,h3,p{margin:0}
h2{font:800 24px var(--f-display);color:var(--yel);letter-spacing:.01em}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.25);border-radius:20px;padding:8px 14px}
.brand{font:800 28px var(--f-display);color:var(--yel);margin-right:auto;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.brand small{display:block;font:600 11px var(--f-body);letter-spacing:.18em;color:#cdc3ff;text-transform:uppercase;text-shadow:none}
.btn{font:700 15px var(--f-body);min-height:46px;border-radius:99px;border:0;background:#fff;color:var(--pur2);padding:0 22px;cursor:pointer;box-shadow:0 5px 0 #b9acff;transition:transform .08s,box-shadow .08s,filter .15s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover:not(:disabled){filter:brightness(1.05)}.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #b9acff}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;font-size:13px;padding:0 14px;box-shadow:0 3px 0 #b9acff}
.btn.primary{background:linear-gradient(#FFE066,var(--yel));color:#3b2a00;box-shadow:0 5px 0 var(--yel2)}.btn.primary:active:not(:disabled){box-shadow:0 1px 0 var(--yel2)}
.panel{background:#fff;color:var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--pur2),0 18px 30px rgba(10,5,60,.4);padding:20px;display:grid;gap:12px;width:100%;max-width:760px;margin-inline:auto}
.panel h2{color:var(--pur)}
.muted{color:var(--ink2);font-size:14px}.top .muted,.qfoot .muted,.qhead .muted{color:inherit}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.rcard{display:grid;gap:6px;text-align:left;padding:14px;border-radius:20px;border:3px solid #e4dcff;background:#f6f2ff;color:var(--ink);cursor:pointer;font:inherit;min-height:104px;align-content:start;transition:transform .15s,border-color .15s}
.rcard:hover:not(:disabled){border-color:var(--pur);transform:translateY(-3px)}.rcard:disabled{opacity:.55;cursor:not-allowed}.rcard b{font:800 20px var(--f-display);color:var(--pur)}
.st{font:700 12px var(--f-body);padding:3px 10px;border-radius:99px;width:max-content;background:#e4dcff;color:var(--pur2)}.st.free{background:#d4f7e6;color:#13774a}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-weight:600}
.seg{display:inline-flex;border:3px solid #e4dcff;border-radius:99px;overflow:hidden;background:#f6f2ff}.seg button{border:0;background:transparent;color:var(--pur2);font:700 14px var(--f-body);padding:8px 16px;cursor:pointer}.seg button.on{background:var(--pur);color:#fff}
.pl{display:flex;align-items:center;gap:10px;background:#f6f2ff;border-radius:99px;padding:6px 14px 6px 6px}

.av.has{background:none!important;overflow:hidden}.av svg{width:100%;height:100%;display:block}
.pl b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.rules{display:grid;gap:4px;font-size:14px;color:var(--ink2);background:#f6f2ff;border-radius:18px;padding:10px 14px}.rules b{color:var(--pur)}
.pchip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:99px;padding:3px 12px 3px 4px;color:#fff;font:700 13px var(--f-body);min-height:36px}
.pchip .av{width:28px;height:28px;font-size:12px;border-width:2px}.pchip b{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err{color:#d12b3a;font-weight:700}
.fxban{position:fixed;left:50%;top:max(90px,12vh);transform:translateX(-50%);padding:10px 22px;border-radius:999px;background:#fff;color:var(--pur2);font:800 clamp(14px,3.4vw,20px) var(--f-display);box-shadow:0 8px 0 var(--yel),0 14px 30px rgba(0,0,0,.35);white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;animation:fxban 2.2s ease-out forwards;z-index:200}
@keyframes fxban{0%{opacity:0;transform:translate(-50%,-20px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:130;pointer-events:none;border-radius:2px;animation:cf 3s linear forwards}
@keyframes cf{to{top:105vh;rotate:720deg}}
.stack{display:grid;gap:10px}.ctr{text-align:center;justify-content:center}
.bigtxt{font:800 22px var(--f-display);color:var(--pur);text-align:center}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.cat{display:grid;justify-items:center;gap:2px;padding:10px 6px;border-radius:20px;border:3px solid #e4dcff;background:#f6f2ff;color:var(--ink);cursor:pointer;font:inherit;min-height:76px;transition:transform .12s}
.cat .ce{font-size:28px;line-height:1}.cat b{font:700 12.5px var(--f-body);text-align:center}
.cat:hover{transform:translateY(-2px)}.cat.on{border-color:var(--pur);background:var(--pur);color:#fff;box-shadow:0 5px 0 var(--pur2)}
.lobgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.lobgrid .panel{max-width:none}
.qr{width:min(250px,100%);margin:0 auto;background:#fff;padding:10px;border-radius:20px;border:4px solid var(--yel);box-shadow:0 6px 0 var(--yel2)}
.qr svg{display:block;width:100%;height:auto}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font:700 14px var(--f-body)}
.qhead .qn{background:var(--yel);color:#3b2a00;border-radius:99px;padding:5px 16px;box-shadow:0 3px 0 var(--yel2)}
.qhead .qcat{background:rgba(255,255,255,.16);border-radius:99px;padding:5px 14px}
.qhead .qs{background:rgba(255,255,255,.16);border-radius:99px;padding:5px 14px}.qhead .qs b{color:var(--yel);font:800 18px var(--f-display)}
.tm{display:flex;align-items:center;gap:10px}
.tbwrap{flex:1;height:16px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.tbar{height:100%;transform-origin:left;background:linear-gradient(90deg,var(--yel2),var(--yel));border-radius:99px;transition:transform .25s linear}
.tnum{min-width:56px;text-align:center;font:800 24px var(--f-display);color:#3b2a00;background:var(--yel);border-radius:99px;padding:2px 10px;box-shadow:0 4px 0 var(--yel2)}
.qcard{background:#fff;color:var(--ink);border-radius:30px;box-shadow:0 8px 0 var(--pur2),0 18px 30px rgba(10,5,60,.4);padding:clamp(18px,3.4vw,32px);text-align:center;min-height:110px;display:grid;place-items:center;position:relative;border:4px solid var(--yel)}
.qcard h2{font:800 clamp(20px,4.4vw,32px)/1.2 var(--f-display);color:var(--ink)}
.ansg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{position:relative;display:flex;align-items:center;gap:12px;min-height:clamp(62px,12vh,100px);border-radius:24px;border:0;background:#fff;color:var(--ink);font:700 clamp(14px,3.3vw,20px)/1.2 var(--f-body);text-align:left;padding:10px 16px 10px 10px;cursor:pointer;box-shadow:0 6px 0 rgba(20,10,90,.55);transition:transform .08s,opacity .2s,box-shadow .08s}
.ans i{font:800 1.25em var(--f-display);font-style:normal;flex:none;width:2em;height:2em;border-radius:50%;display:grid;place-items:center;color:#fff}
.ans.a0 i{background:#6c3df0}.ans.a1 i{background:#3B82F6}.ans.a2 i{background:#F5A800}.ans.a3 i{background:#E5484D}
.ans span{flex:1;min-width:0;overflow-wrap:anywhere}
.ans:hover:not(:disabled){transform:translateY(-3px)}.ans:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 rgba(20,10,90,.55)}
.ans:disabled{cursor:default}.ans.chosen{background:#efe9ff;outline:4px solid var(--yel);outline-offset:2px}
.ans.dim{opacity:.4}.ans.good{background:#d6f9e6;outline:4px solid #2FB67C;outline-offset:2px;animation:okp .6s ease-out}
.ans em{font:800 .95em var(--f-display);font-style:normal;background:#e4dcff;color:var(--pur2);border-radius:99px;padding:2px 12px}
.ans u{text-decoration:none;font-size:1.5em;color:#13774a}
@keyframes okp{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:none}}
.qfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-weight:600}
.rmsg{text-align:center;font:800 clamp(18px,4vw,26px) var(--f-display);padding:10px 16px;border-radius:99px;animation:cpop2 .4s both;box-shadow:0 6px 0 rgba(0,0,0,.25)}
@keyframes cpop2{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rmsg.ok{background:#2FB67C;color:#fff}.rmsg.bad{background:#E5484D;color:#fff}.rmsg b{color:var(--yel)}
.lbp{max-width:560px}.lbp h2{font-size:20px}
.lb{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lb li{display:flex;align-items:center;gap:8px;background:#f6f2ff;border-radius:99px;padding:5px 14px 5px 8px;color:var(--ink)}
.lb li.me{background:#fff3c4;box-shadow:inset 0 0 0 3px var(--yel)}
.lb li i{font:800 16px var(--f-display);font-style:normal;width:26px;text-align:center;color:var(--pur)}
.lb li b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .av{width:30px;height:30px;font-size:13px;border-width:2px}
.lb em{font:800 14px var(--f-body);font-style:normal;color:#13774a}.lb .stk{font-size:13px;font-weight:700}
.lb .pts{font:800 19px var(--f-display);color:var(--pur);min-width:58px;text-align:right}
.endp .podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:6px 0 4px;min-height:210px}
.pod{display:grid;justify-items:center;gap:4px;width:min(120px,28%);text-align:center;color:var(--ink)}
.pod b{font:700 14px var(--f-body);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pod span{font:800 18px var(--f-display);color:var(--pur)}
.pod .pm{font-size:34px}.pod .bar{width:100%;border-radius:14px 14px 0 0;background:linear-gradient(var(--yel),var(--yel2));animation:grow .9s cubic-bezier(.2,1,.3,1) both;transform-origin:bottom}
.pod.p1 .bar{height:120px}.pod.p2 .bar{height:84px;background:linear-gradient(#a58bff,var(--pur))}.pod.p3 .bar{height:56px;background:linear-gradient(#7cb2ff,var(--blue))}
@keyframes grow{from{transform:scaleY(0)}}
/* discussion légère */
.qchat{position:fixed;right:14px;bottom:14px;z-index:150;display:grid;justify-items:end;gap:10px}
.qc-fab{position:relative;width:56px;height:56px;border-radius:50%;border:0;background:var(--yel);font-size:26px;cursor:pointer;box-shadow:0 5px 0 var(--yel2),0 10px 20px rgba(0,0,0,.35);display:grid;place-items:center}
.qc-fab:active{transform:translateY(3px)}
.ubadge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:#E5484D;color:#fff;font:800 11px var(--f-body);padding:0 5px;border:2px solid #fff}
.qc-fab .ubadge{position:absolute;right:-4px;top:-4px}
.qc-pop{width:min(320px,calc(100vw - 28px));height:min(420px,62vh);background:#fff;color:var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--pur2),0 18px 34px rgba(0,0,0,.45);display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;overflow:hidden}
.qc-h{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--pur);color:#fff;font:800 16px var(--f-display)}
.qc-x{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:50%;width:28px;height:28px;cursor:pointer}
#ch-list{list-style:none;margin:0;padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0;overscroll-behavior:contain}
#ch-list li.msg{display:flex;gap:8px;align-items:flex-start;max-width:92%}
#ch-list li.msg.me{align-self:flex-end;flex-direction:row-reverse}
#ch-list li.msg.same{margin-top:-3px}#ch-list li.msg.same .mb{margin-left:36px}#ch-list li.msg.me.same .mb{margin-left:0;margin-right:36px}
#ch-list .mav{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 13px var(--f-display);flex:none}
#ch-list .mh{display:flex;gap:6px;align-items:baseline;font-size:11px;color:var(--ink2)}#ch-list .mh time{opacity:.7}
#ch-list li.me .mh{justify-content:flex-end}
#ch-list .mt{background:#f0ebff;border-radius:4px 14px 14px 14px;padding:5px 10px;font-size:14px;overflow-wrap:anywhere}
#ch-list li.me .mt{background:var(--yel);color:#3b2a00;border-radius:14px 4px 14px 14px}
#ch-list li.big .mt{background:none;font-size:32px;line-height:1.1;padding:0 4px}
#ch-list li.rx{align-self:center;font-style:italic;color:var(--ink2);font-size:12px}
.qc-e{display:flex;gap:2px;justify-content:space-around;padding:2px 6px;border-top:1px solid #eee}.qc-e button{border:0;background:none;font-size:20px;cursor:pointer;padding:2px 4px;border-radius:8px}.qc-e button:hover{background:#f0ebff}
#ch-form{display:flex;gap:6px;padding:8px;border-top:1px solid #eee}
#ch-in{flex:1;min-width:0;min-height:42px;border-radius:99px;border:2px solid #e4dcff;background:#f6f2ff;color:var(--ink);font:500 15px var(--f-body);padding:0 14px}
#ch-in:focus{outline:0;border-color:var(--pur)}
.ch-send{width:42px;height:42px;border-radius:50%;border:0;background:var(--pur);color:#fff;font-size:16px;cursor:pointer;flex:none}
#ch-toasts{position:fixed;right:84px;bottom:20px;z-index:149;display:grid;gap:6px;pointer-events:none;max-width:min(260px,64vw);justify-items:end}
.ch-toast{background:#fff;color:var(--ink);border-radius:18px;padding:6px 12px;font-size:13px;animation:tin .25s ease-out;box-shadow:0 5px 0 var(--pur2);overflow-wrap:anywhere}.ch-toast b{color:var(--pur)}
.ch-toast.out{opacity:0;transform:translateY(-6px);transition:.4s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
/* chargement */
.gload{position:fixed;inset:0;z-index:300;display:grid;place-items:center;align-content:center;gap:20px;background:linear-gradient(160deg,var(--bg1),var(--bg2) 70%,#6d2fd6);overflow:hidden;transition:opacity .5s ease,visibility .5s;font-family:var(--f-display)}
.gload.out{opacity:0;visibility:hidden}
.gload .lg-cloud{display:none}
.gload .lg-fan{position:relative;width:170px;height:140px}
.gload .lg-fan i{position:absolute;left:50%;bottom:0;width:62px;height:62px;margin-left:-31px;border-radius:50%;display:grid;place-items:center;font:800 28px var(--f-display);font-style:normal;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25);animation:lgb 1.2s ease-in-out infinite}
.gload i:nth-child(1){--x:-72px;background:#6c3df0}.gload i:nth-child(2){--x:-36px;background:#3B82F6}.gload i:nth-child(3){--x:0px;background:var(--yel);color:#3b2a00}.gload i:nth-child(4){--x:36px;background:#E5484D}.gload i:nth-child(5){--x:72px;background:#2FB67C}
.gload .lg-fan i:nth-child(2){animation-delay:.12s}.gload .lg-fan i:nth-child(3){animation-delay:.24s}.gload .lg-fan i:nth-child(4){animation-delay:.36s}.gload .lg-fan i:nth-child(5){animation-delay:.48s}
.gload .lg-fan i{transform:translateX(var(--x))}
@keyframes lgb{0%,100%{transform:translate(var(--x),0)}50%{transform:translate(var(--x),-26px)}}
.gload .lg-sign{font:800 clamp(26px,7vw,38px) var(--f-display);color:var(--yel);letter-spacing:.05em}
.gload .lg-sign b{display:inline-block;animation:lgdot 1.2s infinite}.gload .lg-sign b:nth-of-type(2){animation-delay:.2s}.gload .lg-sign b:nth-of-type(3){animation-delay:.4s}
@keyframes lgdot{0%,70%,100%{opacity:.25}35%{opacity:1;transform:translateY(-4px)}}
.gload .lg-bar{width:min(260px,64vw);height:12px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.gload .lg-bar::after{content:'';display:block;height:100%;width:42%;border-radius:99px;background:var(--yel);animation:lgbar 1.2s ease-in-out infinite}
@keyframes lgbar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (max-width:560px){.ansg{gap:8px}.lobgrid{grid-template-columns:1fr}.brand{font-size:24px}.panel{padding:16px;border-radius:24px}body::before{width:170px;height:170px;right:-60px}}
@media (prefers-reduced-motion:reduce){.pod .bar,.ans.good,.rmsg,.gload i,.gload .lg-bar::after,.gload .lg-sign b{animation:none}}
.ans span{overflow-wrap:break-word}
.ans em{position:absolute;right:10px;top:-10px;font-size:.8em;padding:0 10px;box-shadow:0 2px 0 #b9acff;background:#fff}
.ans u{position:absolute;right:-6px;bottom:-12px;background:#fff;border-radius:50%;width:1.5em;height:1.5em;line-height:1.5em;text-align:center;font-size:1.2em;box-shadow:0 3px 0 #2FB67C}
.ans.good{overflow:visible}.ans{overflow:visible}
.qchat{width:min(320px,calc(100vw - 28px))}.qc-pop{width:100%}.qc-fab{justify-self:end}
#ch-form,.qc-pop *{min-width:0}
/* ===== thème Loup-Garou ===== */
:root{--bg1:#060a22;--bg2:#1b1560;--pur:#ff8a3d;--pur2:#0a0725;--ink:#f1edff;--ink2:#b9b0ff}
body{background:radial-gradient(circle at 12% 8%,rgba(90,60,200,.5) 0 18%,transparent 40%),radial-gradient(circle at 92% 92%,rgba(255,138,61,.18) 0 14%,transparent 38%),linear-gradient(170deg,#060a22,#16104f 70%,#2a1466);transition:background .6s}
body::before{background:#f4efc8;opacity:.95;box-shadow:inset -34px -18px 0 rgba(190,180,120,.55),0 0 80px rgba(244,239,200,.45);width:200px;height:200px;top:9%;right:-50px}
body::after{border-color:#ff8a3d;opacity:.18}
body[data-t=d]{background:radial-gradient(circle at 12% 8%,rgba(255,255,255,.25) 0 14%,transparent 36%),linear-gradient(170deg,#3b82f6,#6d5ce8 75%,#a45fe0)}

  s.alive[id]=0;s.dead.push({id:id,role:s.roles[id],why:why,n:s.n});s.nt.died.push(id);
  lgLog(s,lgNm(s,id)+' est mort ('+why+') : '+LG_ROLES[s.roles[id]].n);

}

/* acts : {id:{k,t}} pour l'étape courante ; renvoie true si l'état a changé */
function lgTick(s,acts,now){

        else if(String(a.t).slice(0,2)==='p:'&&s.pot.p&&s.alive[String(a.t).slice(2)]){s.pot.p=0;s.nt.poi=String(a.t).slice(2);}

    return false;
  }
  if(s.ph==='vote'){
    const vt=lgVoters(s),vs=vt.map(p=>A(p.id)&&A(p.id).k==='vote'?A(p.id).t:undefined);
    if(vs.every(x=>x!==undefined)||el>s.dur){
      const real=vs.filter(x=>x&&x!=='blank'&&s.alive[x]),mk=s.nt.mark&&s.alive[s.nt.mark]?s.nt.mark:'';
      if(mk){real.push(mk);real.push(mk);}
      const pl=lgPlural(real),out=pl.top.length===1?pl.top[0]:'',sp=out&&s.roles[out]==='idiot'&&!s.idiotUsed?1:0;
      s.vote={tally:pl.c,out:out,mark:mk,sp:sp};

    }
    return false;
  }
  if(s.ph==='vres'){
    if(el>s.dur){
      const out=s.vote.out;
      if(out&&s.vote.sp){s.idiotUsed=1;s.idiot=out;lgLog(s,lgNm(s,out)+' est l\'idiot du village : gracié, mais il ne vote plus.');}
      else if(out){
        s.nt.died=[];lgKill(s,out,'éliminé par le village');
        if(lgWin(s))return true;
        const hd=s.nt.died.find(i=>s.roles[i]==='hunter');
        if(hd){lgEv(s,'hunter',{by:hd});lgPh(s,'hunter',30000);s.hunt={by:hd,after:'night'};return true;}
      }else lgLog(s,'Égalité : personne n\'est éliminé.');
      lgStartNight(s);return true;

function lgDawn(s){
  s.nt.died=[];
  const v=s.nt.v;
  if(v&&s.nt.heal)lgLog(s,'La sorcière a sauvé la victime des loups.');
  else if(v){
    if(s.nt.guard===v){s.nt.saved=1;lgLog(s,'Le salvateur a protégé la victime des loups.');}
    else if(s.roles[v]==='elder'&&!s.elderUsed){s.elderUsed=1;s.nt.saved=1;lgLog(s,'L\'ancien a survécu à l\'attaque des loups.');}
    else lgKill(s,v,'dévoré par les loups');
  }
  if(s.nt.poi&&s.alive[s.nt.poi])lgKill(s,s.nt.poi,'empoisonné');
  if(!s.nt.died.length)lgLog(s,'Cette nuit, personne n\'est mort.');
  s.nt.hunter=s.nt.died.find(i=>s.roles[i]==='hunter')||'';
  lgEv(s,'dawn',{d:s.nt.died.slice()});
  if(lgWin(s))return;
  lgPh(s,'dawn',s.nt.died.length>1?11000:9000);
}
/* bot : renvoie {k,t} pour l'étape courante, ou null */
function lgHash(str){let x=0;for(let i=0;i<str.length;i++)x=(x*31+str.charCodeAt(i))>>>0;return x;}
function lgBotAct(s,id){
  if(s.ph==='end'||!s.alive[id]&&!(s.ph==='hunter'&&s.hunt.by===id))return null;
  const r=s.roles[id],seed=lgHash(s.gid+s.st+id);
  const pick=arr=>arr.length?arr[seed%arr.length]:null;
  if(s.ph==='night_c'&&r==='cupid'){const c=lgAlive(s).map(p=>p.id).sort();const i=seed%c.length,j=(i+1+((seed>>4)%(c.length-1)))%c.length;return{k:'cupid',t:c[i]+'|'+c[j]};}
  if(s.ph==='night_g'&&r==='guard'){const t=pick(lgAlive(s).map(p=>p.id).filter(x=>x!==s.lastG).sort());return t?{k:'guard',t:t}:null;}
  if(s.ph==='night_w'&&r==='wolf'){const c=lgAlive(s).filter(p=>s.roles[p.id]!=='wolf').map(p=>p.id).sort();const t=c.length?c[lgHash(s.gid+s.st)%c.length]:null;return t?{k:'wolf',t:t}:null;}
  if(s.ph==='night_s'&&r==='seer'&&!s.nt.seen){const t=pick(lgTargets(s,id));return t?{k:'seer',t:t}:null;}
  if(s.ph==='night_h'&&r==='witch'){
    if(s.pot.h&&s.nt.v&&seed%3===0)return{k:'witch',t:'heal'};
    if(s.pot.p&&seed%5===0){const t=pick(lgTargets(s,id));if(t)return{k:'witch',t:'p:'+t};}
    return{k:'witch',t:'none'};
  }
  if(s.ph==='night_r'&&r==='raven'){const t=pick(lgTargets(s,id).sort());return t?{k:'raven',t:t}:{k:'raven',t:'none'};}
  if(s.ph==='hunter'&&s.hunt.by===id){const t=pick(lgTargets(s,id));return t?{k:'hunt',t:t}:null;}
  if(s.ph==='day')return Date.now()-s.t0>10000?{k:'skip',t:''}:null;
  if(s.ph==='vote'){if(s.idiot===id)return null;const c=lgTargets(s,id).filter(x=>r!=='wolf'||s.roles[x]!=='wolf');const t=pick(c);return{k:'vote',t:t||'blank'};}
  return null;
}

        h('div',null,'Rôles spéciaux : 🔮 Voyante, 🧪 Sorcière, 🏹 Chasseur, 💘 Cupidon, 🛡️ Salvateur, 🐦‍⬛ Corbeau, 👧 Petite fille, 👴 Ancien, 🤡 Idiot du village. ',h('b',null,'Tu choisis ceux de la partie'),' avant de lancer.'),
        h('div',null,h('b',null,'Conseil'),' : jouez en vocal ou ensemble, le chat est là pour le débat de jour.')),
      pendingJoin?null:h('div',{class:'stack'},h('p',{class:'muted'},'Ton pseudo :'),nm)),
    h('div',{class:'panel'},h('h2',null,'Jouer en ligne'),h('div',{class:'rooms'},rooms),
      !db?h('p',{class:'err'},'Connexion à la base impossible : seul le mode solo est disponible.'):null),
    h('div',{class:'panel'},h('h2',null,'Solo contre des bots'),
      h('div',{class:'row'},h('span',null,'Bots'),segEl([3,4,5,6,7,8],'bots',v=>String(v),render)),
      h('details',{class:'rdet'},h('summary',null,'🎭 Choisir les rôles'),roleChooser(cfg.bots+1,true)),
      h('button',{id:'solo-go',class:'btn primary',type:'button',disabled:myName.length<2,onclick:startSolo},'🌙 Lancer la partie'))];
}
function renderLobby(){
  const ps=roomPlayers(ROOM).slice(0,MAXP),host=ps[0]&&ps[0].id===uid,can=host&&ps.length>=MINP;
  return[renderTop('Table '+ROOM,h('button',{class:'btn sm',type:'button',onclick:leaveRoom},'↩ Quitter la table')),
    h('div',{class:'lobgrid'},
      h('div',{class:'panel'},h('h2',null,'Salle d\'attente · Table '+ROOM),
        ...ps.map((p,i)=>h('div',{class:'pl'},avEl(p),h('b',null,p.name+(p.id===uid?' (toi)':'')),i===0?h('span',{class:'muted'},'Hôte'):null)),
        h('p',{class:'muted'},ps.length+' joueur'+(ps.length>1?'s':'')+' · minimum '+MINP+', idéal 6 à 12'),
        h('button',{class:'btn sm',type:'button',onclick:()=>{const u=joinUrl();(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>banner('Lien copié ✔','#7CE7B0')).catch(()=>prompt('Copie ce lien :',u));}},'📋 Copier le lien d\'invitation')),
      h('div',{class:'panel'},h('h2',null,'Rôles de cette partie'),roleChooser(Math.max(ps.length,MINP),host,host?null:parseRc((ps[0]||{}).rc)),
        host?h('div',{class:'stack'},h('div',{class:'row'},h('span',null,'Débat de jour'),segEl([60000,120000,180000],'day',v=>(v/60000)+' min',render)),
          h('button',{class:'btn primary',type:'button',disabled:!can,onclick:startOnline},'🌙 Lancer la partie'),
          can?null:h('p',{class:'muted'},'Il faut au moins '+MINP+' joueurs.'))
        :h('p',{class:'muted'},'L\'hôte lance la partie…')))];
}
function pcard(p,o){
  const s=S,dead=!s.alive[p.id],me=p.id===uid;
  const r=s.roles[p.id],showR=dead||s.ph==='end'||me,wolfMate=!dead&&me===false&&s.roles[uid]==='wolf'&&r==='wolf';
  const cls='pc'+(dead?' dead':'')+(me?' me':'')+(o.sel?' sel':'')+(o.can?' can':'')+(o.mine?' mine':'');
  const b=h('button',{type:'button',class:cls,disabled:!o.can,onclick:()=>o.can&&o.on(p.id)},
    avEl(p),h('b',null,p.name+(me?' (toi)':'')),
    dead?h('span',{class:'tag'},'💀 '+R(r).n):(s.idiot===p.id?h('span',{class:'tag'},'🤡 Idiot (sans vote)'):s.ph==='end'?h('span',{class:'tag'},R(r).e+' '+R(r).n):(wolfMate?h('span',{class:'tag'},'🐺 loup'):null)),
    o.badge?h('span',{class:'bdg'},o.badge):(!dead&&s.lov&&s.lov.length===2&&s.lov.includes(uid)&&s.lov.includes(p.id)&&!me?h('span',{class:'bdg lov'},'💘'):null));
  return b;
}
function grid(o){
  const s=S;
  return h('div',{class:'pgrid'},s.players.map(p=>{
    const can=o.can&&o.can(p),extra=o.badge?o.badge(p):'';
    return pcard(p,{can:can,on:o.on,sel:o.sel&&o.sel(p),badge:extra});
  }));
}
function rolecard(){
  const s=S,r=s.roles[uid];if(!r)return null;
  const dead=!s.alive[uid];
  return h('div',{class:'rolec'+(dead?' dead':'')+(showRole?'':' hid')},
    h('button',{type:'button',class:'rc-e',onclick:()=>{showRole=!showRole;render();},'aria-label':'Montrer ou cacher mon rôle'},showRole?R(r).e:'🎴'),
    h('div',{class:'rc-t'},showRole?h('b',null,'Ton rôle : '+R(r).n):h('b',null,'Rôle caché (touche la carte)'),showRole?h('small',null,R(r).d):null),
    dead?h('span',{class:'tag'},'💀 éliminé'):(s.lov&&s.lov.includes(uid)?h('span',{class:'tag'},'💘 avec '+lgNm(s,s.lov[0]===uid?s.lov[1]:s.lov[0])):null));
}
const phTitle=s=>({night_c:'🌙 Nuit '+s.n+' · Cupidon choisit',night_g:'🌙 Nuit '+s.n+' · le salvateur veille',night_r:'🌙 Nuit '+s.n+' · le corbeau rôde',night_w:'🌙 Nuit '+s.n+' · les loups chassent',night_s:'🌙 Nuit '+s.n+' · la voyante regarde',night_h:'🌙 Nuit '+s.n+' · la sorcière agit',dawn:'🌅 Le jour se lève',hunter:'🏹 Le chasseur tire',day:'☀️ Jour '+s.n+' · débat',vote:'🗳️ Vote du village',vres:'🗳️ Résultat du vote',end:'🏁 Fin de partie'})[s.ph]||'';
function renderGame(){
  const s=S,spec=isSpec(),me=uid,myR=s.roles[me],alive=!!s.alive[me];
  const out=[renderTop(phTitle(s),h('button',{class:'btn sm',type:'button',onclick:()=>{if(confirm('Quitter la partie ?'))leaveRoom();}},'↩ Quitter'))];
  const bar=h('div',{class:'lgbar'},h('span',{class:'lgph'},phTitle(s)),s.dur?h('b',{id:'tnum',class:'tnum'},''):null);
  out.push(bar);
  if(!spec&&s.ph!=='end')out.push(rolecard());
  {const c={};s.players.forEach(p=>{const r=s.roles[p.id];c[r]=(c[r]||0)+1;});out.push(h('div',{class:'rp comp'},Object.keys(LG_ROLES).filter(r=>c[r]).map(r=>h('span',{class:'rpi',title:R(r).d},R(r).e+' '+c[r]))));}
  const asleep=h('div',{class:'panel dk sleep'},h('div',{class:'zz'},'😴'),h('p',null,alive?'Tu dors… le village est silencieux.':'Tu regardes la partie.'));
  const body=[];
  const alv=p=>!!s.alive[p.id];
  const mineAct=myAct&&myAct.g===s.gid&&myAct.s===s.st?myAct:null;
  if(s.ph==='night_c'){
    if(myR==='cupid'&&alive){
      body.push(h('div',{class:'panel dk'},h('h2',null,'💘 Qui font les amoureux ?'),h('p',{class:'muted'},'Choisis 2 joueurs (toi compris si tu veux). Si l\'un meurt, l\'autre meurt de chagrin.'),
        grid({can:p=>alv(p)&&!mineAct,on:id=>{cupSel=cupSel.includes(id)?cupSel.filter(x=>x!==id):cupSel.concat([id]).slice(-2);render();},sel:p=>cupSel.includes(p.id)||(mineAct&&String(mineAct.t).split('|').includes(p.id))}),
        h('button',{type:'button',class:'btn primary',disabled:cupSel.length!==2||!!mineAct,onclick:()=>act('cupid',cupSel.join('|'))},mineAct?'✔ Choix validé':'💘 Valider le couple')));
    }else body.push(asleep);
  }else if(s.ph==='night_g'){
    if(myR==='guard'&&alive)body.push(h('div',{class:'panel dk'},h('h2',null,'🛡️ Qui protéger cette nuit ?'),h('p',{class:'muted'},'Il survivra à l\'attaque des loups. Pas le même joueur deux nuits de suite.'),
      grid({can:p=>alv(p)&&p.id!==s.lastG&&!mineAct,on:id=>act('guard',id),sel:p=>mineAct&&mineAct.t===p.id,badge:p=>p.id===s.lastG?'🚫':''})));
    else body.push(asleep);
  }else if(s.ph==='night_r'){
    if(myR==='raven'&&alive)body.push(h('div',{class:'panel dk'},h('h2',null,'🐦‍⬛ Qui accuser ?'),h('p',{class:'muted'},'Ce joueur aura 2 voix en plus au vote de demain.'),
      grid({can:p=>alv(p)&&p.id!==me&&!mineAct,on:id=>act('raven',id),sel:p=>mineAct&&mineAct.t===p.id}),
      h('button',{type:'button',class:'btn sm',disabled:!!mineAct,onclick:()=>act('raven','none')},'Ne marquer personne')));
    else body.push(asleep);
  }else if(s.ph==='night_w'){
    if(myR==='wolf'&&alive){
      const picks={};s.players.forEach(p=>{if(s.roles[p.id]==='wolf'&&s.alive[p.id]){const a=actsFor(s)[p.id];if(a&&a.k==='wolf')(picks[a.t]=picks[a.t]||[]).push(p.name.split(' ')[0]);}});
      body.push(h('div',{class:'panel dk'},h('h2',null,'🐺 Choisissez votre victime'),h('p',{class:'muted'},'Tous les loups doivent désigner la même personne. Chaque loup voit les choix des autres.'),
        grid({can:p=>alv(p)&&s.roles[p.id]!=='wolf',on:id=>act('wolf',id),sel:p=>mineAct&&mineAct.t===p.id,badge:p=>(picks[p.id]||[]).map(n=>'🐺'+n).join(' ')})));
    }else if(myR==='little'&&alive){
      const ac=actsFor(s),lines=[];
      s.players.forEach(p=>{if(s.roles[p.id]==='wolf'&&s.alive[p.id]){const a=ac[p.id];if(a&&a.k==='wolf')lines.push('Un loup ('+p.name.trim()[0]+'…) vise '+lgNm(s,a.t));}});
      body.push(h('div',{class:'panel dk sleep'},h('div',{class:'zz'},'👧'),h('h2',null,'Tu entrouvres les volets…'),
        lines.length?lines.map(t=>h('p',{class:'bigtxt'},t)):h('p',{class:'muted'},'Les loups se concertent dans l\'ombre…')));
    }else body.push(asleep);
  }else if(s.ph==='night_s'){
    if(myR==='seer'&&alive){
      if(s.nt.seen){const t=s.players.find(p=>p.id===s.nt.seen.id);body.push(h('div',{class:'panel dk'},h('h2',null,'🔮 Ta vision'),h('p',{class:'bigtxt'},t.name+' est '+R(s.nt.seen.role).e+' '+R(s.nt.seen.role).n)));}
      else body.push(h('div',{class:'panel dk'},h('h2',null,'🔮 Qui veux-tu sonder ?'),grid({can:p=>alv(p)&&p.id!==me,on:id=>act('seer',id),sel:p=>mineAct&&mineAct.t===p.id})));
    }else body.push(asleep);
  }else if(s.ph==='night_h'){
    if(myR==='witch'&&alive){
      const v=s.nt.v?s.players.find(p=>p.id===s.nt.v):null;
      const poi=mineAct&&String(mineAct.t).slice(0,2)==='p:';
      body.push(h('div',{class:'panel dk'},h('h2',null,'🧪 La sorcière'),
        h('p',{class:'bigtxt'},v?'Les loups ont attaqué '+v.name:'Les loups n\'ont attaqué personne'),
        h('div',{class:'row ctr'},
          h('button',{type:'button',class:'btn',disabled:!s.pot.h||!v||!!mineAct,onclick:()=>act('witch','heal')},'💚 Sauver '+(s.pot.h?'':'(utilisée)')),
          h('button',{type:'button',class:'btn',disabled:!!mineAct,onclick:()=>act('witch','none')},'Ne rien faire')),
        s.pot.p?h('div',{class:'stack'},h('p',{class:'muted'},'☠️ Potion de mort : choisis une cible (ou ignore).'),grid({can:p=>!mineAct&&alv(p)&&p.id!==me,on:id=>act('witch','p:'+id),sel:p=>poi&&mineAct.t==='p:'+p.id})):h('p',{class:'muted'},'Potion de mort déjà utilisée.')));
    }else body.push(asleep);
  }else if(s.ph==='dawn'){
    const dd=(s.nt.died||[]);
    body.push(h('div',{class:'panel dk'},h('h2',null,'🌅 Cette nuit…'),
      dd.length?dd.map(id=>h('p',{class:'bigtxt'},'💀 '+lgNm(s,id)+' est mort… c\'était '+R(s.roles[id]).e+' '+R(s.roles[id]).n)):h('p',{class:'bigtxt'},'Personne n\'est mort cette nuit ! 🎉')));
  }else if(s.ph==='hunter'){
    const hid=s.hunt.by;
    if(hid===me)body.push(h('div',{class:'panel dk'},h('h2',null,'🏹 Dernier tir !'),h('p',{class:'muted'},'Choisis qui tu emportes avec toi.'),grid({can:p=>alv(p),on:id=>act('hunt',id),sel:p=>mineAct&&mineAct.t===p.id})));
    else body.push(h('div',{class:'panel dk sleep'},h('div',{class:'zz'},'🏹'),h('p',null,lgNm(s,hid)+' (chasseur) choisit sa cible…')));
  }else if(s.ph==='day'){
    const sk=lgAlive(s).filter(p=>{const a=actsFor(s)[p.id];return a&&a.k==='skip';}).length;
    body.push(h('div',{class:'panel dk'},h('h2',null,'☀️ Débattez !'),h('p',{class:'muted'},'Qui est le loup ? Discutez (vocal ou chat 💬), puis le village votera.'),
      alive?h('button',{type:'button',class:'btn primary',disabled:!!mineAct,onclick:()=>act('skip','')},mineAct?'✔ En attente du vote… ('+sk+' / '+lgAlive(s).length+')':'⏭ Passer au vote ('+sk+' / '+lgAlive(s).length+')'):null,
      h('p',{class:'muted'},'Le vote démarre quand la majorité le demande ou quand le temps est écoulé.')));
  }else if(s.ph==='vote'){
    const ac=actsFor(s);
    body.push(h('div',{class:'panel dk'},h('h2',null,'🗳️ Qui éliminer ?'),h('p',{class:'muted'},'Vote en secret. Égalité = personne n\'est éliminé. Ont voté : ',h('b',{id:'vcount','data-k':'vote'},'')),
      grid({can:p=>alive&&me!==s.idiot&&alv(p)&&p.id!==me&&!ac[me],on:id=>act('vote',id),sel:p=>mineAct&&mineAct.t===p.id,badge:p=>ac[p.id]&&ac[p.id].k==='vote'?'✔':''}),
      alive&&me!==s.idiot?h('button',{type:'button',class:'btn sm',disabled:!!ac[me],onclick:()=>act('vote','blank')},'Voter blanc'):null,
      me===s.idiot?h('p',{class:'muted'},'🤡 Tu as été gracié : tu ne votes plus.'):null,
      s.nt.mark&&s.alive[s.nt.mark]?h('p',{class:'muted'},'🐦‍⬛ Le corbeau a marqué '+lgNm(s,s.nt.mark)+' : +2 voix contre lui.'):null));
  }else if(s.ph==='vres'){
    const tl=s.vote.tally,max=Math.max(1,...Object.values(tl),1);
    body.push(h('div',{class:'panel dk'},h('h2',null,'🗳️ Résultat'),
      ...Object.keys(tl).sort((a,b)=>tl[b]-tl[a]).map(id=>h('div',{class:'tl'},h('span',null,lgNm(s,id)),h('div',{class:'tlb'},h('i',{style:'width:'+(tl[id]/max*100)+'%'})),h('b',null,String(tl[id])))),
      Object.keys(tl).length?null:h('p',{class:'muted'},'Aucun vote exprimé.'),
      s.vote.mark?h('p',{class:'muted'},'🐦‍⬛ +2 voix du corbeau sur '+lgNm(s,s.vote.mark)):null,
      s.vote.sp?h('p',{class:'bigtxt'},'🤡 '+lgNm(s,s.vote.out)+' est l\'idiot du village : gracié !'):s.vote.out?h('p',{class:'bigtxt'},'💀 '+lgNm(s,s.vote.out)+' est éliminé… c\'était '+R(s.roles[s.vote.out]).e+' '+R(s.roles[s.vote.out]).n):h('p',{class:'bigtxt'},'Égalité : personne n\'est éliminé.')));
  }else if(s.ph==='end'){
    const w=s.winner==='village';
    const mineWon=!spec&&(s.winner==='lovers'?s.lov.includes(me):((s.roles[me]==='wolf')!==w));
    body.push(h('div',{class:'panel dk endp'},h('h2',null,w?'🧑‍🌾 Le village a gagné !':(s.winner==='lovers'?'💘 Les amoureux ont gagné !':'🐺 Les loups ont gagné !')),
      !spec?h('p',{class:'bigtxt'},mineWon?'Tu as gagné ! 🎉':'Perdu… 😅'):null,
      h('div',{class:'row ctr'},(mode==='solo'||isHost())?h('button',{class:'btn primary',type:'button',onclick:endGameHost},mode==='solo'?'↩ Menu':'🔁 Rejouer'):h('p',{class:'muted'},'L\'hôte peut relancer une partie…'),h('button',{class:'btn',type:'button',onclick:leaveRoom},'Quitter'))));
  }
  out.push(...body);

  if(!['night_w','night_s','night_h','hunter','vote'].includes(s.ph)||!body.some(b=>b.querySelector&&b.querySelector('.pgrid')))

  out.push(h('div',{class:'panel dk lglog'},s.log.slice(-6).map(t=>h('div',null,t))));
  return out;
}

async function boot(){
  setTimeout(hideLoader,6000);
  uid=lsGet('f7id');if(!uid){uid='g_'+Math.random().toString(36).slice(2,12);lsSet('f7id',uid);}
  const m=/[?&]table=(\d{1,2})/.exec(location.search);if(m)pendingJoin=+m[1];
  chatBox();render();
  setInterval(tick,400);
  if(window.F7_FIREBASE){
    try{db=await loadFirebase(window.F7_FIREBASE);}catch(e){db=null;}
    if(db){
      lobUnsub=db.collection('lobby').onSnapshot(sn=>{
        roster=sn.docs.filter(d=>d.id.startsWith('lg_')).map(d=>{const v=d.data()||{};return{id:d.id.slice(3),name:String(v.name||'?').slice(0,16),t:+v.t||0,seen:+v.seen||0,room:+v.room||0,pf:String(v.pf||''),rc:String(v.rc||''),av:v.av,ag:v.ag,as:v.as,ak:v.ak,at:v.at};});
        if(!mode||(mode==='online'&&!S))render();
      },()=>{});
      setInterval(()=>{if(!mode||(mode==='online'&&!S))render();},8000);
    }
    startChat();
    if(pendingJoin&&db&&myName.trim().length>=2)joinRoom(pendingJoin);else render();
  }
  hideLoader();
  window.addEventListener('beforeunload',()=>{if(db&&ROOM)db.doc('lobby/lg_'+uid).delete().catch(()=>{});});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)beat();ambSync();});
  document.addEventListener('pointerdown',()=>ambSync(),{passive:true});
}

boot();
