<style>

<script>
'use strict';
/* =====================  BILLARD ATELIER  ===================== */
const $=id=>document.getElementById(id);
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}};
const sv=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
$('ver').textContent=window.AT_VER||'';
/* ---------- constantes de la table ---------- */
const PW=1000,PH=500,RL=58,R=12,DEC=210,VMAX=1900;
const FW=PW+2*RL,FH=PH+2*RL;
const POCKETS=[[0,0,26],[PW,0,26],[0,PH,26],[PW,PH,26],[PW/2,-7,23],[PW/2,PH+7,23]];
const BCOL=['#f2f2f2','#f4c20d','#1d56d8','#d8262c','#5b2aa8','#f2711c','#17924a','#7d1d1d','#111111'];
/* ---------- état ---------- */
let balls=[],sim={on:false},G=null,mode='title',myIdx=0,vs='bot',names=['Moi','Robot'],ws=null,wsOk=false,roomsInfo={},roomMembers=[],room=0,uid=ld('f7id','');
if(!uid){uid='g_'+Math.random().toString(36).slice(2,12);sv('f7id',uid);}
let aim={a:0,p:0,sx:0,sy:0,hold:false},opAim=null,cueHand=null,msgT=0,timeLeft=30,timerOn=false,shotN=0,sinks=[];
let Q={w:0,h:0,s:1,dpr:1,portrait:false,m:null,inv:null};
/* ---------- audio ---------- */
let AC=null;function audio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function tone(f,d,t,v,sl){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*sl),AC.currentTime+d);g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function sClick(v){tone(2100+Math.random()*500,.05,'triangle',Math.min(.25,.03+v*.0002));tone(900,.08,'sine',Math.min(.2,v*.00012),.5);}
function sRail(v){tone(130,.12,'sine',Math.min(.22,v*.00015),.6);}
function sPocket(){tone(260,.22,'sine',.2,.4);setTimeout(()=>tone(110,.25,'sine',.18,.6),90);}
function sCue(p){tone(180,.09,'square',.05+p*.12,.5);sClick(p*1500);}
/* ---------- bille ---------- */
function mkBall(id,x,y){return{id,x,y,vx:0,vy:0,alive:true,yaw:0,roll:0,sink:0,px:0,py:0};}
function rack(){
  balls=[];const cue=mkBall(0,PW*.25,PH/2);balls.push(cue);
  const fx=PW*.72,dx=R*2*.88,order=[1,9,2,10,8,3,11,4,12,5,13,6,14,7,15]; // 8 au centre
  // rangs triangulaires : rang r (0..4) a r+1 billes
  const ord=[1,9,2,10,8,11,3,12,4,13,5,14,6,15,7];let k=0;
  const ids=[1,10,3,9,8,12,5,14,13,2,6,11,15,7,4].slice();
  // positions standard : coin avant 1, centre 8, coins arrière une pleine une rayée
  const place=[1,10,3,11,8,4,2,12,9,13,14,5,15,6,7];
  for(let r=0;r<5;r++)for(let c=0;c<=r;c++){const id=place[k++];balls.push(mkBall(id,fx+r*dx,PH/2+(c-r/2)*(R*2+.6)));}
}
const cueBall=()=>balls[0];
const isSolid=id=>id>=1&&id<=7,isStripe=id=>id>=9;
const grpOf=id=>id===8?'8':isSolid(id)?'solid':'stripe';
/* ---------- rendu : sprites ---------- */
let SP={},STAT=null,GLOSS=null,SHAD=null;
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c;}
function buildSprites(){
  SP={};const px=R*Q.s*Q.dpr,D=Math.ceil(px*2*2);const K=D/ (2*R); // 2x supersample
  for(let id=0;id<=15;id++){
    const c=mkCanvas(D,D),x=c.getContext('2d');x.translate(D/2,D/2);x.scale(K,K);
    x.beginPath();x.arc(0,0,R,0,7);x.clip();
    const col=id===0?'#fff':id===8?'#101010':BCOL[id>8?id-8:id];
    if(isStripe(id)){x.fillStyle='#f7f7f2';x.fillRect(-R,-R,2*R,2*R);x.fillStyle=col;x.fillRect(-R,-R*.56,2*R,R*1.12);}
    else{x.fillStyle=col;x.fillRect(-R,-R,2*R,2*R);}
    SP[id]=c;
  }
  // brillance commune
  const gk=Math.ceil(px*2*2);GLOSS=mkCanvas(gk,gk);let x=GLOSS.getContext('2d');const kk=gk/(2*R);x.translate(gk/2,gk/2);x.scale(kk,kk);
  let g=x.createRadialGradient(-R*.28,-R*.34,R*.05,0,0,R);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.55,'rgba(0,0,0,0)');g.addColorStop(.88,'rgba(0,0,0,.28)');g.addColorStop(1,'rgba(0,0,0,.62)');
  x.fillStyle=g;x.beginPath();x.arc(0,0,R,0,7);x.fill();
  g=x.createRadialGradient(-R*.38,-R*.42,0,-R*.38,-R*.42,R*.5);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.4,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.beginPath();x.arc(-R*.38,-R*.42,R*.5,0,7);x.fill();
  x.fillStyle='rgba(255,255,255,.22)';x.beginPath();x.ellipse(R*.42,R*.5,R*.28,R*.1,-.6,0,7);x.fill();
  // ombre
  const sk=Math.ceil(px*2*2.6);SHAD=mkCanvas(sk,sk);x=SHAD.getContext('2d');g=x.createRadialGradient(sk/2,sk/2,sk*.1,sk/2,sk/2,sk/2);g.addColorStop(0,'rgba(0,0,30,.55)');g.addColorStop(.6,'rgba(0,0,30,.28)');g.addColorStop(1,'rgba(0,0,30,0)');x.fillStyle=g;x.fillRect(0,0,sk,sk);
}
function drawBall(x,b,alpha){
  const sc=b.sink?1-b.sink*.45:1;
  x.save();x.translate(b.x,b.y);x.globalAlpha=alpha==null?1:alpha;
  // ombre
  x.drawImage(SHAD,-R*1.3+3,-R*1.3+5,R*2.6*1,R*2.6*1);
  x.scale(sc,sc);
  x.save();x.rotate(b.yaw);const D=SP[b.id].width;x.drawImage(SP[b.id],-R,-R,2*R,2*R);x.restore();
  if(b.id>0){ // pastille numérotée qui roule
    const ph=b.roll,cs=Math.cos(ph),sn=Math.sin(ph);
    if(cs>-.15){x.save();x.rotate(b.yaw);x.translate(sn*R*.62,0);x.scale(Math.max(.15,cs),1);
      x.beginPath();x.arc(0,0,R*.5,0,7);x.fillStyle='#fff';x.fill();
      x.fillStyle='#111';x.font='900 '+(R*.62)+'px Nunito,Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(String(b.id),0,R*.04);x.restore();}
  }else{ // point rouge sur la blanche
    const ph=b.roll,cs=Math.cos(ph),sn=Math.sin(ph);if(cs>0){x.save();x.rotate(b.yaw);x.translate(sn*R*.62,0);x.scale(cs,1);x.beginPath();x.arc(0,0,R*.14,0,7);x.fillStyle='#d62828';x.fill();x.restore();}
  }
  x.drawImage(GLOSS,-R,-R,2*R,2*R);
  x.restore();x.globalAlpha=1;
}
/* ---------- rendu : table statique ---------- */
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function buildStatic(){
  const c=mkCanvas(Q.w,Q.h);STAT=c;const x=c.getContext('2d');x.setTransform(Q.m);
  // cadre bois
  let g=x.createLinearGradient(0,0,0,FH);g.addColorStop(0,'#8a4a22');g.addColorStop(.5,'#6a3517');g.addColorStop(1,'#4a2310');
  rr(x,0,0,FW,FH,46);x.fillStyle=g;x.fill();
  x.save();rr(x,0,0,FW,FH,46);x.clip();
  for(let i=0;i<260;i++){x.strokeStyle='rgba('+(i%2?'255,210,150':'30,10,0')+','+(.03+Math.random()*.06)+')';x.lineWidth=.6+Math.random()*1.6;const y=Math.random()*FH;x.beginPath();x.moveTo(0,y);x.bezierCurveTo(FW*.3,y+Math.random()*10-5,FW*.7,y+Math.random()*10-5,FW,y+Math.random()*8-4);x.stroke();}
  // lumière haut
  g=x.createLinearGradient(0,0,0,40);g.addColorStop(0,'rgba(255,230,190,.45)');g.addColorStop(1,'rgba(255,230,190,0)');x.fillStyle=g;x.fillRect(0,0,FW,40);
  x.restore();
  rr(x,3,3,FW-6,FH-6,44);x.lineWidth=3;x.strokeStyle='rgba(255,220,170,.35)';x.stroke();
  // bande de coussin (bleu foncé) et tapis
  const cu=16;rr(x,RL-cu,RL-cu,PW+2*cu,PH+2*cu,10);g=x.createLinearGradient(0,RL-cu,0,RL+PH+cu);g.addColorStop(0,'#0c4f8e');g.addColorStop(1,'#093e72');x.fillStyle=g;x.fill();
  x.save();x.translate(RL,RL);
  rr(x,0,0,PW,PH,4);x.save();x.clip();
  g=x.createRadialGradient(PW/2,PH/2,40,PW/2,PH/2,PW*.62);g.addColorStop(0,'#33a8f5');g.addColorStop(.6,'#1a82d6');g.addColorStop(1,'#0e5fa8');x.fillStyle=g;x.fillRect(-20,-20,PW+40,PH+40);
  // grain de tapis
  for(let i=0;i<9000;i++){x.fillStyle='rgba('+(Math.random()<.5?'255,255,255':'0,30,80')+','+(Math.random()*.05)+')';x.fillRect(Math.random()*PW,Math.random()*PH,1.2,1.2);}
  // filigrane
  x.fillStyle='rgba(255,255,255,.07)';x.font='400 84px "Lilita One",Nunito,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('ATELIER',PW*.74,PH/2+4);
  x.strokeStyle='rgba(255,255,255,.18)';x.lineWidth=2;x.beginPath();x.moveTo(PW*.25,16);x.lineTo(PW*.25,PH-16);x.stroke();

  if(!G||G.over)return;
  const c=cueBall();c.x=d.x;c.y=d.y;shotN=d.n;
  startShot(d.a,d.p,d.sx,d.sy);sim.auth=false;opAim=null;
}
/* ---------- entrée ---------- */
function toLog(e){const r=cv.getBoundingClientRect();const p=Q.inv.transformPoint(new DOMPoint((e.clientX-r.left)*Q.dpr,(e.clientY-r.top)*Q.dpr));return{x:p.x-RL,y:p.y-RL};}
let drag=null;
cv.addEventListener('pointerdown',e=>{
  audio();if(!mine()||sim.on||G.over)return;cv.setPointerCapture(e.pointerId);
  const p=toLog(e),c=cueBall();
  if(G.inHand&&Math.hypot(p.x-c.x,p.y-c.y)<R*3){drag='hand';return;}
  drag='aim';aim.a=Math.atan2(p.y-c.y,p.x-c.x);
});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;const p=toLog(e),c=cueBall();
  if(drag==='hand'){let x=Math.max(R+1,Math.min(PW-R-1,p.x)),y=Math.max(R+1,Math.min(PH-R-1,p.y));
    if(!balls.some(b=>b.id>0&&b.alive&&Math.hypot(b.x-x,b.y-y)<2*R+1)){c.x=x;c.y=y;}}
  else aim.a=Math.atan2(p.y-c.y,p.x-c.x);
});
const endDrag=()=>{drag=null;};cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
// barre de puissance
let pdrag=false;
function pwFrom(e){const r=$('pw').getBoundingClientRect();let f=Q.portrait?(e.clientX-r.left)/r.width:(r.bottom-e.clientY)/r.height;return Math.max(0,Math.min(1,f));}
$('pw').addEventListener('pointerdown',e=>{if(!mine()||sim.on)return;audio();pdrag=true;$('pw').setPointerCapture(e.pointerId);aim.p=pwFrom(e);});
$('pw').addEventListener('pointermove',e=>{if(pdrag)aim.p=pwFrom(e);});
const pwEnd=()=>{if(!pdrag)return;pdrag=false;shoot();};$('pw').addEventListener('pointerup',pwEnd);$('pw').addEventListener('pointercancel',()=>{pdrag=false;aim.p=0;});
// effet
function spinSet(e){const r=$('spin').getBoundingClientRect(),cxr=r.left+r.width/2,cyr=r.top+r.height/2;let dx=(e.clientX-cxr)/(r.width/2),dy=(e.clientY-cyr)/(r.height/2);const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}aim.sx=dx;aim.sy=-dy;$('spd').style.left=(50+dx*34)+'%';$('spd').style.top=(50+dy*34)+'%';}
let sdr=false;$('spin').addEventListener('pointerdown',e=>{sdr=true;$('spin').setPointerCapture(e.pointerId);spinSet(e);});
$('spin').addEventListener('pointermove',e=>{if(sdr)spinSet(e);});$('spin').addEventListener('pointerup',()=>sdr=false);
// viser finement
let rotH=0;for(const [id,s] of [['rl',-1],['rr',1]]){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();rotH=s;b.setPointerCapture(e.pointerId);});b.addEventListener('pointerup',()=>rotH=0);b.addEventListener('pointercancel',()=>rotH=0);}
setInterval(()=>{if(rotH&&mine()&&!sim.on){aim.a+=rotH*.0016*(1+(Date.now()%1000>0?0:0));}},16);
addEventListener('keydown',e=>{if(mode==='title'||!mine()||sim.on)return;
  if(e.key==='ArrowLeft')aim.a-=e.shiftKey?.012:.003;else if(e.key==='ArrowRight')aim.a+=e.shiftKey?.012:.003;
  else if(e.key==='ArrowUp')aim.p=Math.min(1,aim.p+.05);else if(e.key==='ArrowDown')aim.p=Math.max(0,aim.p-.05);
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();shoot();}});
// émojis
for(const b of $('emo').children)b.addEventListener('click',()=>{bubble(b.textContent,true);if(vs==='online')sendD({t:'emo',e:b.textContent});});
function bubble(e,me){const d=document.createElement('div');d.className='bub';d.textContent=e;d.style.left=(me?'60px':'auto');if(!me)d.style.right='70px';d.style.top='40%';$('stage').append(d);setTimeout(()=>d.remove(),1900);}
/* ---------- robot ---------- */
function clearSeg(x1,y1,x2,y2,ign){
  const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;if(l2<1)return true;
  for(const b of balls){if(!b.alive||b.sink||ign.includes(b.id))continue;
    let t=((b.x-x1)*dx+(b.y-y1)*dy)/l2;t=Math.max(0,Math.min(1,t));
    if(Math.hypot(x1+dx*t-b.x,y1+dy*t-b.y)<2*R-1)return false;}
  return true;
}
function botMove(){
  if(!G||G.over||G.turn!==1||vs!=='bot'||sim.on)return;
  const c=cueBall();
  if(G.inHand){ // pose la blanche derrière la ligne de tête, loin des billes
    for(let k=0;k<40;k++){const x=R+20+Math.random()*(PW*.25),y=R+20+Math.random()*(PH-2*R-40);if(!balls.some(b=>b.id>0&&b.alive&&Math.hypot(b.x-x,b.y-y)<3*R)){c.x=x;c.y=y;break;}}
    G.inHand=false;
  }
  const el=eligible(1);let best=null;
  for(const id of el){const t=balls.find(b=>b.id===id&&b.alive);if(!t)continue;
    for(const [px,py] of POCKETS){
      const ax=px<=0?px+10:px>=PW?px-10:px,ay=py<=0?py+10:py>=PH?py-10:py;
      const tx=ax-t.x,ty=ay-t.y,tl=Math.hypot(tx,ty);const ux=tx/tl,uy=ty/tl;
      const gx=t.x-ux*2*R,gy=t.y-uy*2*R;
      if(gx<R||gx>PW-R||gy<R||gy>PH-R)continue;
      const cx0=gx-c.x,cy0=gy-c.y,cl=Math.hypot(cx0,cy0);if(cl<2)continue;
      const cut=(cx0*ux+cy0*uy)/cl;if(cut<.35)continue;
      if(!clearSeg(c.x,c.y,gx,gy,[0,id])||!clearSeg(t.x,t.y,ax,ay,[0,id]))continue;
      const sc=cut*cut/(1+(cl+tl)/700);
      if(!best||sc>best.sc)best={sc,a:Math.atan2(cy0,cx0),d:cl+tl};
    }
  }
  let a,p;
  if(best){a=best.a+(Math.random()-.5)*.016;p=Math.max(.28,Math.min(.95,best.d/1250+.2));}
  else{const ts=el.map(id=>balls.find(b=>b.id===id&&b.alive)).filter(Boolean).sort((u,v)=>Math.hypot(u.x-c.x,u.y-c.y)-Math.hypot(v.x-c.x,v.y-c.y));const t=ts[0];a=t?Math.atan2(t.y-c.y,t.x-c.x)+(Math.random()-.5)*.03:Math.random()*6.28;p=.45;}
  if(G.brk){a=Math.atan2(PH/2-c.y,PW*.72-c.x);p=.95;}
  // anime la visée puis tire
  aim.a=a;timerOn=false;
  setTimeout(()=>{if(!G||G.over||G.turn!==1)return;shotN++;startShot(a,p,0,Math.random()<.2?.4:0);sim.auth=true;},700);
}
/* ---------- réseau ---------- */
const isWs=/^https?:$/.test(location.protocol);
function sendRaw(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));}
function sendD(d){sendRaw({k:'st',d:Object.assign({g:G?G.gid:0},d)});}
function connect(){
  if(ws&&ws.readyState<2)return;
  if(!isWs){net('Mode en ligne indisponible hors du site.');return;}
  try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/pool-ws');}catch(e){net('Connexion impossible.');return;}
  const me=ws;
  me.onopen=()=>{wsOk=true;sendRaw({k:'hi',uid,name:myName(),spec:{col:0}});if(room)sendRaw({k:'join',room});renderLobby();};
  me.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}onMsg(m);};
  me.onclose=()=>{if(ws===me){ws=null;wsOk=false;}renderLobby();if(mode==='lobby'||(mode==='game'&&vs==='online'))setTimeout(()=>{if(!wsOk&&(mode==='lobby'||mode==='game'))connect();},2000);};
  me.onerror=()=>{if(!wsOk)net('Serveur indisponible.');};
}
let neterr='';function net(t){neterr=t;renderLobby();}
const myName=()=>($('nm').value||ld('f7name','')||'Joueur').trim().slice(0,14);
function onMsg(m){
  if(m.k==='rooms'){roomsInfo=m.r||{};renderLobby();}
  else if(m.k==='room'){if(m.n===room||!room){room=m.n;const prev=roomMembers.length;roomMembers=(m.members||[]).map(p=>({id:p.id,name:String(p.name||'?').slice(0,14),t:p.t}));
    if(mode==='game'&&vs==='online'&&G&&!G.over&&roomMembers.length<2&&prev>=2){G.over=true;timerOn=false;toast('Ton adversaire est parti',2500);setTimeout(()=>showEnd(myIdx,'Ton adversaire a quitté la partie'),1200);}
    renderLobby();maybeStart();}}
  else if(m.k==='st'&&m.d&&m.u!==uid){onData(m.u,m.d);}
}
function maybeStart(){
  if(mode!=='lobby'||roomMembers.length<2)return;
  const host=roomMembers[0].id===uid;if(!host)return;
  if(maybeStart.sent)return;maybeStart.sent=true;
  setTimeout(()=>{if(mode!=='lobby'||roomMembers.length<2){maybeStart.sent=false;return;}
    const gid=Date.now(),first=Math.random()<.5?0:1,nm=[roomMembers[0].name,roomMembers[1].name];
    sendRaw({k:'st',d:{t:'go',g:gid,first,nm}});beginOnline(gid,first,nm,0);maybeStart.sent=false;},700);
}
function beginOnline(gid,first,nm,idx){
  vs='online';myIdx=idx;names=nm;mode='game';room=room;
  $('lobby').hidden=true;$('end').hidden=true;$('app').hidden=false;layout();newGame(first);G.gid=gid;
  toast((first===myIdx?'Tu casses !':names[first]+' casse'),2000);
}
function onData(u,d){
  if(d.t==='go'&&mode==='lobby'){const idx=roomMembers.findIndex(p=>p.id===uid);beginOnline(d.g,d.first,d.nm,idx<0?1:idx);}
  else if(d.t==='rematch'&&G&&mode==='game'){$('end').hidden=true;newGame(d.first);G.gid=d.g;toast('Nouvelle partie !',1500);}
  else if(!G||d.g!==G.gid)return;
  else if(d.t==='aim'&&!mine()){opAim={a:d.a,p:d.p};const c=cueBall();if(G.inHand&&c.alive&&!sim.on){c.x=d.x;c.y=d.y;}}
  else if(d.t==='shot'&&!mine()){remoteShot(d);}
  else if(d.t==='end'){const apply=()=>{sim.on=false;applySnap(d.s);for(const b of balls)b.vx=b.vy=0;finishTurn(d.s);};if(sim.on){sim.on=false;}apply();}
  else if(d.t==='emo'){bubble(d.e,false);}
}
/* ---------- écrans ---------- */
function renderLobby(){
  const box=$('lcard');if(!box||$('lobby').hidden)return;box.replaceChildren();
  const add=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;box.append(e);return e;};
  add('div','logo','SALON').style.fontSize='clamp(30px,7vw,48px)';
  if(neterr)add('div','err',neterr);
  const back=()=>{const b=add('button','btn alt sm','⬅ Retour');b.onclick=toTitle;};
  if(!wsOk){add('div','ctr','Connexion au serveur…');back();return;}
  if(!room){
    add('div','ctr','Choisis un salon et attends un adversaire (2 joueurs max) :');
    const g=add('div','rooms');
    for(let n=1;n<=8;n++){const ps=roomsInfo[n]||[],b=document.createElement('button');b.className='rm';b.disabled=ps.length>=2;
      const t=document.createElement('b');t.textContent='Salon '+n+(ps.length?' · '+ps.length+'/2':'');b.append(t,ps.length?ps.map(p=>p.name).join(', '):'Libre');
      b.onclick=()=>{room=n;roomMembers=[];sendRaw({k:'hi',uid,name:myName(),spec:{col:0}});sendRaw({k:'join',room:n});renderLobby();};g.append(b);}
    back();
  }else{
    add('div','ctr','Salon '+room+' · en attente d\'un adversaire…');
    roomMembers.forEach((p,i)=>{const d=add('div','pl2',p.name+(p.id===uid?' (toi)':'')+(i===0?' 👑':''));});
    if(roomMembers.length>=2)add('div','ctr','La partie démarre…');
    const b=add('button','btn alt sm','🚪 Quitter le salon');b.onclick=()=>{sendRaw({k:'leave'});room=0;roomMembers=[];renderLobby();};
  }
}
function toTitle(){
  mode='title';G=null;sim={on:false};if(ws){try{ws.close();}catch(e){}ws=null;wsOk=false;}room=0;roomMembers=[];maybeStart.sent=false;
  $('title').hidden=false;$('lobby').hidden=true;$('end').hidden=true;$('app').hidden=true;
}
function showEnd(w,extra){
  const won=w===myIdx;$('endt').textContent=won?'🏆 Victoire !':'Défaite…';$('endm').textContent=extra||(won?'Bien joué '+names[myIdx]+' !':names[w]+' remporte la partie');
  $('end').hidden=false;
}
$('bBot').onclick=()=>{audio();sv('f7name',myName());vs='bot';myIdx=0;names=[myName(),'Robot'];mode='game';$('title').hidden=true;$('app').hidden=false;layout();newGame(0);toast('Tu casses !',1800);};
$('bOn').onclick=()=>{audio();sv('f7name',myName());if(myName().length<2){$('nm').focus();return;}mode='lobby';$('title').hidden=true;$('lobby').hidden=false;neterr='';connect();renderLobby();};
$('bQuit').onclick=toTitle;
$('bRe').onclick=()=>{
  if(vs==='bot'){$('end').hidden=true;newGame(0);return;}
  const g=Date.now(),first=Math.random()<.5?0:1;if(roomMembers.length<2){toTitle();return;}
  if(roomMembers[0].id===uid){sendRaw({k:'st',d:{t:'rematch',g,first}});$('end').hidden=true;newGame(first);G.gid=g;}else{$('endm').textContent='En attente de l\'hôte…';}
};
$('nm').value=ld('f7name','');
requestAnimationFrame(frame);
window.__pool={get G(){return G;},get balls(){return balls;},get sim(){return sim;},get aim(){return aim;},shoot,get mode(){return mode;}};
</script>
