<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quiz · questions pour tous</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@400;600;700;800&display=swap">
<style>:root{--bg:#8FD6E8;--surface:#FBEFC4;--ink:#4A2B10;--ink-2:#7A5224;--line:#C9A15A;--accent:#E8590C;--f-display:'Unbounded',system-ui,sans-serif;--f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;--cwb:clamp(48px,min(12vw,10.5vh),84px);--cw:var(--cwb)}
*{box-sizing:border-box}[hidden]{display:none!important}
html{background:linear-gradient(#5CC3E6 0%,#A5E1F0 45%,#D8F4EE 75%) fixed #8FD6E8}
html::after{content:'';position:fixed;left:0;right:0;bottom:0;height:24vh;min-height:120px;z-index:-1;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 300' preserveAspectRatio='none'><path d='M0 120 C200 40 380 60 560 120 S950 170 1200 80 V300 H0Z' fill='%237BC36B'/><path d='M0 190 C220 120 420 150 640 200 S1000 230 1200 160 V300 H0Z' fill='%234FA24A'/><path d='M0 250 C300 210 600 260 900 235 S1120 230 1200 245 V300 H0Z' fill='%232F8240'/></svg>") bottom/100% 100% no-repeat}
body{margin:0;color:var(--ink);font:16px/1.45 var(--f-body);padding:12px max(12px,env(safe-area-inset-right)) 24px max(12px,env(safe-area-inset-left));min-height:100vh}
h1,h2,h3,p{margin:0}
h2{font:800 20px var(--f-display);color:#E8632B;text-shadow:0 2px 0 rgba(255,246,210,.9)}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:12px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:linear-gradient(#8A5528,#5E3516);border-radius:16px;padding:8px 12px;box-shadow:0 0 0 3px #3b2010,0 8px 0 rgba(0,0,0,.14),inset 0 2px 0 rgba(255,255,255,.22);color:#FFF3CC}
.brand{font:800 20px var(--f-display);color:#FFE066;text-shadow:0 3px 0 rgba(0,0,0,.35);letter-spacing:.02em;margin-right:auto}
.brand small{display:block;font:700 10px var(--f-body);letter-spacing:.3em;color:#E7D3A0;text-shadow:none}
.btn{font:800 15px var(--f-body);min-height:44px;border-radius:12px;border:2px solid #8A6A2C;background:linear-gradient(#F0E0AE,#D6BF7E);color:#5B3A14;padding:0 16px;cursor:pointer;box-shadow:0 4px 0 #8A6A2C;transition:transform .08s,box-shadow .08s,filter .15s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover:not(:disabled){filter:brightness(1.06)}.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #8A6A2C}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:36px;font-size:13px;padding:0 12px;box-shadow:0 3px 0 #8A6A2C}
.btn.primary{border-color:#B8430A;background:linear-gradient(#FF8A3D,#E8590C);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #8F330A,inset 0 2px 0 rgba(255,255,255,.3)}
.btn.primary:active:not(:disabled){box-shadow:0 1px 0 #8F330A}
.panel{background:radial-gradient(ellipse at 50% 15%,#FFF7D6,#F3E0A0);border:4px solid #7A4A24;border-radius:18px;box-shadow:0 0 0 2px #3b2010,inset 0 0 0 2px #B88B45,inset 0 0 26px rgba(150,100,30,.3),0 10px 24px rgba(0,0,0,.28);padding:16px;display:grid;gap:12px;width:100%;max-width:720px;margin-inline:auto}
.muted{color:var(--ink-2);font-size:14px}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.rcard{display:grid;gap:6px;text-align:left;padding:14px;border-radius:16px;border:3px solid #B88B45;background:linear-gradient(#FFF8E1,#F6E6B0);color:var(--ink);cursor:pointer;font:inherit;box-shadow:0 4px 0 #8A6A2C;min-height:110px;align-content:start}
.rcard:hover{border-color:#E8590C;transform:translateY(-3px)}.rcard b{font:800 18px var(--f-display)}
.st{font:700 12px var(--f-body);padding:3px 10px;border-radius:99px;width:max-content;background:rgba(120,130,150,.2)}.st.free{background:rgba(47,182,124,.25);color:#1E7F54}.st.play{background:rgba(229,72,77,.22);color:#C2343A}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:2px solid #B88B45;border-radius:12px;overflow:hidden}.seg button{border:0;background:#FFF8E1;color:var(--ink);font:800 14px var(--f-body);padding:8px 14px;cursor:pointer}.seg button.on{background:linear-gradient(#FF8A3D,#E8590C);color:#fff}
.pl{display:flex;align-items:center;gap:10px;background:#FFF8E1;border:2px solid #C9A15A;border-radius:12px;padding:8px 10px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 16px var(--f-display);color:#fff;flex:none;border:3px solid #fff6d2;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.pl b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rdy{font-size:13px;font-weight:700}
input.t{min-height:44px;border-radius:12px;border:2px solid #B88B45;background:#FFF8E1;color:var(--ink);font:700 16px var(--f-body);padding:0 12px;box-shadow:inset 0 2px 4px rgba(120,80,20,.25);width:100%}
/* cartes */
.rc{position:relative;width:var(--cw);height:calc(var(--cw)*1.5);border-radius:calc(var(--cw)*.12);background:#F6ECD2;border:1px solid #b99b62;box-shadow:0 2px 0 rgba(60,35,10,.45),0 6px 10px rgba(0,0,0,.25);flex:none;overflow:hidden;user-select:none;-webkit-user-select:none}
.rc img,.rc svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rc img{object-fit:fill}


.rc.sm{--cw:calc(var(--cwb)*.62)}
.rc.hl{outline:4px solid #FFE066;outline-offset:1px;transform:translateY(-6px);box-shadow:0 0 18px #FFE066,0 8px 12px rgba(0,0,0,.3)}
.rc.drop{animation:rdrop .45s cubic-bezier(.2,1.2,.4,1) both}
@keyframes rdrop{from{opacity:0;transform:translateY(-60px) scale(.8) rotate(-8deg)}to{opacity:1;transform:none}}
.rc.mine{cursor:pointer;transition:transform .15s,box-shadow .15s}.rc.mine:hover,.rc.mine.sel{transform:translateY(-14px)}
.rc.mine.dis{cursor:default;filter:saturate(.7) brightness(.92)}.rc.mine.dis:hover{transform:none}
.rc.fly{position:fixed;z-index:80;margin:0;pointer-events:none;transition:transform .7s cubic-bezier(.5,0,.3,1),opacity .7s;will-change:transform}
/* table */
.felt{position:relative;border-radius:26px;background:radial-gradient(ellipse at 50% 45%,#5DB85A 0%,#2F8240 85%);box-shadow:0 0 0 10px #6B3F1A,0 0 0 13px #3b2010,0 18px 30px rgba(0,0,0,.3),inset 0 0 40px rgba(0,0,0,.18);padding:14px 10px 12px;display:grid;gap:10px}
.felt::before{content:'';position:absolute;inset:8px;border-radius:18px;border:2px solid rgba(255,236,150,.5);pointer-events:none}
.opps{display:flex;justify-content:space-evenly;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.seat{display:grid;gap:5px;justify-items:center;min-width:120px}
.plate{display:flex;align-items:center;gap:8px;background:linear-gradient(#5A3318,#3E2410);border:2px solid #241206;border-radius:12px;padding:5px 10px 5px 6px;color:#FFF3CC;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.plate .av{width:32px;height:32px;font-size:14px;border-width:2px}.plate .nm{font:700 14px var(--f-body);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate .sc{font:800 18px var(--f-display);color:#FFE066}.plate small{display:block;font-size:11px;color:#E7D3A0}
.seat.turn .plate{box-shadow:0 0 0 3px #FFE066,0 0 18px #FFE066;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px #FFE066,0 0 30px #FFE066}}
.hnd{display:flex;gap:4px;min-height:calc(var(--cw)*.62*1.5)}.hnd .rc{--cw:calc(var(--cwb)*.55)}
.tbl{display:flex;flex-wrap:wrap;gap:calc(var(--cw)*.14);justify-content:center;align-content:center;min-height:calc(var(--cw)*1.5 + 24px);padding:6px;position:relative;z-index:1}
.tbl .empty{color:rgba(255,246,210,.7);font:700 15px var(--f-body);align-self:center}
.mehand{display:flex;justify-content:center;gap:calc(var(--cw)*.2);padding-top:10px;position:relative;z-index:1;min-height:calc(var(--cw)*1.5 + 20px)}
.status{position:relative;z-index:1;text-align:center;font:800 15px var(--f-body);color:#FFF3CC;text-shadow:0 2px 0 rgba(0,0,0,.35);min-height:1.5em}
.acts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.logline{background:#FFF3CC;border:2px solid #C9A15A;border-radius:12px;padding:8px 12px;font-size:14px}
.fxban{position:fixed;left:50%;top:max(96px,14vh);transform:translateX(-50%);padding:10px 22px;border-radius:999px;background:rgba(74,43,16,.94);border:2px solid var(--g,#FFE066);color:#fff;font:800 clamp(14px,3.4vw,20px) var(--f-display);box-shadow:0 0 24px var(--g,#FFE066),0 8px 24px rgba(0,0,0,.4);white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;animation:fxban 2.2s ease-out forwards;z-index:90}
@keyframes fxban{0%{opacity:0;transform:translate(-50%,-20px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
.pop{position:fixed;z-index:85;pointer-events:none;font:800 40px var(--f-display);color:#FFE066;text-shadow:0 4px 0 rgba(0,0,0,.4);transform:translate(-50%,-50%);animation:popu 1.4s ease-out forwards}
@keyframes popu{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
.ov{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:14px;background:rgba(30,60,80,.7);backdrop-filter:blur(4px);animation:fin .3s both}
@keyframes fin{from{opacity:0}to{opacity:1}}
.ovc{width:min(480px,100%);max-height:94vh;overflow:auto;background:linear-gradient(160deg,rgba(40,24,100,.96),rgba(12,8,36,.97));color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:18px;display:grid;gap:10px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.ovc h3{font:800 20px var(--f-display);text-align:center}
.ovr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.08)}.ovr.best{box-shadow:0 0 0 2px #FFE066;background:rgba(255,224,102,.18)}
.ovr small{color:rgba(255,255,255,.7)}.ovr .p{font:800 22px var(--f-display);color:#7CE7B0}
.prog{height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,#7C3AED,#E5484D,#FF8A3D);transform-origin:left}
.err{color:#c0262d;font-weight:700}
@media (max-width:560px){:root{--cwb:clamp(44px,13.5vw,70px)}.brand{font-size:17px}.felt{padding:12px 6px 10px}}
@media (prefers-reduced-motion:reduce){.rc.drop,.seat.turn .plate{animation:none}}
/* nouvelles règles */
.rules{display:grid;gap:3px;font-size:14px;color:var(--ink-2);background:#FFF8E1;border:2px solid #C9A15A;border-radius:12px;padding:8px 12px}.rules b{color:#B8430A}
.center{position:relative;z-index:1;display:flex;justify-content:center;align-items:center;gap:calc(var(--cw)*.5);padding:8px;min-height:calc(var(--cw)*1.5 + 24px)}
.deck{position:relative;border:0;background:none;padding:0;cursor:default;border-radius:10px}
.deck 
.deck.can{cursor:pointer;animation:dpulse 1.1s ease-in-out infinite}.deck.can:hover{transform:translateY(-4px)}
@keyframes dpulse{50%{filter:drop-shadow(0 0 12px #FFE066)}}
.deck .cnt{position:absolute;right:-8px;bottom:-8px;background:#3E2410;color:#FFE066;font:800 13px var(--f-body);border-radius:99px;padding:2px 8px;border:2px solid #FFE066}
.pilewrap{position:relative;display:grid;justify-items:center;gap:6px}
.suitb{background:rgba(74,43,16,.92);color:#FFF3CC;border:2px solid #FFE066;border-radius:99px;font:800 13px var(--f-body);padding:3px 12px;white-space:nowrap}
.pend{position:absolute;right:6%;top:-4px;background:#E5484D;color:#fff;font:800 22px var(--f-display);border-radius:99px;padding:4px 14px;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.4);animation:pulse2 .8s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(1.12)}}
.mehand{flex-wrap:wrap}
.rc.mine.ok{outline:3px solid rgba(255,224,102,.9);outline-offset:1px}.rc.mine.ok:hover{transform:translateY(-14px);box-shadow:0 0 16px #FFE066,0 8px 12px rgba(0,0,0,.3)}
.rc.mine.dis{opacity:.8;filter:saturate(.55) brightness(.82)}
.seat.fin .plate{opacity:.75}
.suits{display:grid;grid-template-columns:1fr 1fr;gap:10px}.suits .btn{min-height:64px;display:grid;gap:2px;justify-items:center;padding:6px 10px;font-size:15px}.suits .si{font-size:26px}
.av.has{background:none!important;overflow:hidden;border-color:#fff6d2}.av svg{width:100%;height:100%;display:block}
/* dos gris façon cartes marocaines */
.rc.back{background-color:#8c8478;background-image:radial-gradient(circle at 50% 50%,#5f584e 0 2.2px,transparent 2.6px),radial-gradient(circle at 50% 50%,#a8a094 0 1.6px,transparent 2px);background-size:7px 7px,7px 7px;background-position:0 0,3.5px 3.5px;border:3px solid #d9d3c6;box-shadow:0 2px 0 rgba(60,35,10,.45),0 6px 10px rgba(0,0,0,.25),inset 0 0 0 1px #6b645a}
.deck .rc.back{box-shadow:3px 3px 0 #6b645a,6px 6px 0 #4f493f,0 8px 12px rgba(0,0,0,.3)}

/* profil, discussion */
.pchip{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(#F0E0AE,#D6BF7E);border:2px solid #8A6A2C;border-radius:12px;padding:3px 10px 3px 4px;color:#5B3A14;font:800 13px var(--f-body);box-shadow:0 3px 0 #8A6A2C;min-height:36px}
.pchip .av{width:26px;height:26px;font-size:12px;border-width:2px}.pchip b{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pchip .shd{filter:saturate(1.3)}
.ubadge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:#E5484D;color:#fff;font:800 11px var(--f-body);margin-left:6px;padding:0 5px}
.rchat{position:fixed;z-index:90;right:12px;bottom:12px;width:min(360px,calc(100vw - 24px));height:min(420px,70vh);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding:12px;background:radial-gradient(ellipse at 50% 15%,#FFF7D6,#F3E0A0);border:4px solid #7A4A24;border-radius:18px;box-shadow:0 0 0 2px #3b2010,0 14px 30px rgba(0,0,0,.35)}
.rchat[hidden]{display:none}
.rchat .ch-h{display:flex;justify-content:space-between;align-items:center;font:800 16px var(--f-display);color:#E8632B}
#ch-list{list-style:none;margin:0;padding:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
#ch-list li{font-size:14px;overflow-wrap:anywhere;background:#FFF8E1;border:1px solid #D9BE80;border-radius:10px;padding:5px 9px}
#ch-list li.me{border-color:#E8590C}#ch-list li.rx{font-style:italic;color:var(--ink-2)}
#ch-form{display:flex;gap:6px}#ch-form input{flex:1;min-width:0;min-height:40px;border-radius:10px;border:2px solid #B88B45;background:#FFF8E1;color:var(--ink);font:500 15px var(--f-body);padding:0 10px}
/* écran de chargement (thème aventure) */
.gload{position:fixed;inset:0;z-index:300;display:grid;place-items:center;align-content:center;gap:20px;background:linear-gradient(#5CC3E6 0%,#A5E1F0 45%,#D8F4EE 75%);overflow:hidden;transition:opacity .5s ease,visibility .5s;font-family:'Unbounded','Figtree',system-ui,sans-serif}
.gload.out{opacity:0;visibility:hidden}
.gload::before{content:'';position:absolute;left:0;right:0;bottom:0;height:30vh;min-height:140px;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 300' preserveAspectRatio='none'><path d='M0 120 C200 40 380 60 560 120 S950 170 1200 80 V300 H0Z' fill='%237BC36B'/><path d='M0 190 C220 120 420 150 640 200 S1000 230 1200 160 V300 H0Z' fill='%234FA24A'/><path d='M0 250 C300 210 600 260 900 235 S1120 230 1200 245 V300 H0Z' fill='%232F8240'/></svg>") bottom/100% 100% no-repeat}
.gload .lg-cloud{position:absolute;width:120px;height:40px;border-radius:99px;background:rgba(255,255,255,.85);box-shadow:30px -14px 0 8px rgba(255,255,255,.85),-26px -8px 0 2px rgba(255,255,255,.85);animation:lgcl 22s linear infinite}
.gload .lg-cloud.c1{top:14%;left:-160px}.gload .lg-cloud.c2{top:30%;left:-160px;transform:scale(.7);animation-duration:30s;animation-delay:-12s}
@keyframes lgcl{to{left:110%}}
.gload .lg-fan{position:relative;width:170px;height:140px;z-index:1}
.gload .lg-fan i{position:absolute;left:50%;bottom:0;width:66px;height:100px;margin-left:-33px;border-radius:10px;border:3px solid #fff;transform-origin:50% 125%;box-shadow:0 8px 0 rgba(0,0,0,.18);display:grid;place-items:center;font:800 30px 'Unbounded',system-ui,sans-serif;font-style:normal;animation:lgfan 1.7s ease-in-out infinite}
.gload .lg-fan i:nth-child(1){--r:-36deg;animation-delay:0s}.gload .lg-fan i:nth-child(2){--r:-18deg;animation-delay:.12s}.gload .lg-fan i:nth-child(3){--r:0deg;animation-delay:.24s}.gload .lg-fan i:nth-child(4){--r:18deg;animation-delay:.36s}.gload .lg-fan i:nth-child(5){--r:36deg;animation-delay:.48s}
@keyframes lgfan{0%,100%{transform:rotate(calc(var(--r)*.3)) translateY(0)}50%{transform:rotate(var(--r)) translateY(-14px)}}
.gload.f7 .lg-fan i{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.gload.f7 .lg-fan i:nth-child(1){background:#E5484D}.gload.f7 .lg-fan i:nth-child(2){background:#F2B632}.gload.f7 .lg-fan i:nth-child(3){background:#3B82F6}.gload.f7 .lg-fan i:nth-child(4){background:#2FB67C}.gload.f7 .lg-fan i:nth-child(5){background:#9B6BFF}
.gload.rd .lg-fan i{background:#FBF1D2;border-color:#fff;font-size:28px}
.gload .lg-sign{position:relative;z-index:1;padding:12px 34px;border-radius:16px;background:linear-gradient(#8A5528,#5E3516);box-shadow:0 0 0 3px #3b2010,0 8px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.25);color:#FFE066;font:800 clamp(22px,6vw,34px) 'Unbounded',system-ui,sans-serif;letter-spacing:.06em;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.gload .lg-sign b{display:inline-block;animation:lgdot 1.2s infinite}.gload .lg-sign b:nth-of-type(2){animation-delay:.2s}.gload .lg-sign b:nth-of-type(3){animation-delay:.4s}
@keyframes lgdot{0%,70%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-4px)}}
.gload .lg-bar{position:relative;z-index:1;width:min(260px,64vw);height:12px;border-radius:99px;background:rgba(74,43,16,.25);border:2px solid #5E3516;overflow:hidden}
.gload .lg-bar::after{content:'';display:block;height:100%;width:42%;border-radius:99px;background:linear-gradient(90deg,#FF8A3D,#FFE066);animation:lgbar 1.2s ease-in-out infinite}
@keyframes lgbar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){.gload .lg-fan i,.gload .lg-bar::after,.gload .lg-sign b,.gload .lg-cloud{animation:none}}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:130;pointer-events:none;border-radius:2px;animation:cf 3s linear forwards}
@keyframes cf{to{top:105vh;rotate:720deg}}

/* ---- discussion toujours présente ---- */
.carre,.btn.carre{background:linear-gradient(#9be8bf,#35b57c);border-color:#1E7F54;color:#0b3a25;box-shadow:0 4px 0 #1E7F54}
.outrow{position:relative;z-index:1;display:flex;gap:6px;justify-content:center;align-items:center;color:#FFF3CC;font:700 13px var(--f-body);flex-wrap:wrap}
.rchat2{position:fixed;z-index:60;display:grid;background:radial-gradient(ellipse at 50% 0%,#FFF7D6,#F3E0A0);border:3px solid #7A4A24;box-shadow:0 0 0 2px #3b2010,0 10px 24px rgba(0,0,0,.32);color:var(--ink);overflow:hidden}
.rchat2 .ch-top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(#8A5528,#5E3516);color:#FFE066;font:800 15px var(--f-display);cursor:pointer;min-height:44px}

        roster=sn.docs.filter(d=>d.id.startsWith('qz_')).map(d=>{const v=d.data()||{};return{id:d.id.slice(3),name:String(v.name||'?').slice(0,16),t:+v.t||0,seen:+v.seen||0,room:+v.room||0,pf:String(v.pf||''),av:v.av,qg:v.qg,qi:v.qi,qa:v.qa,qms:v.qms,qc:v.qc,qn:v.qn,qt:v.qt};});
        if(!mode||(mode==='online'&&!S))render();
      },()=>{});
      setInterval(()=>{if(!mode||(mode==='online'&&!S))render();},8000);
    }
    startChat();
    if(pendingJoin&&db&&myName.trim().length>=2)joinRoom(pendingJoin);else render();
  }
  hideLoader();
  window.addEventListener('beforeunload',()=>{if(db&&ROOM)db.doc('lobby/qz_'+uid).delete().catch(()=>{});});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)beat();});
}

boot();
</script></body></html>
