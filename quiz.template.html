const QZ_LET='ABCD';
function qzShuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function qzPerm(){return qzShuffle([0,1,2,3]).join('');}
/* cat : 'mix' ou id de catégorie ; n : nb de questions ; T : secondes */
/* cats : tableau d'ids de catégories (ou 'mix' = toutes) ; seen : Set d'ids déjà joués (on les évite) */
function qzPick(bank,cats,n,seen){
  seen=seen||new Set();
  const set=Array.isArray(cats)&&cats.length?cats:null;
  const groups={};
  bank.forEach(q=>{if(!set||set.includes(q.cat))(groups[q.cat]=groups[q.cat]||[]).push(q);});
  const keys=qzShuffle(Object.keys(groups));
  keys.forEach(k=>{const g=groups[k];groups[k]=qzShuffle(g.filter(q=>!seen.has(q.id))).concat(qzShuffle(g.filter(q=>seen.has(q.id))));});
  const out=[];let k=0,guard=0;
  while(out.length<n&&keys.some(c=>groups[c].length)&&guard++<5000){
    const g=groups[keys[k%keys.length]];k++;
    if(g.length)out.push(g.shift());
  }
  return qzShuffle(out).map(q=>({i:q.id,p:qzPerm()}));
}
function qzNew(players,bank,cat,n,T,seen){
  const qs=qzPick(bank,cat,n,seen);
  const s={v:1,rev:1,gid:Date.now().toString(36)+Math.random().toString(36).slice(2,6),phase:'q',cat:cat,T:T,
    players:players.map(p=>({id:p.id,name:p.name,av:p.av||'',bot:!!p.bot})),
    scores:{},streak:{},qs:qs,qi:0,t0:Date.now(),rt:0,res:null,rank:[]};
  s.players.forEach(p=>{s.scores[p.id]=0;s.streak[p.id]=0;});
  return s;
}
/* a = index affiché (0..3), perm[a] = index d'origine ; 0 = bonne réponse */
const qzIsOk=(s,a)=>a>=0&&a<4&&s.qs[s.qi].p[a]==='0';
const qzGoodIdx=s=>s.qs[s.qi].p.indexOf('0');
function qzPoints(ms,T){const r=Math.min(1,Math.max(0,ms/(T*1000)));return 1000-Math.round(500*r);}
/* answers : {id:{a,ms}} ; calcule les points, passe en phase reveal */
function qzReveal(s,answers){
  if(s.phase!=='q')return false;
  const res={a:{},ok:{},gain:{},cnt:[0,0,0,0]};
  s.players.forEach(p=>{
    const r=answers[p.id];const a=r&&typeof r.a==='number'?r.a:-1;
    res.a[p.id]=a;
    if(a>=0&&a<4)res.cnt[a]++;
    if(qzIsOk(s,a)){
      const st=(s.streak[p.id]||0)+1;s.streak[p.id]=st;
      const g=qzPoints(+r.ms||0,s.T)+Math.min(250,(st-1)*50);
      res.ok[p.id]=1;res.gain[p.id]=g;s.scores[p.id]=(s.scores[p.id]||0)+g;
    }else{s.streak[p.id]=0;res.ok[p.id]=0;res.gain[p.id]=0;}
  });
  s.res=res;s.phase='reveal';s.rt=Date.now();s.rev++;return true;
}
function qzRanking(s){
  return s.players.slice().sort((a,b)=>(s.scores[b.id]||0)-(s.scores[a.id]||0)).map(p=>p.id);
}
function qzNext(s){
  if(s.phase!=='reveal')return false;
  if(s.qi+1>=s.qs.length){s.phase='end';s.rank=qzRanking(s);s.rev++;return true;}
  s.qi++;s.phase='q';s.t0=Date.now();s.res=null;s.rev++;return true;
}
/* réponse d'un bot (solo) : {a,ms} */
function qzBotAnswer(s,skill){
  const good=qzGoodIdx(s);
  const ok=Math.random()<skill;
  let a=good;if(!ok){do{a=Math.floor(Math.random()*4);}while(a===good);}
  const ms=Math.round(s.T*1000*(.18+Math.random()*.6));
  return{a:a,ms:ms};
}
