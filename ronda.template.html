<style>:root{--bg:#8FD6E8;--surface:#FBEFC4;--ink:#4A2B10;--ink-2:#7A5224;--line:#C9A15A;--accent:#E8590C;--f-display:'Unbounded',system-ui,sans-serif;--f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;--cwb:clamp(48px,min(12vw,10.5vh),84px);--cw:var(--cwb)}

@keyframes fxban{0%{opacity:0;transform:translate(-50%,-20px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}

@keyframes popu{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
.ov{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:14px;background:rgba(30,60,80,.7);backdrop-filter:blur(4px);animation:fin .3s both}

.ovc{width:min(480px,100%);max-height:94vh;overflow:auto;background:linear-gradient(160deg,rgba(40,24,100,.96),rgba(12,8,36,.97));color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:18px;display:grid;gap:10px;box-shadow:0 30px 80px rgba(0,0,0,.6)}

.prog{height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,#7C3AED,#E5484D,#FF8A3D);transform-origin:left}
.err{color:#c0262d;font-weight:700}
@media (max-width:560px){:root{--cwb:clamp(44px,13.5vw,70px)}.brand{font-size:17px}.felt{padding:12px 6px 10px}}

/* nouvelles règles */
.rules{display:grid;gap:3px;font-size:14px;color:var(--ink-2);background:#FFF8E1;border:2px solid #C9A15A;border-radius:12px;padding:8px 12px}.rules b{color:#B8430A}
.center{position:relative;z-index:1;display:flex;justify-content:center;align-items:center;gap:calc(var(--cw)*.5);padding:8px;min-height:calc(var(--cw)*1.6 + 24px)}
.deck{position:relative;border:0;background:none;padding:0;cursor:default;border-radius:10px}
.deck .rc.back{box-shadow:3px 3px 0 #3b2a6e,6px 6px 0 #2a1d52,0 8px 12px rgba(0,0,0,.3)}
.deck.can{cursor:pointer;animation:dpulse 1.1s ease-in-out infinite}.deck.can:hover{transform:translateY(-4px)}
@keyframes dpulse{50%{filter:drop-shadow(0 0 12px #FFE066)}}
.deck .cnt{position:absolute;right:-8px;bottom:-8px;background:#3E2410;color:#FFE066;font:800 13px var(--f-body);border-radius:99px;padding:2px 8px;border:2px solid #FFE066}
.pilewrap{position:relative;display:grid;justify-items:center;gap:6px}
.suitb{background:rgba(74,43,16,.92);color:#FFF3CC;border:2px solid #FFE066;border-radius:99px;font:800 13px var(--f-body);padding:3px 12px;white-space:nowrap}
.pend{position:absolute;right:6%;top:-4px;background:#E5484D;color:#fff;font:800 22px var(--f-display);border-radius:99px;padding:4px 14px;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.4);animation:pulse2 .8s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(1.12)}}
.mehand{flex-wrap:wrap}
.rc.mine.ok{outline:3px solid rgba(255,224,102,.9);outline-offset:1px}.rc.mine.ok:hover{transform:translateY(-14px);box-shadow:0 0 16px #FFE066,0 8px 12px rgba(0,0,0,.3)}
.rc.mine.dis{opacity:.62;filter:saturate(.6) brightness(.9)}
.seat.fin .plate{opacity:.75}
.suits{display:grid;grid-template-columns:1fr 1fr;gap:10px}.suits .btn{min-height:64px;display:grid;gap:2px;justify-items:center;padding:6px 10px;font-size:15px}.suits .si{font-size:26px}
.av.has{background:none!important;overflow:hidden;border-color:#fff6d2}.av svg{width:100%;height:100%;display:block}
</style></head><body><div id="app"></div>
<script>
/*ENGINE_START*/
const SUITS=['s','c','b','o'],ORD=[1,2,3,4,5,6,7,10,11,12];
const SUIT_N={s:'Épées',c:'Coupes',b:'Bâtons',o:'Deniers'};
const SUIT_I={s:'🗡️',c:'🏆',b:'🪵',o:'🪙'};
const cv=c=>+c.slice(1),csu=c=>c[0];
const VNAME={1:'As',10:'Valet',11:'Cavalier',12:'Roi'};
const vName=v=>VNAME[v]||String(v);
function mkDeck(){const d=[];SUITS.forEach(su=>ORD.forEach(v=>d.push(su+v)));return d;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const nameOf=(s,id)=>(s.players.find(p=>p.id===id)||{name:'?'}).name;
function logp(s,t){s.log.push(t);if(s.log.length>60)s.log.shift();}
const HAND=5;
function rdNew(players){
  const s={v:2,rev:1,gid:Date.now().toString(36)+Math.random().toString(36).slice(2,6),phase:'playing',
    players:players.map(p=>({id:p.id,name:p.name,av:p.av||'',bot:!!p.bot})),deck:shuffle(mkDeck()),pile:[],hands:{},
    turn:0,suit:'o',pending:0,drew:false,rank:[],log:[],fx:[],fxc:0};
  s.players.forEach(p=>{s.hands[p.id]=s.deck.splice(0,HAND);});
  let g=0;
  while(g++<100){const c=s.deck.shift();if([1,2,7].includes(cv(c))){s.deck.push(c);s.deck=shuffle(s.deck);continue;}s.pile.push(c);s.suit=csu(c);break;}
  logp(s,'La partie commence : '+nameOf(s,s.players[0].id)+' joue en premier');
  return s;
}
const rdTurnId=s=>s.players[s.turn].id;
const rdCan=(s,pid)=>s.phase==='playing'&&rdTurnId(s)===pid&&!s.rank.includes(pid);
const rdTop=s=>s.pile[s.pile.length-1];
function rdLegal(s,pid,c){
  if(!rdCan(s,pid)||!s.hands[pid].includes(c))return false;
  if(s.pending>0)return cv(c)===2;
  const t=rdTop(s);
  return cv(c)===cv(t)||csu(c)===s.suit;
}
const rdPlayable=(s,pid)=>s.hands[pid].filter(c=>rdLegal(s,pid,c));
const active=s=>s.players.filter(p=>!s.rank.includes(p.id));
function nextIdx(s,from){
  const n=s.players.length;
  for(let k=1;k<=n;k++){const j=(from+k)%n;if(!s.rank.includes(s.players[j].id))return j;}
  return from;
}
function advance(s,skip){
  s.drew=false;
  let j=nextIdx(s,s.turn);
  if(skip&&active(s).length>1){s.fx.push({k:'skip',to:s.players[j].id});logp(s,nameOf(s,s.players[j].id)+' passe son tour');j=nextIdx(s,j);}
  s.turn=j;
}
function checkEnd(s){
  const act=active(s);
  if(act.length<=1){
    if(act.length===1){s.rank.push(act[0].id);}
    s.phase='gameEnd';logp(s,'Fin de la partie');return true;
  }
  return false;
}
function refill(s){
  if(s.deck.length)return true;
  if(s.pile.length>1){const top=s.pile.pop();s.deck=shuffle(s.pile);s.pile=[top];s.fx.push({k:'shuffle'});logp(s,'La pioche est remélangée');return true;}
  return false;
}
function draw(s,pid,n){
  let k=0;for(;k<n;k++){if(!refill(s))break;s.hands[pid].push(s.deck.shift());}return k;
}
function rdPlay(s,pid,card,suit){
  if(!rdLegal(s,pid,card))return false;
  const hd=s.hands[pid],v=cv(card),nm=nameOf(s,pid);
  hd.splice(hd.indexOf(card),1);s.pile.push(card);s.fx=[{k:'place',by:pid,card}];
  s.suit=csu(card);
  let skip=false;
  const out=!hd.length;
  if(v===7&&!out&&SUITS.includes(suit)){s.suit=suit;s.fx.push({k:'suit',by:pid,suit});logp(s,nm+' joue un 7 et demande '+SUIT_N[suit]);}
  else if(v===1){skip=true;logp(s,nm+' joue un As');}
  else if(v===2){s.pending+=2;s.fx.push({k:'stack',by:pid,n:s.pending});logp(s,nm+' joue un 2 : '+s.pending+' cartes à piocher');}
  else logp(s,nm+' joue '+vName(v)+' d\''+SUIT_N[csu(card)].toLowerCase());
  if(out){s.rank.push(pid);s.fx.push({k:'out',by:pid,rank:s.rank.length});logp(s,nm+' a fini en position '+s.rank.length);}
  s.fxc=(s.fxc||0)+1;s.rev++;
  if(checkEnd(s))return true;
  advance(s,skip);
  return true;
}
function rdDraw(s,pid){
  if(!rdCan(s,pid))return false;
  s.fx=[];const nm=nameOf(s,pid);
  if(s.pending>0){
    const n=draw(s,pid,s.pending);s.fx.push({k:'draw',by:pid,n});logp(s,nm+' pioche '+n+' cartes');s.pending=0;
    s.fxc=(s.fxc||0)+1;s.rev++;advance(s,false);return true;
  }
  if(s.drew)return false;
  const n=draw(s,pid,1);s.fx.push({k:'draw',by:pid,n});logp(s,nm+' pioche une carte');
  s.fxc=(s.fxc||0)+1;s.rev++;s.drew=true;
  if(!n||!rdPlayable(s,pid).length)advance(s,false);
  return true;
}
function rdPass(s,pid){
  if(!rdCan(s,pid)||!s.drew)return false;
  s.fx=[];logp(s,nameOf(s,pid)+' passe');s.rev++;advance(s,false);return true;
}
function rdBot(s,pid){
  const pl=rdPlayable(s,pid);
  if(!pl.length)return null;
  const hd=s.hands[pid],cnt={};hd.forEach(c=>{cnt[csu(c)]=(cnt[csu(c)]||0)+1;});
  let best=null,bs=-1e9;
  pl.forEach(c=>{
    let sc=Math.random();
    if(cv(c)===2)sc+=3;if(cv(c)===1)sc+=2;if(cv(c)===7)sc-=1.5;
    sc+=(cnt[csu(c)]||0)*.4;
    if(sc>bs){bs=sc;best=c;}
  });
  const rest=hd.filter(c=>c!==best);const c2={};rest.forEach(c=>{c2[csu(c)]=(c2[csu(c)]||0)+1;});
  let suit=csu(best),m=-1;SUITS.forEach(su=>{if((c2[su]||0)>m){m=c2[su]||0;suit=su;}});
  return{card:best,suit};
}
/*ENGINE_END*/


/* avatars dessinés (SVG générés, originaux) */
const AV_BG=['#E9B949','#8DBBD9','#C9A7C8','#4E9AA6','#E58B3A','#9F6AA8','#7FB77E','#D96C5F','#6C7FD1','#D4A5A5','#5DB7A6','#F2A65A','#2B2F3A','#F7F3E0','#E8537A','#3FA7E0'];

}
function onState(d){
  const prev=S;
  if(!d){if(mode==='online'){S=null;prevTop='';lastFxc=-1;lastGid=null;render();}return;}
  if(prev&&d.rev<prev.rev&&d.gid===prev.gid)return;
  S=d;onLocalChange(prev);render();
}
/* ---- effets lors d'un changement d'état ---- */
/* ---- effets lors d'un changement d'état ---- */
function onLocalChange(prev){
  if(!S)return;
  if(S.gid!==lastGid){lastGid=S.gid;lastFxc=-1;}
  if(S.fxc!==lastFxc&&lastFxc!==-1&&S.fx&&S.fx.length)playFx(S);
  lastFxc=S.fxc||0;
  const key=S.gid+':'+S.turn+':'+S.phase+':'+S.rev;
  if(key!==lastTurnKey){lastTurnKey=key;if(S.phase==='playing'&&rdTurnId(S)===uid&&!isSpec()&&mode==='online')setTimeout(()=>Snd.play('turn'),400);}
}
function playFx(s){
  s.fx.forEach(f=>{
    const nm=f.by?nameOf(s,f.by):'';
    if(f.k==='place')Snd.play('place');
    else if(f.k==='draw'){Snd.play('take');if(f.n>1)banner('🃏 '+nm+' pioche '+f.n+' cartes','#FF8A3D');}
    else if(f.k==='skip'){Snd.play('taper');banner('🚫 '+nameOf(s,f.to)+' passe son tour','#E5484D');}
    else if(f.k==='stack'){Snd.play('ronda');banner('✌️ +'+f.n+' cartes à piocher !','#FF8A3D');}
    else if(f.k==='suit'){Snd.play('missa');banner(SUIT_I[f.suit]+' '+nm+' demande '+SUIT_N[f.suit],'#7CE7B0');}
    else if(f.k==='out'){Snd.play('win');banner('🏁 '+nm+' a fini '+(f.rank===1?'1er !':f.rank+'e'),'#FFE066');}
    else if(f.k==='shuffle'){banner('🔀 Pioche remélangée','#4D8DF7');}
  });
}
/* ---- actions ---- */
let pick=null;
function playCard(c,suit){
  if(!S||isSpec()||busy||!rdLegal(S,uid,c))return;
  if(cv(c)===7&&S.hands[uid].length>1&&!suit){pick=c;render();return;}
  pick=null;
  const s=CLONE(S);
  if(!rdPlay(s,uid,c,suit))return;
  commit(s);
}
function drawCard(){
  if(!S||isSpec()||!rdCan(S,uid))return;
  const s=CLONE(S);if(rdDraw(s,uid)){pick=null;commit(s);}
}
function passTurn(){
  if(!S||isSpec()||!rdCan(S,uid))return;
  const s=CLONE(S);if(rdPass(s,uid)){commit(s);}
}
/* ---- bots (mode solo) ---- */
function botStep(){
  if(mode!=='solo'||!S||S.phase!=='playing')return;
  const p=S.players[S.turn];if(!p.bot)return;
  const key=S.gid+':'+S.rev+':'+S.turn+':'+S.drew;
  if(botKey===key)return;botKey=key;
  setTimeout(()=>{
    if(mode!=='solo'||!S||S.phase!=='playing'||S.players[S.turn].id!==p.id)return;
    const s=CLONE(S),b=rdBot(s,p.id);
    let ok=false;
    if(b)ok=rdPlay(s,p.id,b.card,b.suit);
    else if(!s.drew||s.pending>0)ok=rdDraw(s,p.id);
    else ok=rdPass(s,p.id);
    if(ok){S=s;onLocalChange(null);render();}
  },S.players.every(x=>x.bot||S.rank.includes(x.id))?350:1000);
}
let botKey='';
function startSolo(){
  const names=['Karim','Yasmine','Omar'];
  const ps=[{id:uid,name:myName||'Moi',av:myAv}].concat([...Array(setup.bots)].map((_,i)=>({id:'bot'+i,name:names[i]+' 🤖',bot:true,av:AVATARS[(i*7+3)%AVATARS.length]})));
  mode='solo';ROOM=0;S=rdNew(ps);lastGid=S.gid;lastFxc=S.fxc||0;prevTop='';botKey='';render();
}
/* ---- rendus ---- */
function avEl(p,cls){const a=validAv(p.av)?p.av:null;const e=h('span',{class:'av'+(cls?' '+cls:''),style:'background:hsl('+hue(p.id)+' 45% 38%)'});if(a){e.innerHTML=avSVGa(a);e.classList.add('has');}else e.textContent=(p.name||'?')[0].toUpperCase();return e;}
function renderTop(sub,right){
  return h('div',{class:'top'},h('div',{class:'brand'},'RONDA',h('small',null,sub||'ATELIER GAMING')),
    right||null,
    h('button',{class:'btn sm',type:'button',onclick:()=>{Snd.set(!Snd.on);render();}},Snd.on?'🔊 Sons':'🔇 Sons'),
    h('a',{class:'btn sm',href:'index.html#jeux'},'🎮 Jeux'));
}
function render(){
  const app=$('app');
  let view;
  if(!mode)view=renderPicker();else if(mode==='online'&&!S)view=renderLobby();else view=renderGame();
  const keep=document.activeElement&&document.activeElement.id==='nm-in'?{v:document.activeElement.value,s:document.activeElement.selectionStart}:null;
  app.replaceChildren(h('div',{class:'wrap'},view));
  if(keep){const i=$('nm-in');if(i){i.focus();i.value=keep.v;try{i.setSelectionRange(keep.s,keep.s);}catch(e){}}}
  if(S&&mode==='solo')botStep();
  handOverlays();
}
let prevTop='';
function renderPicker(){
  const rooms=[1,2,3].map(n=>{
    const ps=roomPlayers(n);
    return h('button',{class:'rcard',type:'button',onclick:()=>joinRoom(n),disabled:!db||!(myName&&myName.trim().length>=2)},
      h('b',null,'Table '+n),h('span',{class:'st '+(ps.length?'':'free')},ps.length?ps.length+' joueur'+(ps.length>1?'s':''):'Libre'),
      h('span',{class:'muted'},ps.length?ps.map(p=>p.name).join(', '):'Aucun joueur'));
  });
  const nm=h('input',{id:'nm-in',class:'t',maxlength:'16',placeholder:'Ton pseudo',value:myName,'aria-label':'Pseudo'});
  nm.addEventListener('input',()=>{myName=nm.value.trim().slice(0,16);lsSet(NAME_K,myName);const dis=!db||myName.length<2;document.querySelectorAll('.rcard').forEach(b=>b.disabled=dis);const sg=$('solo-go');if(sg)sg.disabled=myName.length<2;});
  return[renderTop('Jeu de cartes espagnoles'),
    h('div',{class:'panel'},h('h2',null,'Bienvenue à la Ronda'),
      h('p',{class:'muted'},'Vide ta main le plus vite possible ! Joue une carte de la même famille ou de la même valeur que celle du tapis, sinon pioche.'),
      h('div',{class:'rules'},
        h('div',null,h('b',null,'As'),' : le suivant passe son tour'),
        h('div',null,h('b',null,'2'),' : le suivant pioche 2 (ou pose un 2 : +4, +6…)'),
        h('div',null,h('b',null,'7'),' : tu choisis la famille à jouer'),
        h('div',null,h('b',null,'10 · 11 · 12'),' : aucun effet'),
        h('div',null,h('b',null,'Fin'),' : le premier sans carte gagne, les autres finissent la manche')),
      mySlug?h('p',{class:'muted'},'Profil : '+(myName||mySlug)):h('p',{class:'muted'},'Tu peux jouer sans profil.'),
      nm),
    h('div',{class:'panel'},h('h2',null,'Jouer en ligne'),h('div',{class:'rooms'},rooms),
      !db?h('p',{class:'err'},'Connexion à la base impossible : seul le mode solo est disponible.'):null),
    h('div',{class:'panel'},h('h2',null,'Contre l\'ordinateur'),
      h('div',{class:'row'},h('span',null,'Adversaires'),h('div',{class:'seg'},[1,2,3].map(n=>h('button',{type:'button',class:setup.bots===n?'on':'',onclick:()=>{setup.bots=n;render();}},String(n))))),
      h('button',{id:'solo-go',class:'btn primary',type:'button',disabled:myName.length<2,onclick:startSolo},'🤖 Lancer la partie'))];
}
function renderLobby(){
  const ps=roomPlayers(ROOM);
  const host=ps[0]&&ps[0].id===uid;
  const can=host&&ps.length>=2&&ps.slice(0,4).every(p=>p.ready||p.id===uid);
  return[renderTop('Table '+ROOM,h('button',{class:'btn sm',type:'button',onclick:leaveRoom},'↩ Quitter la table')),
    h('div',{class:'panel'},h('h2',null,'Salle d\'attente · Table '+ROOM),
      h('p',{class:'muted'},'2 à 4 joueurs. Chacun clique sur Prêt, puis l\'hôte lance la partie.'),
      ...ps.slice(0,4).map((p,i)=>h('div',{class:'pl'},avEl(p),h('b',null,p.name+(p.id===uid?' (toi)':'')),i===0?h('span',{class:'muted'},'Hôte'):null,h('span',{class:'rdy'},p.ready?'✅ Prêt':'⏳ Pas prêt'))),
      ps.length>4?h('p',{class:'muted'},'Seuls les 4 premiers arrivés jouent.'):null,
      h('div',{class:'row'},h('button',{class:'btn'+(myReady?'':' primary'),type:'button',onclick:toggleReady},myReady?'Je ne suis plus prêt':'✅ Je suis prêt'),
        host?h('button',{class:'btn primary',type:'button',disabled:!can,onclick:startOnline},'▶ Lancer la partie'):null),
      ps.length<2?h('p',{class:'muted'},'En attente d\'un autre joueur… partage le lien du site.'):(host&&!can?h('p',{class:'muted'},'Tout le monde doit être prêt.'):null))];
}
const MEDAL=['🥇','🥈','🥉','4e'];
function renderGame(){
  const s=S,n=s.players.length,spec=isSpec(),myTurn=!spec&&rdCan(s,uid);
  const meIdx=spec?0:s.players.findIndex(p=>p.id===uid);
  const opps=[];for(let k=1;k<n;k++)opps.push(s.players[(meIdx+k)%n]);
  const seat=(p)=>{
    const r=s.rank.indexOf(p.id);
    return h('div',{class:'seat'+(s.phase==='playing'&&rdTurnId(s)===p.id?' turn':'')+(r>=0?' fin':''),'data-seat':p.id},
      h('div',{class:'plate'},avEl(p),h('div',null,h('div',{class:'nm'},p.name+(p.id===uid?' (toi)':'')),h('small',null,r>=0?'Terminé':'🂠 '+s.hands[p.id].length+' carte'+(s.hands[p.id].length>1?'s':''))),r>=0?h('span',{class:'sc'},MEDAL[r]):null),
      p.id!==uid&&r<0?h('div',{class:'hnd'},s.hands[p.id].slice(0,10).map(()=>backEl())):null);
  };
  const top=rdTop(s);
  const topEl=cardEl(top,{cls:prevTop!==s.gid+':'+top+':'+s.pile.length?'drop':''});
  prevTop=s.gid+':'+top+':'+s.pile.length;
  const canDraw=myTurn&&(s.pending>0||!s.drew);
  const deckEl=h('button',{class:'deck'+(canDraw?' can':''),type:'button',disabled:!canDraw,'aria-label':'Piocher',onclick:drawCard},backEl(),h('span',{class:'cnt'},String(s.deck.length)));
  const mid=h('div',{class:'center',id:'tbl'},deckEl,h('div',{class:'pilewrap'},topEl,
    h('div',{class:'suitb',title:'Famille demandée'},SUIT_I[s.suit]+' '+SUIT_N[s.suit])),
    s.pending>0?h('div',{class:'pend'},'+'+s.pending):null);
  const mine=spec?[]:s.hands[uid];
  const meOut=!spec&&s.rank.includes(uid);
  const hand=h('div',{class:'mehand'},mine.map(c=>{
    const ok=myTurn&&rdLegal(s,uid,c);
    const e=cardEl(c,{cls:'mine'+(ok?' ok':' dis')+(pick===c?' sel':'')});
    if(ok){e.tabIndex=0;e.setAttribute('role','button');
      e.addEventListener('click',()=>playCard(c));
      e.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();playCard(c);}});}
    return e;
  }));
  let status='';
  if(s.phase==='playing'){
    if(spec)status='Tu regardes la partie';
    else if(meOut)status='🏁 Tu as fini ('+MEDAL[s.rank.indexOf(uid)]+') — attends les autres';
    else if(myTurn){
      const pl=rdPlayable(s,uid).length;
      status=s.pending>0?(pl?'⚠️ Pose un 2 ou pioche '+s.pending+' cartes':'⚠️ Tu dois piocher '+s.pending+' cartes'):
        (s.drew?(pl?'Tu peux jouer la carte piochée ou passer':'Rien à jouer'):(pl?'🎯 À toi de jouer':'Rien à jouer : pioche une carte'));
    }else status='⏳ Au tour de '+nameOf(s,rdTurnId(s));
  }
  const me=spec?null:s.players[meIdx];
  const lastLog=s.log.slice(-2).reverse().join(' · ');
  const pickEl=pick&&myTurn?h('div',{class:'ov',id:'rdpick'},h('div',{class:'ovc'},h('h3',null,'7 : quelle famille ?'),
    h('div',{class:'suits'},SUITS.map(su=>h('button',{type:'button',class:'btn suit-'+su,onclick:()=>playCard(pick,su)},h('span',{class:'si'},SUIT_I[su]),SUIT_N[su]))),
    h('button',{class:'btn sm',type:'button',onclick:()=>{pick=null;render();}},'Annuler'))):null;
  const oldPick=$('rdpick');if(oldPick)oldPick.remove();
  if(pickEl)setTimeout(()=>document.body.append(pickEl),0);
  return[renderTop('Manche en cours',h('div',{class:'row'},mode==='online'&&isHost()?h('button',{class:'btn sm',type:'button',onclick:endGameHost},'■ Terminer'):null,h('button',{class:'btn sm',type:'button',onclick:leaveRoom},'↩ Quitter'))),
    h('div',{class:'felt'},
      h('div',{class:'opps'},opps.map(seat)),
      mid,
      h('div',{class:'status'},status),
      h('div',{class:'acts'},myTurn&&s.drew&&s.pending===0?h('button',{class:'btn',type:'button',onclick:passTurn},'⏭ Passer'):null,
        myTurn&&canDraw&&!(s.drew)?h('button',{class:'btn primary',type:'button',onclick:drawCard},s.pending>0?'🃏 Piocher '+s.pending:'🃏 Piocher'):null,
        myTurn&&s.pending>0?h('button',{class:'btn primary',type:'button',onclick:drawCard},'🃏 Piocher '+s.pending):null),
      hand,
      me?h('div',{class:'opps'},seat(me)):null),
    lastLog?h('div',{class:'logline'},lastLog):null];
}
function endGameHost(){if(!confirm('Terminer la partie pour tout le monde ?'))return;db.doc(gp(ROOM)).delete().catch(()=>{});}
/* ---- fin de partie ---- */
let ovKey='';
function closeOv(){const o=$('rdov');if(o)o.remove();ovKey='';}
function handOverlays(){
  if(!S){closeOv();const p=$('rdpick');if(p)p.remove();return;}
  if(S.phase==='playing'){closeOv();return;}
  const key=S.gid+':'+S.phase;if(key===ovKey)return;
  closeOv();ovKey=key;showEnd();
}
function showEnd(){
  const s=S,w=s.rank[0],pos=s.rank.indexOf(uid);
  const rows=s.rank.map((id,i)=>{const p=s.players.find(x=>x.id===id);return h('div',{class:'ovr'+(i===0?' best':'')},avEl(p),h('b',null,p.name+(id===uid?' (toi)':'')),h('span',{class:'p'},MEDAL[i]));});
  const host=isHost();
  const ov=h('div',{class:'ov',id:'rdov'},h('div',{class:'ovc'},h('h3',null,pos===0?'🏆 Victoire !':(pos<0?nameOf(s,w)+' gagne':nameOf(s,w)+' gagne — tu finis '+MEDAL[pos])),...rows,
    h('div',{class:'row',style:'justify-content:center'},
      host?h('button',{class:'btn primary',type:'button',onclick:rematch},'🔁 Revanche'):h('span',{class:'muted',style:'color:rgba(255,255,255,.75)'},'En attente de l\'hôte…'),
      host&&mode==='online'?h('button',{class:'btn',type:'button',onclick:()=>{closeOv();db.doc(gp(ROOM)).delete().catch(()=>{});}},'Retour à la salle'):null,
      h('button',{class:'btn',type:'button',onclick:()=>{closeOv();leaveRoom();}},'Quitter'))));
  document.body.append(ov);Snd.play(pos===0?'win':'lose');
}
function rematch(){
  if(!S||!isHost())return;closeOv();prevTop='';botKey='';
  const ps=S.players.map(p=>({id:p.id,name:p.name,bot:p.bot,av:p.av}));
  commit(rdNew(ps));
}
/* ---- démarrage ---- */
async function boot(){
  uid=lsGet('f7id');if(!uid){uid='g_'+Math.random().toString(36).slice(2,12);lsSet('f7id',uid);}
  if(location.hash==='#solo'){}
  render();
  if(window.F7_FIREBASE){
    try{db=await loadFirebase(window.F7_FIREBASE);}catch(e){db=null;}
    if(db){
      lobUnsub=db.collection('lobby').onSnapshot(sn=>{
        roster=sn.docs.filter(d=>d.id.startsWith('rd_')).map(d=>{const v=d.data()||{};return{id:d.id.slice(3),name:String(v.name||'?').slice(0,16),t:+v.t||0,seen:+v.seen||0,room:+v.room||0,ready:!!v.ready,pf:String(v.pf||''),av:v.av};});
        if(!mode||(mode==='online'&&!S))render();
      },()=>{});
      setInterval(()=>{if(!mode||(mode==='online'&&!S))render();},8000);
    }
    render();
  }
  window.addEventListener('beforeunload',()=>{if(db&&ROOM)db.doc('lobby/rd_'+uid).delete().catch(()=>{});});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)beat();});
}
boot();
