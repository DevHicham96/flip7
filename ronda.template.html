<style>:root{--bg:#8FD6E8;--surface:#FBEFC4;--ink:#4A2B10;--ink-2:#7A5224;--line:#C9A15A;--accent:#E8590C;--f-display:'Unbounded',system-ui,sans-serif;--f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;--cwb:clamp(48px,min(12vw,10.5vh),84px);--cw:var(--cwb)}

/* cartes */
.rc{position:relative;width:var(--cw);height:calc(var(--cw)*1.6);border-radius:calc(var(--cw)*.12);background:#F6ECD2;border:1px solid #b99b62;box-shadow:0 2px 0 rgba(60,35,10,.45),0 6px 10px rgba(0,0,0,.25);flex:none;overflow:hidden;user-select:none;-webkit-user-select:none}

.rc.back{background:repeating-linear-gradient(45deg,#7C3AED 0 6px,#5B21B6 6px 12px);border:3px solid #fff}
.rc.back::after{content:'7';position:absolute;inset:0;display:grid;place-items:center;font:800 calc(var(--cw)*.5) var(--f-display);color:rgba(255,255,255,.85);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.rc.sm{--cw:calc(var(--cwb)*.62)}

.rc.mine{cursor:pointer;transition:transform .15s,box-shadow .15s}.rc.mine:hover,.rc.mine.sel{transform:translateY(-14px)}
.rc.mine.dis{cursor:default;filter:saturate(.7) brightness(.92)}.rc.mine.dis:hover{transform:none}
.rc.fly{position:fixed;z-index:80;margin:0;pointer-events:none;transition:transform .7s cubic-bezier(.5,0,.3,1),opacity .7s;will-change:transform}
/* table */
.felt{position:relative;border-radius:26px;background:radial-gradient(ellipse at 50% 45%,#5DB85A 0%,#2F8240 85%);box-shadow:0 0 0 10px #6B3F1A,0 0 0 13px #3b2010,0 18px 30px rgba(0,0,0,.3),inset 0 0 40px rgba(0,0,0,.18);padding:14px 10px 12px;display:grid;gap:10px}
.felt::before{content:'';position:absolute;inset:8px;border-radius:18px;border:2px solid rgba(255,236,150,.5);pointer-events:none}
.opps{display:flex;justify-content:space-evenly;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.seat{display:grid;gap:5px;justify-items:center;min-width:120px}
.plate{display:flex;align-items:center;gap:8px;background:linear-gradient(#5A3318,#3E2410);border:2px solid #241206;border-radius:12px;padding:5px 10px 5px 6px;color:#FFF3CC;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.plate .av{width:32px;height:32px;font-size:14px;border-width:2px}.plate .nm{font:700 14px var(--f-body);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate .sc{font:800 18px var(--f-display);color:#FFE066}.plate small{display:block;font-size:11px;color:#E7D3A0}
.seat.turn .plate{box-shadow:0 0 0 3px #FFE066,0 0 18px #FFE066;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px #FFE066,0 0 30px #FFE066}}
.hnd{display:flex;gap:4px;min-height:calc(var(--cw)*.62*1.6)}.hnd .rc{--cw:calc(var(--cwb)*.55)}
.tbl{display:flex;flex-wrap:wrap;gap:calc(var(--cw)*.14);justify-content:center;align-content:center;min-height:calc(var(--cw)*1.6 + 24px);padding:6px;position:relative;z-index:1}
.tbl .empty{color:rgba(255,246,210,.7);font:700 15px var(--f-body);align-self:center}
.mehand{display:flex;justify-content:center;gap:calc(var(--cw)*.2);padding-top:10px;position:relative;z-index:1;min-height:calc(var(--cw)*1.6 + 20px)}
.status{position:relative;z-index:1;text-align:center;font:800 15px var(--f-body);color:#FFF3CC;text-shadow:0 2px 0 rgba(0,0,0,.35);min-height:1.5em}
.acts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.logline{background:#FFF3CC;border:2px solid #C9A15A;border-radius:12px;padding:8px 12px;font-size:14px}
.fxban{position:fixed;left:50%;top:max(96px,14vh);transform:translateX(-50%);padding:10px 22px;border-radius:999px;background:rgba(74,43,16,.94);border:2px solid var(--g,#FFE066);color:#fff;font:800 clamp(14px,3.4vw,20px) var(--f-display);box-shadow:0 0 24px var(--g,#FFE066),0 8px 24px rgba(0,0,0,.4);white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;animation:fxban 2.2s ease-out forwards;z-index:90}
@keyframes fxban{0%{opacity:0;transform:translate(-50%,-20px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
.pop{position:fixed;z-index:85;pointer-events:none;font:800 40px var(--f-display);color:#FFE066;text-shadow:0 4px 0 rgba(0,0,0,.4);transform:translate(-50%,-50%);animation:popu 1.4s ease-out forwards}
@keyframes popu{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
.ov{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:14px;background:rgba(30,60,80,.7);backdrop-filter:blur(4px);animation:fin .3s both}
@keyframes fin{from{opacity:0}to{opacity:1}}
.ovc{width:min(480px,100%);max-height:94vh;overflow:auto;background:linear-gradient(160deg,rgba(40,24,100,.96),rgba(12,8,36,.97));color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:18px;display:grid;gap:10px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.ovc h3{font:800 20px var(--f-display);text-align:center}
.ovr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.08)}.ovr.best{box-shadow:0 0 0 2px #FFE066;background:rgba(255,224,102,.18)}
.ovr small{color:rgba(255,255,255,.7)}.ovr .p{font:800 22px var(--f-display);color:#7CE7B0}
.prog{height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,#7C3AED,#E5484D,#FF8A3D);transform-origin:left}
.err{color:#c0262d;font-weight:700}
@media (max-width:560px){:root{--cwb:clamp(44px,13.5vw,70px)}.brand{font-size:17px}.felt{padding:12px 6px 10px}}
@media (prefers-reduced-motion:reduce){.rc.drop,.seat.turn .plate{animation:none}}
</style></head><body><div id="app"></div>
<script>
/*ENGINE_START*/
const SUITS=['s','c','b','o'],ORD=[1,2,3,4,5,6,7,10,11,12];
const SUIT_N={s:'Épées',c:'Coupes',b:'Bâtons',o:'Deniers'};
const cv=c=>+c.slice(1),csu=c=>c[0];
const VNAME={1:'As',10:'Valet',11:'Cavalier',12:'Roi'};
const vName=v=>VNAME[v]||String(v);
function mkDeck(){const d=[];SUITS.forEach(su=>ORD.forEach(v=>d.push(su+v)));return d;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function maxSame(t){const m={};let x=0;t.forEach(c=>{m[cv(c)]=(m[cv(c)]||0)+1;x=Math.max(x,m[cv(c)]);});return x;}
const nameOf=(s,id)=>(s.players.find(p=>p.id===id)||{name:'?'}).name;
function rdNew(players,target){
  const s={v:1,rev:1,gid:Date.now().toString(36)+Math.random().toString(36).slice(2,6),phase:'playing',hand:0,target:target===41?41:21,
    players:players.map(p=>({id:p.id,name:p.name,av:p.av||'',bot:!!p.bot})),scores:{},first:0,turn:0,table:[],deck:[],hands:{},cap:{},played:{},ann:{},
    lastPlay:null,lastCap:null,log:[],fx:[],fxc:0,winner:null,hres:null};
  s.players.forEach(p=>{s.scores[p.id]=0;});
  rdHand(s);return s;
}
function logp(s,t){s.log.push(t);if(s.log.length>60)s.log.shift();}
function rdDeal(s){
  const n=s.players.length;
  for(let k=0;k<n;k++){const p=s.players[(s.first+k)%n];s.hands[p.id]=s.deck.splice(0,3);s.played[p.id]=0;s.ann[p.id]=false;}
  s.turn=s.first;
}
function rdHand(s){
  const n=s.players.length;
  s.hand=(s.hand||0)+1;s.deck=shuffle(mkDeck());
  for(let g=0;g<60;g++){s.table=s.deck.splice(0,4);if(maxSame(s.table)<3)break;s.deck=shuffle(s.deck.concat(s.table));}
  s.cap={};s.players.forEach(p=>{s.cap[p.id]=0;});
  s.lastPlay=null;s.lastCap=null;s.hres=null;s.first=(s.hand-1)%n;s.phase='playing';s.fx=[];
  rdDeal(s);logp(s,'Donne '+s.hand+' : '+nameOf(s,s.players[s.first].id)+' commence');
}
function rdNextHand(s){if(s.phase!=='handEnd')return false;s.rev++;rdHand(s);return true;}
const rdTurnId=s=>s.players[s.turn].id;
const rdCan=(s,pid)=>s.phase==='playing'&&rdTurnId(s)===pid;
function add(s,pid,pts){s.scores[pid]+=pts;if(s.scores[pid]>=s.target&&!s.winner)s.winner=pid;}
function rdAnnOpts(s,pid){
  if(!rdCan(s,pid)||s.played[pid]||s.ann[pid])return null;
  const cnt={};s.hands[pid].forEach(c=>{cnt[cv(c)]=(cnt[cv(c)]||0)+1;});
  let best=null;for(const v in cnt){if(cnt[v]>=3)return{kind:'tringla',v:+v,pts:5};if(cnt[v]===2)best={kind:'ronda',v:+v,pts:1};}
  return best;
}
function rdAnnounce(s,pid){
  const o=rdAnnOpts(s,pid);if(!o)return false;
  s.ann[pid]=true;s.fx=[{k:o.kind,by:pid,v:o.v,pts:o.pts}];s.fxc=(s.fxc||0)+1;
  add(s,pid,o.pts);logp(s,nameOf(s,pid)+' annonce '+(o.kind==='tringla'?'TRINGLA':'RONDA')+' de '+vName(o.v)+' (+'+o.pts+')');
  if(s.winner)rdFinish(s);
  s.rev++;return true;
}
function rdTake(s,card){
  const v=cv(card),took=s.table.filter(c=>cv(c)===v);
  if(!took.length)return[];
  let k=ORD.indexOf(v)+1;
  while(k<ORD.length){const g=s.table.filter(c=>cv(c)===ORD[k]);if(!g.length)break;took.push(...g);k++;}
  return took;
}
function rdFinish(s){s.phase='gameEnd';s.winner=s.winner||null;logp(s,nameOf(s,s.winner)+' gagne la partie');}
function rdPlay(s,pid,card){
  if(!rdCan(s,pid))return false;
  const hd=s.hands[pid],i=hd.indexOf(card);if(i<0)return false;
  s.fx=[];hd.splice(i,1);s.played[pid]++;
  const nm=nameOf(s,pid),v=cv(card),took=rdTake(s,card);
  const last=!s.deck.length&&s.players.every(p=>!s.hands[p.id].length);
  if(took.length){
    const lp=s.lastPlay;
    s.table=s.table.filter(c=>!took.includes(c));
    s.cap[pid]+=took.length+1;s.lastCap=pid;
    s.fx.push({k:'capture',by:pid,card,took:took.slice()});
    logp(s,nm+' prend '+(took.length+1)+' cartes avec '+vName(v));
    if(lp&&lp.by!==pid&&lp.v===v){add(s,pid,1);s.fx.push({k:'taper',by:pid,pts:1});logp(s,nm+' fait un TAPER (+1)');}
    if(!s.table.length&&!last){add(s,pid,1);s.fx.push({k:'missa',by:pid,pts:1});logp(s,nm+' fait MISSA (+1)');}
    s.lastPlay=null;
  }else{
    s.table.push(card);s.lastPlay={by:pid,v};
    s.fx.push({k:'place',by:pid,card});logp(s,nm+' pose '+vName(v));
  }
  s.fxc=(s.fxc||0)+1;s.rev++;
  if(s.winner){rdFinish(s);return true;}
  if(s.players.every(p=>!s.hands[p.id].length)){
    if(s.deck.length){rdDeal(s);}
    else rdEndHand(s);
  }else s.turn=(s.turn+1)%s.players.length;
  return true;
}
function rdEndHand(s){
  const n=s.players.length,per=Math.floor(40/n),res={cap:{},pts:{},rest:0,by:s.lastCap};
  if(s.lastCap&&s.table.length){res.rest=s.table.length;s.cap[s.lastCap]+=s.table.length;s.fx.push({k:'last',by:s.lastCap,n:s.table.length});logp(s,nameOf(s,s.lastCap)+' ramasse le tapis (dernière main)');}
  s.table=[];
  s.players.forEach(p=>{res.cap[p.id]=s.cap[p.id];const pt=Math.max(0,s.cap[p.id]-per);res.pts[p.id]=pt;add(s,p.id,pt);});
  s.hres=res;
  const mx=Math.max(...s.players.map(p=>s.scores[p.id]));
  if(mx>=s.target){const top=s.players.filter(p=>s.scores[p.id]===mx);if(top.length===1){s.winner=top[0].id;rdFinish(s);return;}}
  s.winner=null;s.phase='handEnd';
}
function rdBot(s,pid){
  const hd=s.hands[pid];let best=null,bs=-1e9;
  hd.forEach(c=>{
    const t=rdTake(s,c);let sc=0;
    if(t.length){sc=10+t.length*3;const lp=s.lastPlay;if(lp&&lp.by!==pid&&lp.v===cv(c))sc+=4;if(t.length===s.table.length)sc+=5;}
    else{const same=hd.filter(x=>cv(x)===cv(c)).length;sc=Math.random()*2-(same>1?1:0)-(cv(c)>=10?.5:0);}
    if(sc>bs){bs=sc;best=c;}
  });
  return best;

    h('p',{class:'muted',style:'text-align:center;color:rgba(255,255,255,.75)'},(res.rest&&res.by?nameOf(s,res.by)+' ramasse les '+res.rest+' dernières cartes. ':'')+'Chaque carte au-delà de '+Math.floor(40/s.players.length)+' rapporte 1 point.'),
    ...rows,h('div',{class:'row',style:'justify-content:space-between'},left,host?h('button',{class:'btn sm primary',type:'button',onclick:nextHand},'Passer ›'):null),h('div',{class:'prog'},bar)));
  document.body.append(ov);Snd.play('win');
  const t0=Date.now(),gid=s.gid,hd=s.hand;
  ovTm=setInterval(()=>{const rem=Math.max(0,SEC-(Date.now()-t0)/1000);bar.style.transform='scaleX('+(rem/SEC)+')';left.textContent='Donne suivante dans '+Math.ceil(rem)+' s';
    if(rem<=0){clearInterval(ovTm);ovTm=null;if(S&&S.gid===gid&&S.hand===hd&&S.phase==='handEnd'&&isHost())nextHand();}},150);
}
function nextHand(){if(!S||S.phase!=='handEnd'||!isHost())return;const s=CLONE(S);if(rdNextHand(s)){closeOv();prevTable=[];commit(s);}}
function showEnd(){
  const s=S,w=s.winner,win=w===uid;
  const rows=s.players.slice().sort((a,b)=>s.scores[b.id]-s.scores[a.id]).map(p=>h('div',{class:'ovr'+(p.id===w?' best':'')},avEl(p),h('b',null,(p.id===w?'🏆 ':'')+p.name),h('span',{class:'p'},s.scores[p.id])));
  const host=isHost();
  const ov=h('div',{class:'ov',id:'rdov'},h('div',{class:'ovc'},h('h3',null,win?'🏆 Victoire !':(nameOf(s,w)+' gagne la partie')),...rows,
    h('div',{class:'row',style:'justify-content:center'},
      host?h('button',{class:'btn primary',type:'button',onclick:rematch},'🔁 Revanche'):h('span',{class:'muted',style:'color:rgba(255,255,255,.75)'},'En attente de l\'hôte…'),
      host&&mode==='online'?h('button',{class:'btn',type:'button',onclick:()=>{closeOv();db.doc(gp(ROOM)).delete().catch(()=>{});}},'Retour à la salle'):null,
      h('button',{class:'btn',type:'button',onclick:()=>{closeOv();leaveRoom();}},'Quitter'))));
  document.body.append(ov);Snd.play(win?'win':'lose');
}
function rematch(){
  if(!S||!isHost())return;closeOv();prevTable=[];
  const ps=S.players.map(p=>({id:p.id,name:p.name,bot:p.bot}));
  commit(rdNew(ps,S.target));
}
/* ---- démarrage ---- */
async function boot(){
  uid=lsGet('f7id');if(!uid){uid='g_'+Math.random().toString(36).slice(2,12);lsSet('f7id',uid);}
  if(location.hash==='#solo'){}
  render();
  if(window.F7_FIREBASE){
    try{db=await loadFirebase(window.F7_FIREBASE);}catch(e){db=null;}
    if(db){
      lobUnsub=db.collection('lobby').onSnapshot(sn=>{
        roster=sn.docs.filter(d=>d.id.startsWith('rd_')).map(d=>{const v=d.data()||{};return{id:d.id.slice(3),name:String(v.name||'?').slice(0,16),t:+v.t||0,seen:+v.seen||0,room:+v.room||0,ready:!!v.ready,pf:String(v.pf||'')};});
        if(!mode||(mode==='online'&&!S))render();
      },()=>{});
      setInterval(()=>{if(!mode||(mode==='online'&&!S))render();},8000);
    }
    render();
  }
  window.addEventListener('beforeunload',()=>{if(db&&ROOM)db.doc('lobby/rd_'+uid).delete().catch(()=>{});});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)beat();});
}

boot();
</script></body></html>
