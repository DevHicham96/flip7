<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@1,900&family=Nunito:wght@700;800;900&display=swap">
<style>
:root{--ink:#1c1d26;--gr:#b9bbc4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.pad{padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.back{position:fixed;z-index:30;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));font:800 14px 'Nunito';color:var(--ink);background:#f1f2f5;border-radius:99px;padding:8px 14px;text-decoration:none;border:2px solid #dfe1e8}
.ttl{font:italic 900 clamp(38px,9vw,76px)/.92 'Nunito',system-ui;letter-spacing:-.02em;text-transform:uppercase;text-align:center;margin:0}
.ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#fff}
.sub{font:800 16px 'Nunito';color:#6b6e7e;text-align:center;max-width:420px;margin:0}
.btn{font:italic 900 22px 'Nunito';letter-spacing:.01em;text-transform:uppercase;color:#fff;background:var(--ink);border:0;border-radius:16px;padding:14px 34px;cursor:pointer;box-shadow:0 6px 0 #000}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
.btn.gh{background:#eceef3;color:var(--ink);box-shadow:0 5px 0 #c9ccd6;font-size:17px;padding:11px 22px}
.btn:disabled{opacity:.35}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;width:min(480px,94vw)}
.pk{border:0;background:none;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:6px 0 8px;border-radius:18px;font:italic 900 15px 'Nunito';color:var(--ink);text-transform:uppercase}

@keyframes bob{50%{transform:translateY(-10px)}}

</style></head><body>
<canvas id="c"></canvas>

<div id="hud" class="pad" hidden>

</div>

  <div id="stat2"></div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const COLS=[{n:'Rouge',c:'#f0452d'},{n:'Bleu',c:'#2f6fe0'},{n:'Jaune',c:'#f2c315'},{n:'Vert',c:'#3aa63c'},{n:'Rose',c:'#ee6fb5'},{n:'Noir',c:'#2a2733'}];
const NS=7,FLOOR=290,CEIL=70,VW=640,VH=360,GR=1800,JV=-520;
const TAG=['Piques & trous','Caisses & presses','Les scies','Pendules','Lasers','Chaos total','LA FINALE'];
const WALL=['#b9bbc4','#b7bdc9','#bcb9c9','#c4b9ba','#b8c4bc','#c4c0b4','#a9acb8'];
const SIG=[5,6,6.5,7.5,8,9,10], SKIP=[.005,.01,.015,.02,.03,.04,.05], ERR=[.01,.03,.05,.06,.08,.10,.12];
const GAP=[320,300,280,262,250,240,225], POOL=[['spike','pit'],['spike','pit','box','crusher'],['spike','pit','box','crusher','saw'],['spike','pit','box','crusher','saw','pend'],['spike','pit','box','crusher','saw','pend','laser'],['spike','pit','box','crusher','saw','pend','laser'],['spike','pit','box','crusher','saw','pend','laser']];
const st_get=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const st_set=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
let HL=false,G=null,me=st_get('sr_col'),fast=false;
if(typeof me!=='number'||me<0||me>5)me=1;

/* ---------- niveaux ---------- */
function mk(t,x,R,si,i){
  const o={t,x,i,g:0,w:0,rx:60,ph:R()*6.28};
  if(t==='spike'){o.g=1;o.w=44;o.jc=26;o.ex=x-7}
  else if(t==='box'){o.g=1;o.w=34;o.h=34;o.jc=33;o.ex=x-7}
  else if(t==='pit'){o.g=1;o.w=60+si*4;o.jc=Math.max(2,(115-o.w)/2);o.ex=x}
  else if(t==='crusher'){o.w=40;o.cx=x+20;o.per=2.5+R()*.4;o.rx=50}
  else if(t==='saw'){o.w=10;o.cx=x;o.rx=45}
  else if(t==='pend'){o.w=10;o.cx=x;o.rx=170}
  else if(t==='laser'){o.w=16;o.cx=x;o.per=2.0+R()*.5;o.rx=30}
  return o;
}
function buildStage(si,R){
  const len=2300+si*110,obs=[];let x=520,i=0;const pool=POOL[si];
  while(x<len-340){const t=pool[R()*pool.length|0];const o=mk(t,x,R,si,i++);obs.push(o);x+=Math.max(o.w,40)+GAP[si]+R()*GAP[si]*.45;}
  return{len,obs,splats:[],parts:[]};
}
function crushY(o,T){const u=((T+o.ph)%o.per)/o.per;return u<.45?110:u<.55?110+(u-.45)/.1*180:u<.8?290:290-(u-.8)/.2*180}
function sawY(o,T){return 214+54*Math.sin(T*2.2+o.ph)}
function pendB(o,T){const a=.8*Math.sin(T*1.5+o.ph);return[o.cx+200*Math.sin(a),CEIL+200*Math.cos(a)]}
function laserOn(o,T){return((T+o.ph)%o.per)/o.per<.5}
function segD(px,py,x,y0,y1){const yy=Math.max(y0,Math.min(y1,py));return Math.hypot(px-x,py-yy)}
function hitO(o,T,x,y){
  switch(o.t){
    case'spike':return x+6>o.x&&x-6<o.x+o.w&&y>FLOOR-24;
    case'box':return x+6>o.x&&x-6<o.x+o.w&&y>FLOOR-o.h+2;
    case'crusher':return Math.abs(x-o.cx)<o.w/2+5&&crushY(o,T)>y-42;
    case'saw':return Math.hypot(x-o.cx,0)<60&&segD(o.cx,sawY(o,T),x,y-40,y)<25;
    case'pend':{const b=pendB(o,T);return segD(b[0],b[1],x,y-40,y)<22}
    case'laser':return laserOn(o,T)&&Math.abs(x-o.cx)<6&&y>FLOOR-18;
  }return false;
}
const inPit=(o,x)=>x>o.x+4&&x<o.x+o.w-4;

/* ---------- partie ---------- */
function initGame(seed){
  const R=mul(seed);
  G={R,seed,si:-1,stage:null,T:0,phase:'',pt:0,camX:0,runners:COLS.map((c,i)=>({i,col:c.c,alive:true,fin:false,sk:.85+R()*.3,ph:R()*6})),winner:null,order:[]};
  startStage(0);
}
function startStage(si){
  G.si=si;G.sdead=[];G.stage=buildStage(si,G.R);G.T=0;G.camX=0;G.phase='intro';G.pt=1.5;
  const al=G.runners.filter(r=>r.alive);
  al.forEach((r,k)=>{r.x=70+k*15;r.y=FLOOR;r.vy=0;r.fin=false;r.fall=false;r.v=185+G.R()*25;r.mult=1;r.sp=0;r.dec={};r.aiT=0;r.tg=1;r.dx=0;r.dT=0;});
  ui('stage');
}
const gauss=()=>(G.R()+G.R()+G.R()+G.R()-2)*1.73;
function lethalT(T,x){for(const o of G.stage.obs){if(o.g||Math.abs(x-(o.cx||o.x))>o.rx)continue;if(hitO(o,T,x,FLOOR))return true}return false}
function safeRun(r,m){const v=r.v*m;for(let k=1;k<=26;k++){const t=k*.06;if(lethalT(G.T+t,r.x+v*t))return false}return true}
function die(r,type){
  r.alive=false;r.dx=r.x;r.dT=G.T;r.dtype=type;G.order.push(r.i);G.sdead.push(r);
  const y=Math.min(r.y,FLOOR),S=G.stage,c=r.col,R=G.R,bl=[];
  for(let k=0;k<7;k++)bl.push([(R()-.5)*34,-R()*30,4+R()*9]);
  if(type!=='pit')S.splats.push({x:r.x,y,c,bl,t:type});
  for(let k=0;k<16;k++)S.parts.push({x:r.x,y:y-20,vx:(R()-.5)*260,vy:-R()*300,c,r:2+R()*4,t:1});
  ui('dots');
}
function finish(r){r.fin=true;r.fx=r.x}
function ai(r,dt){
  const S=G.stage,si=G.si,sg=SIG[si]*r.sk;
  if(r.fall)return;
  const ground=r.y>=FLOOR&&r.vy===0;
  if(ground){
    let nx=null;for(const o of S.obs){if(o.g&&o.x+o.w>r.x-10){nx=o;break}}
    if(nx){
      let d=r.dec[nx.i];if(!d)d=r.dec[nx.i]={d:nx.jc*(r.sp||200)/200+gauss()*sg,sk:G.R()<SKIP[si]};
      if(!d.sk&&nx.ex-r.x<=d.d&&nx.ex-r.x>-20){r.vy=JV;r.y-=1}
    }
  }
  r.aiT-=dt;
  if(r.aiT<=0){
    r.aiT=.1;
    if(ground){
      let m=1;
      if(!safeRun(r,1)){
        if(G.R()<ERR[si]*r.sk)m=1;else{m=[1.45,.55,.15].find(q=>safeRun(r,q))||1}
      }
      r.tg=m;
    }
  }
}
function step(dt){
  const S=G.stage;
  if(G.phase==='intro'||G.phase==='between'||G.phase==='end'){
    G.pt-=dt;
    if(G.phase==='intro'&&G.pt<=0){G.phase='run';ui('go')}
    else if(G.phase==='between'&&G.pt<=0)startStage(G.si+1);
    else if(G.phase==='end'&&G.pt<=0){G.phase='over';ui('over')}
    updFx(dt);camTo(dt);return;
  }
  G.T+=dt;
  const al=G.runners.filter(r=>r.alive&&!r.fin);
  for(const r of al){
    ai(r,dt);
    r.mult+=(r.tg-r.mult)*Math.min(1,dt*7);
    r.sp=r.v*r.mult;
    r.ph+=dt*(r.sp/200)*12;
    if(r.fall){r.x+=r.sp*.4*dt;r.vy+=GR*dt;r.y+=r.vy*dt;if(r.y>FLOOR+58)die(r,'pit');continue}
    r.x+=r.sp*dt;
    if(r.y<FLOOR||r.vy<0){
      r.vy+=GR*dt;r.y+=r.vy*dt;
      if(r.y>=FLOOR){
        const pit=S.obs.find(o=>o.t==='pit'&&inPit(o,r.x));
        if(pit)r.fall=true;else{r.y=FLOOR;r.vy=0}
      }
    }else{
      const pit=S.obs.find(o=>o.t==='pit'&&inPit(o,r.x));
      if(pit){r.fall=true;r.vy=1}
    }
    if(!r.fall)for(const o of S.obs){
      if(o.g&&o.t==='pit')continue;
      if(Math.abs(r.x-(o.cx||o.x+o.w/2))>o.rx+30)continue;
      if(hitO(o,G.T,r.x,r.y)){die(r,o.t);break}
    }
    if(r.alive&&r.x>=S.len)finish(r);
  }
  for(const r of G.runners)if(r.alive&&r.fin&&r.x<S.len+60){r.x+=60*dt;r.ph+=dt*8}
  if(G.si===NS-1){
    const f=G.runners.filter(r=>r.alive&&r.fin).sort((a,b)=>a.fx-b.fx)[0];
    if(f&&!G.winner){G.winner=f;G.phase='end';G.pt=1.5;ui('win');updFx(dt);return}
  }
  if(!G.runners.some(r=>r.alive&&!r.fin)){endStage()}
  updFx(dt);camTo(dt);
}
function endStage(){
  const alive=G.runners.filter(r=>r.alive);
  if(alive.length===1){G.winner=alive[0];G.phase='end';G.pt=1.6;ui('win');return}
  if(alive.length===0){
    G.winner=G.sdead.slice().sort((a,b)=>(b.dx-a.dx)||(b.dT-a.dT))[0];G.phase='end';G.pt=1.6;ui('win');return;
  }
  G.phase='between';G.pt=1.5;ui('between');
}
function camTo(dt){
  const act=G.runners.filter(r=>r.alive&&!r.fin);
  let tx;
  if(G.phase==='intro')tx=0;
  else if(act.length){const mx=Math.max(...act.map(r=>r.x)),mn=Math.min(...act.map(r=>r.x));tx=Math.max(0,Math.min(mx-VWc*.55,(mx+mn)/2-VWc*.45))}
  else tx=Math.max(0,G.stage.len-VWc*.62);
  G.camX+=(tx-G.camX)*Math.min(1,dt*5);
}
function updFx(dt){
  const S=G.stage;
  for(const p of S.parts){p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt*1.4}
  S.parts=S.parts.filter(p=>p.t>0&&p.y<FLOOR+40);
}
/* simulateur (tests) */
function simGame(seed){HL=true;initGame(seed);let n=0;while(G.phase!=='over'&&n++<200000)step(1/60);const o={w:G.winner.i,si:G.si,seed};HL=false;return o}

/* ---------- dessin bonhomme ---------- */
function shade(h,f){const n=parseInt(h.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;r=r*(1-f)|0;g=g*(1-f)|0;b=b*(1-f)|0;return`rgb(${r},${g},${b})`}
function limb(c,x0,y0,a,l1,l2,k,col,w){
  const kx=x0+Math.sin(a)*l1,ky=y0+Math.cos(a)*l1,a2=a-k;
  c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x0,y0);c.lineTo(kx,ky);c.lineTo(kx+Math.sin(a2)*l2,ky+Math.cos(a2)*l2);c.stroke();
}
function man(c,x,y,col,ph,air,sc,idle){
  c.save();c.translate(x,y);c.scale(sc,sc);c.lineCap='round';c.lineJoin='round';
  const dk=shade(col,.28);
  if(!idle){c.fillStyle='rgba(0,0,0,.12)';c.beginPath();c.ellipse(0,1,13,3.5,0,0,6.3);c.fill()}
  let a1,a2,k1,k2,b1,b2;
  if(idle){a1=.15;a2=-.15;k1=k2=0;b1=.1;b2=-.1}
  else if(air){a1=.9;a2=-.7;k1=.5;k2=1.1;b1=-.9;b2=1.2}
  else{const s=Math.sin(ph),c2=Math.cos(ph);a1=s*.95;a2=-s*.95;k1=Math.max(0,-c2)*1.3+.2;k2=Math.max(0,c2)*1.3+.2;b1=-s*1.0;b2=s*1.0}
  limb(c,0,-22,a2,11,11,k2,dk,9);limb(c,2,-35,b2+.2,9,9,-.9,dk,8);
  c.strokeStyle=col;c.lineWidth=13;c.beginPath();c.moveTo(-1,-23);c.lineTo(3,-36);c.stroke();
  limb(c,0,-22,a1,11,11,k1,col,10);limb(c,2,-35,b1+.2,9,9,-.9,col,8.5);
  c.fillStyle=col;c.beginPath();c.arc(5,-46,10,0,6.3);c.fill();
  c.restore();
}
function splat(c,s){
  c.fillStyle=s.c;
  const flat=s.t==='crusher';
  for(const b of s.bl){c.beginPath();c.ellipse(s.x+b[0],s.y+(flat?-3:b[1]*.7),b[2]*(flat?1.6:1),b[2]*(flat?.5:1),0,0,6.3);c.fill()}
  c.beginPath();c.ellipse(s.x,s.y-2,15,4,0,0,6.3);c.fill();
}

/* ---------- rendu ---------- */
let VWc=640;const cv=$('c'),cx=cv.getContext('2d');let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;VWc=W/H<.8?400:640;cv.width=W*DPR;cv.height=H*DPR}
addEventListener('resize',resize);resize();
function hazard(c,o,T){
  if(o.t==='spike'){
    c.fillStyle='#4a4d5c';c.fillRect(o.x-4,FLOOR-4,o.w+8,5);
    for(let k=0;k<3;k++){const bx=o.x+4+k*13;c.fillStyle=k===1?'#8b8ea0':'#6b6e80';c.beginPath();c.moveTo(bx,FLOOR-4);c.lineTo(bx+7,FLOOR-30);c.lineTo(bx+14,FLOOR-4);c.fill()}
  }else if(o.t==='box'){
    c.fillStyle='#4b4e5d';c.fillRect(o.x,FLOOR-o.h,o.w,o.h);c.strokeStyle='#767a8c';c.lineWidth=3;c.strokeRect(o.x+2,FLOOR-o.h+2,o.w-4,o.h-4);
    c.beginPath();c.moveTo(o.x+3,FLOOR-o.h+3);c.lineTo(o.x+o.w-3,FLOOR-3);c.moveTo(o.x+o.w-3,FLOOR-o.h+3);c.lineTo(o.x+3,FLOOR-3);c.stroke();
    c.fillStyle='#f5a300';for(let k=0;k<4;k++)c.fillRect(o.x+k*9,FLOOR-o.h-5,5,5);
  }else if(o.t==='pit'){
    c.fillStyle='#2f313d';c.fillRect(o.x,FLOOR-1,o.w,62);
    c.fillStyle='#d6d8df';c.fillRect(o.x-4,FLOOR,4,6);c.fillRect(o.x+o.w,FLOOR,4,6);
  }else if(o.t==='crusher'){
    const b=crushY(o,T);
    c.fillStyle='#6b6e7e';c.fillRect(o.cx-4,CEIL,8,b-CEIL-24);
    c.fillStyle='#8a8d9b';c.fillRect(o.cx-24,CEIL-4,48,10);
    c.fillStyle='#e8542a';c.beginPath();c.roundRect(o.cx-22,b-30,44,24,5);c.fill();
    c.fillStyle='#fff';for(let k=0;k<5;k++)c.fillRect(o.cx-18+k*8,b-22,4,8);
    c.fillStyle='#3a3d4a';c.fillRect(o.cx-22,b-6,44,6);for(let k=0;k<8;k++){c.beginPath();c.moveTo(o.cx-22+k*5.5,b);c.lineTo(o.cx-19.5+k*5.5,b+6);c.lineTo(o.cx-17+k*5.5,b);c.fill()}
  }else if(o.t==='saw'){
    const y=sawY(o,T);c.fillStyle='#6b6e7e';c.fillRect(o.cx-3,CEIL,6,y-CEIL);
    c.save();c.translate(o.cx,y);c.rotate(T*9);c.fillStyle='#4a4d5c';c.beginPath();
    for(let k=0;k<16;k++){const a=k/16*6.283,r=k%2?17:23;c.lineTo(Math.cos(a)*r,Math.sin(a)*r)}c.fill();
    c.fillStyle='#9a9db0';c.beginPath();c.arc(0,0,8,0,6.3);c.fill();c.fillStyle='#4a4d5c';c.beginPath();c.arc(0,0,3,0,6.3);c.fill();c.restore();
  }else if(o.t==='pend'){
    const b=pendB(o,T);c.strokeStyle='#6b6e7e';c.lineWidth=4;c.beginPath();c.moveTo(o.cx,CEIL);c.lineTo(b[0],b[1]);c.stroke();
    c.fillStyle='#8a8d9b';c.beginPath();c.arc(o.cx,CEIL,7,0,6.3);c.fill();
    c.fillStyle='#3a3d4a';c.beginPath();c.arc(b[0],b[1],17,0,6.3);c.fill();c.fillStyle='#5a5d6e';c.beginPath();c.arc(b[0]-5,b[1]-5,6,0,6.3);c.fill();
  }else if(o.t==='laser'){
    c.fillStyle='#3a3d4a';c.fillRect(o.cx-9,FLOOR-30,6,30);c.fillRect(o.cx+3,FLOOR-30,6,30);
    const on=laserOn(o,T);c.strokeStyle=on?'#ff2a3a':'rgba(255,42,58,.18)';c.lineWidth=on?4:2;
    if(on){c.shadowColor='#ff2a3a';c.shadowBlur=10}c.beginPath();c.moveTo(o.cx-3,FLOOR-16);c.lineTo(o.cx+3,FLOOR-16);c.stroke();c.shadowBlur=0;
    c.fillStyle=on?'#ff2a3a':'#7b7e90';c.fillRect(o.cx-8,FLOOR-34,4,4);c.fillRect(o.cx+4,FLOOR-34,4,4);
  }
}
function draw(){
  const c=cx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#fff';c.fillRect(0,0,W,H);
  if(!G||!G.stage)return;
  const S=G.stage,s=Math.min(W/VWc,H*.56/VH),ox=(W-VWc*s)/2,oy=(H-VH*s)/2+H*.03;
  const xl=G.camX-ox/s-10,xr=G.camX+(W-ox)/s+10;
  c.setTransform(DPR*s,0,0,DPR*s,DPR*(ox-G.camX*s),DPR*oy);
  c.fillStyle=WALL[G.si];c.fillRect(xl,CEIL,xr-xl,FLOOR-CEIL);
  c.fillStyle='rgba(0,0,0,.06)';for(let x=Math.floor(xl/120)*120;x<xr;x+=120)c.fillRect(x,CEIL,60,FLOOR-CEIL);
  c.fillStyle='rgba(255,255,255,.35)';c.fillRect(xl,FLOOR,xr-xl,8);
  c.fillStyle='rgba(0,0,0,.1)';c.fillRect(xl,CEIL,xr-xl,5);
  // départ + arrivée
  c.fillStyle='#fff';c.fillRect(30,CEIL,4,FLOOR-CEIL);
  for(let k=0;k<(FLOOR-CEIL)/12;k++){c.fillStyle=k%2?'#fff':'#1c1d26';c.fillRect(S.len,CEIL+k*12,12,12);c.fillStyle=k%2?'#1c1d26':'#fff';c.fillRect(S.len+12,CEIL+k*12,12,12)}
  for(const o of S.obs){if(o.x>xr+200||o.x<xl-220)continue;hazard(c,o,G.T)}
  for(const sp of S.splats)splat(c,sp);
  const rs=G.runners.filter(r=>r.alive&&r.x!==undefined).sort((a,b)=>a.x-b.x);
  for(const r of rs){
    const air=r.y<FLOOR-2||r.fall;
    man(c,r.x,r.y,r.col,r.ph,air,1,r.fin&&r.x>=S.len+55&&G.phase!=='run');
    if(r.i===me){c.fillStyle='#1c1d26';c.beginPath();c.moveTo(r.x+5,r.y-64);c.lineTo(r.x-2,r.y-76);c.lineTo(r.x+12,r.y-76);c.fill()}
  }
  for(const p of S.parts){c.globalAlpha=Math.max(0,p.t);c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.r,0,6.3);c.fill()}
  c.globalAlpha=1;
}
/* ---------- UI ---------- */
const minis=[];
function buildPicks(){
  const box=$('picks');box.innerHTML='';minis.length=0;
  COLS.forEach((col,i)=>{
    const b=document.createElement('button');b.className='pk'+(i===me?' on':'');
    const cv2=document.createElement('canvas');cv2.width=168;cv2.height=208;b.append(cv2,col.n);
    b.onclick=()=>{me=i;st_set('sr_col',i);[...box.children].forEach((e,k)=>e.classList.toggle('on',k===i))};
    box.append(b);minis.push({cv:cv2,col:col.c,ph:i*1.3});
  });
  const t=st_get('sr_stats')||{p:0,w:0};$('stat').textContent=t.p?`Tes paris gagnés : ${t.w} / ${t.p}`:'';
}
function ui(ev){
  if(HL)return;
  if(ev==='stage'){
    $('hud').hidden=false;$('bot').hidden=false;$('bk').hidden=true;$('stg').textContent=`Stage ${G.si+1} / ${NS}`;
    banner(G.si===NS-1?'🏁 Finale':`Stage ${G.si+1}`,TAG[G.si]);dots();$('bar').firstElementChild.style.width=(G.si/NS*100)+'%';
    $('hint').style.opacity=G.si===0?1:.0;
  }else if(ev==='go'){banner('',' ');$('banner').hidden=true}
  else if(ev==='dots'){dots()}
  else if(ev==='between'){
    const n=G.runners.filter(r=>r.alive).length;
    $('bar').firstElementChild.style.width=((G.si+1)/NS*100)+'%';
    banner('Stage terminé',n+' survivants');
  }else if(ev==='win'){
    dots();banner('Gagnant : '+COLS[G.winner.i].n.toUpperCase(),G.winner.i===me?'Bien joué, ton pari est gagnant ! 🎉':'');
  }else if(ev==='over')showRes();
}
function banner(t,s){const b=$('banner');b.hidden=false;b.firstElementChild.textContent=t;b.lastElementChild.textContent=s;b.lastElementChild.style.display=s.trim()?'':'none'}
function dots(){
  const d=$('dots');d.innerHTML='';
  G.runners.forEach(r=>{const e=document.createElement('b');e.style.background=r.col;if(!r.alive){e.className='x';e.textContent='✕'}else if(r.i===me)e.className='me';d.append(e);if(!r.alive&&r.i===me)e.className='x me'});
}
function showRes(){
  $('hud').hidden=true;$('bot').hidden=true;$('banner').hidden=true;$('res').hidden=false;$('bk').hidden=false;
  const w=G.winner,win=w.i===me;
  $('rt').textContent='Le gagnant est '+COLS[w.i].n;
  const c=$('rc').getContext('2d');c.clearRect(0,0,320,420);man(c,160,375,w.col,0,false,7,true);
  $('rs').textContent=win?'🎉 Ton pari est gagnant !':`Perdu... ta couleur (${COLS[me].n}) n'a pas survécu.`;
  const t=st_get('sr_stats')||{p:0,w:0};t.p++;if(win)t.w++;st_set('sr_stats',t);
  $('stat2').textContent=`Tes paris gagnés : ${t.w} / ${t.p}`;
}
function startGame(){
  $('pick').hidden=true;$('res').hidden=true;
  initGame((Math.random()*2**31)|0);
}
$('go').onclick=startGame;$('again').onclick=startGame;
$('chg').onclick=()=>{$('bk').hidden=false;$('res').hidden=true;$('pick').hidden=false;G=null;buildPicks()};
$('fast').onclick=e=>{fast=!fast;e.currentTarget.classList.toggle('on',fast)};
function jump(){
  if(!G||G.phase!=='run')return;
  const r=G.runners[me];if(r.alive&&!r.fin&&!r.fall&&r.y>=FLOOR&&r.vy===0){r.vy=JV;r.y-=1}
}
cv.addEventListener('pointerdown',jump);
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});
/* boucle */
let last=0,acc=0;
function loop(t){
  const dt=Math.min(.1,(t-last)/1000||0);last=t;
  if(G&&G.phase&&G.phase!=='over'){acc+=dt*(fast?2:1);while(acc>=1/60){step(1/60);acc-=1/60}}
  draw();
  if(!$('pick').hidden){
    for(const m of minis){m.ph+=dt*9;const c=m.cv.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,168,208);c.setTransform(2,0,0,2,0,0);man(c,40,98,m.col,m.ph,false,1.6,false)}
  }
  requestAnimationFrame(loop);
}
buildPicks();requestAnimationFrame(loop);
window.__sr={simGame,get G(){return G},step,initGame,COLS};
})();
</script>
