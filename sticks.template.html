<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Sticks Race · Atelier Gaming</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f0452d'/%3E%3Ccircle cx='36' cy='18' r='8' fill='%23fff'/%3E%3Cpath d='M34 26l-6 16-10 4M34 26l10 8 8-2M30 40l12 8' stroke='%23fff' stroke-width='6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@1,900&family=Nunito:wght@700;800;900&display=swap">
<style>
:root{--ink:#1c1d26;--gr:#b9bbc4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:'Nunito',system-ui,sans-serif;touch-action:manipulation}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.pad{padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.back{position:fixed;z-index:30;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));font:800 14px 'Nunito';color:var(--ink);background:#f1f2f5;border-radius:99px;padding:8px 14px;text-decoration:none;border:2px solid #dfe1e8}
.ttl{font:italic 900 clamp(38px,9vw,76px)/.92 'Nunito',system-ui;letter-spacing:-.02em;text-transform:uppercase;text-align:center;margin:0}
.ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#fff;overflow:auto}
.sub{font:800 16px 'Nunito';color:#6b6e7e;text-align:center;max-width:420px;margin:0}
.btn{font:italic 900 22px 'Nunito';letter-spacing:.01em;text-transform:uppercase;color:#fff;background:var(--ink);border:0;border-radius:16px;padding:14px 34px;cursor:pointer;box-shadow:0 6px 0 #000;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #000}

.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.col{display:grid;gap:12px;justify-items:center}
#picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;width:min(480px,94vw)}
.pk{border:0;background:none;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:6px 0 8px;border-radius:18px;font:italic 900 15px 'Nunito';color:var(--ink);text-transform:uppercase}
.pk canvas{width:84px;height:104px}
.pk.on{background:#eef0f5;box-shadow:inset 0 0 0 3px var(--ink)}
#hud{position:fixed;z-index:10;top:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#stg{font:italic 900 clamp(20px,5vw,30px) 'Nunito';text-transform:uppercase;letter-spacing:-.01em}
#trk{position:relative;width:min(340px,76vw);height:10px;border-radius:5px;background:#e6e8ee}
#trk i{position:absolute;top:-4px;width:18px;height:18px;margin-left:-9px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px #0004;transition:left .12s linear}
#trk i.x{background:#c9ccd6!important;opacity:.7}
#trk i.me{box-shadow:0 0 0 3px var(--ink)}
#info{font:800 13px 'Nunito';color:#6b6e7e}
#banner{position:fixed;z-index:12;left:0;right:0;top:30%;text-align:center;pointer-events:none;display:grid;gap:6px;justify-items:center}
#banner .t{font:italic 900 clamp(36px,10vw,80px)/.95 'Nunito';text-transform:uppercase;letter-spacing:-.02em;text-shadow:0 4px 0 #fff,0 0 20px #fff;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#banner .s{font:800 clamp(15px,3.6vw,22px) 'Nunito';color:#4b4e5e;background:#fffc;padding:3px 14px;border-radius:99px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4) translateY(30px);opacity:0}100%{transform:none;opacity:1}}
#cd{position:fixed;z-index:13;left:0;right:0;top:46%;text-align:center;pointer-events:none;font:italic 900 clamp(90px,26vw,200px)/1 'Nunito';color:var(--ink);text-shadow:0 6px 0 #fff;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
#bot{position:fixed;z-index:10;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;pointer-events:none}
#bot>*{pointer-events:auto}
#mid{display:grid;justify-items:center;gap:8px;pointer-events:none}
#hint{font:800 14px 'Nunito';color:#6b6e7e;text-align:center;max-width:44vw}
#fast{font:italic 900 16px 'Nunito';border:2px solid #dfe1e8;background:#f1f2f5;color:var(--ink);border-radius:99px;padding:7px 18px;pointer-events:auto}
#fast.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cb{width:92px;height:92px;border-radius:50%;border:0;background:var(--ink);color:#fff;font:italic 900 13px 'Nunito';text-transform:uppercase;display:grid;place-items:center;align-content:center;gap:0;box-shadow:0 6px 0 #000;touch-action:none}
.cb span{font-size:34px;line-height:1}
.cb:active,.cb.dn{transform:translateY(4px);box-shadow:0 2px 0 #000}
#spl{background:#7a3df0;box-shadow:0 6px 0 #4a1fa8}
#spl.rdy{animation:pls 1s ease-in-out infinite}
#spl:disabled{background:#c9ccd6;box-shadow:0 6px 0 #a9acb8;animation:none;opacity:.7}
@keyframes pls{50%{transform:scale(1.08)}}
#flash{position:fixed;inset:0;z-index:11;background:#fff;pointer-events:none;opacity:0}
#rank{display:grid;gap:6px;width:min(340px,90vw)}
.rk{display:flex;align-items:center;gap:10px;font:900 16px 'Nunito';padding:6px 12px;border-radius:12px;background:#f3f4f8}
.rk.w{background:#ffe9a8;font-size:19px}
.rk.me{box-shadow:inset 0 0 0 3px var(--ink)}
.rk i{width:20px;height:20px;border-radius:50%;flex:none}
.rk span{margin-left:auto;font-weight:800;font-size:13px;color:#6b6e7e}
#rc{width:min(150px,38vw);height:auto;animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
#stat,#stat2{font:800 14px 'Nunito';color:#8a8d9b}
#rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:min(460px,94vw)}
.rm{border:2px solid #dfe1e8;background:#f6f7fa;border-radius:16px;padding:10px 12px;text-align:left;font:900 15px 'Nunito';cursor:pointer;min-height:68px;color:var(--ink)}
.rm small{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;min-height:14px;font:800 12px 'Nunito';color:#8a8d9b}
.rm small i{width:14px;height:14px;border-radius:50%}
.rm:active{background:#eceef3}
#nm{font:800 18px 'Nunito';text-align:center;border:2px solid #dfe1e8;border-radius:14px;padding:10px 14px;width:min(260px,80vw);color:var(--ink);background:#fff;user-select:text;-webkit-user-select:text}
#mem{display:grid;gap:8px;width:min(340px,90vw)}
.mb{display:flex;align-items:center;gap:10px;font:900 17px 'Nunito';padding:9px 14px;border-radius:14px;background:#f3f4f8}
.mb i{width:22px;height:22px;border-radius:50%}
.mb span{margin-left:auto;font-size:12px;color:#8a8d9b;font-weight:800}
#err{font:800 14px 'Nunito';color:#d0301b;min-height:18px}
#tst{position:fixed;z-index:40;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;font:800 14px 'Nunito';padding:9px 16px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none}
#tst.on{opacity:1}
</style></head><body>
<canvas id="c"></canvas>

  <div id="stg"></div><div id="trk"></div><div id="info"></div>

<div id="home" class="ov pad">

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const jl=k=>{try{return JSON.parse(ld(k,'null'))}catch(e){return null}};
const COLS=[{n:'Rouge',c:'#f0452d'},{n:'Bleu',c:'#2f6fe0'},{n:'Jaune',c:'#f2c315'},{n:'Vert',c:'#3aa63c'},{n:'Rose',c:'#ee6fb5'},{n:'Noir',c:'#2a2733'}];
const SPL=[null,{ic:'🛡️',n:'Bouclier'},{ic:'👻',n:'Fantôme'},{ic:'🚀',n:'Turbo'},{ic:'🔄',n:'Échange'}];
const NS=7,FLOOR=290,CEIL=70,VH=360,GR=1800,JV=-520;
const TAG=['Piques','Piques & trous','Caisses','Presses','Scies','Pendules','LASERS · FINALE'];
const WALL=['#b9bbc4','#b7bdc9','#bcb9c9','#c4b9ba','#b8c4bc','#c4c0b4','#a9acb8'];
/* difficulté : chaque stage ajoute un piège et serre tout (vitesse, espacement, rythme) */
const ST=[
 {v:168,gap:380,len:1900,pool:['spike'],cmb:0,cr:2.8,sw:1.6,pd:1.3,ls:2.7,sg:4,er:0.01,ps:0.003},
 {v:178,gap:340,len:2100,pool:['spike','pit'],cmb:0,cr:2.7,sw:1.7,pd:1.35,ls:2.6,sg:6,er:0.04,ps:0.012},
 {v:188,gap:315,len:2250,pool:['spike','pit','box'],cmb:.18,cr:2.6,sw:1.8,pd:1.4,ls:2.5,sg:9,er:0.08,ps:0.03},
 {v:198,gap:290,len:2400,pool:['spike','pit','box','crusher'],cmb:.22,cr:2.3,sw:1.9,pd:1.45,ls:2.4,sg:12,er:0.13,ps:0.055},
 {v:208,gap:270,len:2550,pool:['spike','pit','box','crusher','saw'],cmb:.26,cr:2.1,sw:2.1,pd:1.5,ls:2.3,sg:15,er:0.18,ps:0.085},
 {v:219,gap:252,len:2700,pool:['spike','pit','box','crusher','saw','pend'],cmb:.3,cr:1.9,sw:2.3,pd:1.6,ls:2.1,sg:18,er:0.24,ps:0.115},
 {v:232,gap:238,len:2900,pool:['spike','pit','box','crusher','saw','pend','laser'],cmb:.38,cr:1.7,sw:2.5,pd:1.75,ls:1.9,sg:21,er:0.3,ps:0.15}
];
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const r1=v=>Math.round(v*10)/10,r2=v=>Math.round(v*100)/100;
let G=null,me=+ld('sr_col',1),fast=false,HL=false;
if(!(me>=0&&me<6))me=1;
const myName=()=>(ld('f7name','')||'Joueur').trim().slice(0,14)||'Joueur';
let uid=ld('f7id','');if(!uid){uid='g_'+Math.random().toString(36).slice(2,12);sv('f7id',uid)}

/* ================= niveaux ================= */
function mk(t,x,R,si,i){
  const P=ST[si],o={t,x,i,g:0,w:0,rx:60,ph:R()*6.28};
  if(t==='spike'){o.g=1;o.w=44;o.jc=26;o.ex=x-7}
  else if(t==='box'){o.g=1;o.w=34;o.h=34;o.jc=33;o.ex=x-7}
  else if(t==='pit'){o.g=1;o.w=56+si*4;o.jc=Math.max(2,(115-o.w)/2);o.ex=x}
  else if(t==='crusher'){o.w=40;o.cx=x+20;o.per=P.cr+R()*.3;o.rx=50}
  else if(t==='saw'){o.w=10;o.cx=x;o.rx=45;o.sp=P.sw}
  else if(t==='pend'){o.w=10;o.cx=x;o.rx=170;o.sp=P.pd}
  else if(t==='laser'){o.w=16;o.cx=x;o.per=P.ls+R()*.4;o.rx=30}
  return o;
}
function buildStage(si,seed){
  const R=mul(seed+si*7919+13),P=ST[si],len=P.len,obs=[];let x=520,i=0;
  const gnd=P.pool.filter(t=>t==='spike'||t==='pit'||t==='box');
  while(x<len-340){
    const t=P.pool[R()*P.pool.length|0],o=mk(t,x,R,si,i++);obs.push(o);let end=x+Math.max(o.w,40);
    if(o.g&&R()<P.cmb){const t2=gnd[R()*gnd.length|0],x2=end+150+R()*30,o2=mk(t2,x2,R,si,i++);obs.push(o2);end=x2+o2.w}
    x=end+P.gap+R()*P.gap*.4;
  }
  return{len,obs,splats:[]};
}
const crushY=(o,T)=>{const u=((T+o.ph)%o.per)/o.per;return u<.45?110:u<.55?110+(u-.45)/.1*180:u<.8?290:290-(u-.8)/.2*180};
const sawY=(o,T)=>214+54*Math.sin(T*o.sp+o.ph);
const pendB=(o,T)=>{const a=.8*Math.sin(T*o.sp+o.ph);return[o.cx+200*Math.sin(a),CEIL+200*Math.cos(a)]};
const laserOn=(o,T)=>((T+o.ph)%o.per)/o.per<.5;
const segD=(px,py,x,y0,y1)=>Math.hypot(px-x,py-Math.max(y0,Math.min(y1,py)));
function hitO(o,T,x,y){
  switch(o.t){
    case'spike':return x+6>o.x&&x-6<o.x+o.w&&y>FLOOR-24;
    case'box':return x+6>o.x&&x-6<o.x+o.w&&y>FLOOR-o.h+2;
    case'crusher':return Math.abs(x-o.cx)<o.w/2+5&&crushY(o,T)>y-42;
    case'saw':return segD(o.cx,sawY(o,T),x,y-40,y)<25;
    case'pend':{const b=pendB(o,T);return segD(b[0],b[1],x,y-40,y)<22}
    case'laser':return laserOn(o,T)&&Math.abs(x-o.cx)<6&&y>FLOOR-18;
  }return false;
}
const inPit=(o,x)=>x>o.x+4&&x<o.x+o.w-4;
const pitAt=x=>{for(const o of G.stage.obs)if(o.t==='pit'&&inPit(o,x))return o;return null};

/* ================= partie ================= */
const PH=['intro','run','between','end','over'];
/* cfg: {seed,me,players:[{id,name}],net,host,auto} */
function initGame(cfg){
  const R=mul(cfg.seed*3+1),pl=cfg.players||[];
  G={R,seed:cfg.seed,rid:cfg.seed,si:-1,stage:null,T:0,phase:'intro',pt:3,camX:0,me:cfg.me,net:!!cfg.net,host:cfg.host!==false,auto:!!cfg.auto,
     players:pl,winner:null,rank:null,order:[],evq:[],evid:0,seen:new Set(),parts:[],slowT:0,shake:0,lastSnap:0,finOrder:[],
     runners:COLS.map((c,i)=>{const hum=cfg.net?i<pl.length:i===cfg.me;
       return{i,col:c.c,name:hum&&pl[i]?pl[i].name:(hum?myName():c.n),hum,auto:hum&&!!cfg.auto,alive:true,fin:false,fall:false,sk:.85+R()*.3,ph:R()*6,x:70,y:FLOOR,vy:0,sp:0,v:170,mult:1,tg:1,
         spell:0,shield:false,inv:0,gh:0,turbo:0,brake:false,jq:0,spq:0,sq:0,dust:0,wasAir:false,dsi:0,dec:{},aiT:0,dx:0,dT:0}})};
  startStage(0);
}
function startStage(si){
  G.si=si;G.sdead=[];G.stage=buildStage(si,G.seed);G.T=0;G.camX=0;G.phase='intro';G.pt=si===0?3.4:2.2;G.parts=[];
  const al=G.runners.filter(r=>r.alive);
  al.forEach((r,k)=>{Object.assign(r,{x:70+k*15,y:FLOOR,vy:0,fin:false,fall:false,v:ST[si].v+G.R()*20,mult:1,sp:0,dec:{},aiT:0,tg:1,dx:0,dT:0,shield:false,inv:0,gh:0,turbo:0,jq:0,spq:0,brake:false,spell:1+(G.R()*4|0),snapNow:1})});
  ui('stage');
}
const gauss=()=>(G.R()+G.R()+G.R()+G.R()-2)*1.73;
function lethalT(T,x){for(const o of G.stage.obs){if(o.g||Math.abs(x-(o.cx||o.x))>o.rx)continue;if(hitO(o,T,x,FLOOR))return true}return false}
function safeRun(r,m){const v=r.v*m;for(let k=1;k<=26;k++){const t=k*.06;if(lethalT(G.T+t,r.x+v*t))return false}return true}
function emit(ev){ev.id=++G.evid;ev.ts=performance.now();G.evq.push(ev);if(G.evq.length>40)G.evq.shift();fx(ev)}
function die(r,type){
  r.alive=false;r.dx=r.x;r.dT=G.T;r.dtype=type;r.dsi=G.si+1;G.order.push(r);G.sdead.push(r);
  emit({t:'d',i:r.i,x:r1(r.x),y:r1(Math.min(r.y,FLOOR)),ty:type});
  G.slowT=r.i===G.me?.7:.35;
  ui('dots');
}
function cast(r){
  if(!r.spell)return false;const k=r.spell;
  if(k===4){
    let t=null;for(const o of G.runners)if(o!==r&&o.alive&&!o.fin&&!o.fall&&o.x>r.x+10&&o.x<r.x+520&&(!t||o.x<t.x))t=o;
    if(!t)return false;
    const a=r.x,b=t.x;emit({t:'sw',i:r.i,j:t.i,a:r1(a),b:r1(b)});
    r.x=b;t.x=a;for(const q of[r,t]){q.y=FLOOR;q.vy=0;q.inv=Math.max(q.inv,.9);q.snapNow=1}
  }else{
    if(k===1)r.shield=true;else if(k===2){r.gh=2;r.inv=Math.max(r.inv,2.2)}else if(k===3)r.turbo=1.8;
    emit({t:'sp',i:r.i,k,x:r1(r.x),y:r1(r.y)});
  }
  r.spell=0;return true;
}
function finish(r){r.fin=true;r.fx=r.x;G.finOrder.push(r);emit({t:'f',i:r.i,x:r1(r.x)})}
function hitFx(r,o){
  if(r.inv>0)return;
  if(r.shield){r.shield=false;r.inv=.9;emit({t:'sh',i:r.i,x:r1(r.x),y:r1(r.y)});return}
  die(r,o.t);
}
function ai(r,dt){
  const S=G.stage,P=ST[G.si],sg=P.sg*r.sk;
  if(r.fall)return;
  const ground=r.y>=FLOOR&&r.vy===0;

    c.fillStyle='#9a9db0';c.beginPath();c.arc(0,0,8,0,6.3);c.fill();c.fillStyle='#4a4d5c';c.beginPath();c.arc(0,0,3,0,6.3);c.fill();c.restore();
  }else if(o.t==='pend'){
    const b=pendB(o,T);c.strokeStyle='#6b6e7e';c.lineWidth=4;c.beginPath();c.moveTo(o.cx,CEIL);c.lineTo(b[0],b[1]);c.stroke();
    c.fillStyle='#8a8d9b';c.beginPath();c.arc(o.cx,CEIL,7,0,6.3);c.fill();
    c.fillStyle='#3a3d4a';c.beginPath();c.arc(b[0],b[1],17,0,6.3);c.fill();c.fillStyle='#5a5d6e';c.beginPath();c.arc(b[0]-5,b[1]-5,6,0,6.3);c.fill();
  }else if(o.t==='laser'){
    c.fillStyle='#3a3d4a';c.fillRect(o.cx-9,FLOOR-30,6,30);c.fillRect(o.cx+3,FLOOR-30,6,30);
    const on=laserOn(o,T);c.strokeStyle=on?'#ff2a3a':'rgba(255,42,58,.18)';c.lineWidth=on?4:2;
    if(on){c.shadowColor='#ff2a3a';c.shadowBlur=10}c.beginPath();c.moveTo(o.cx-3,FLOOR-16);c.lineTo(o.cx+3,FLOOR-16);c.stroke();c.shadowBlur=0;
    c.fillStyle=on?'#ff2a3a':'#7b7e90';c.fillRect(o.cx-8,FLOOR-34,4,4);c.fillRect(o.cx+4,FLOOR-34,4,4);
  }
}
function drawRunner(c,r,S){
  const air=r.y<FLOOR-2||r.fall,idle=(r.fin&&r.x>=S.len+60&&G.phase!=='run')||((G.phase==='intro'||G.phase==='between')&&r.alive&&r.sp<5);
  c.save();
  if(!r.fall){const h=Math.max(0,FLOOR-r.y),sc=1-Math.min(.6,h/120);c.fillStyle='rgba(0,0,0,.14)';c.beginPath();c.ellipse(r.x,FLOOR+1,13*sc,3.5*sc,0,0,6.3);c.fill()}
  if(r.gh>0){c.globalAlpha=.5;c.shadowColor='#fff';c.shadowBlur=14}
  else if(r.inv>0&&((G.T*18)|0)%2)c.globalAlpha=.55;
  man(c,r.x,r.y,r.col,r.ph,air,1,idle,r.sq,r.vy);
  c.restore();
  if(r.shield){const p=1+Math.sin(G.T*8)*.05;c.save();c.translate(r.x+2,r.y-26);c.scale(p,p);c.fillStyle='rgba(122,215,255,.22)';c.strokeStyle='rgba(122,215,255,.9)';c.lineWidth=2.5;c.beginPath();c.arc(0,0,32,0,6.3);c.fill();c.stroke();c.restore()}
  if(r.turbo>0){c.strokeStyle='rgba(255,176,32,.7)';c.lineWidth=2;for(let k=0;k<3;k++){c.beginPath();c.moveTo(r.x-30-k*8,r.y-12-k*12);c.lineTo(r.x-62-k*8,r.y-12-k*12);c.stroke()}}
  if(r.hum&&r.alive){
    c.font='800 11px Nunito,system-ui';c.textAlign='center';
    const w=c.measureText(r.name).width+10;c.fillStyle='rgba(28,29,38,.85)';c.beginPath();c.roundRect(r.x+3-w/2,r.y-75,w,15,7);c.fill();c.fillStyle='#fff';c.fillText(r.name,r.x+3,r.y-64);
  }
  if(r.i===G.me&&r.alive){c.fillStyle='#1c1d26';c.beginPath();c.moveTo(r.x+5,r.y-80);c.lineTo(r.x-2,r.y-92);c.lineTo(r.x+12,r.y-92);c.fill()}
}
function draw(){
  const c=cx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#fff';c.fillRect(0,0,W,H);
  if(!G||!G.stage)return;
  const S=G.stage,s=Math.min(W/VWc,H*.56/VH),ox=(W-VWc*s)/2,oy=(H-VH*s)/2+H*.03;
  const sh=G.shake>0?G.shake*14:0,shx=sh?(Math.random()-.5)*sh:0,shy=sh?(Math.random()-.5)*sh:0;
  const xl=G.camX-ox/s-10,xr=G.camX+(W-ox)/s+10;
  c.setTransform(DPR*s,0,0,DPR*s,DPR*(ox-G.camX*s+shx),DPR*(oy+shy));
  const g=c.createLinearGradient(0,CEIL,0,FLOOR);g.addColorStop(0,shade(WALL[G.si],.12));g.addColorStop(1,WALL[G.si]);
  c.fillStyle=g;c.fillRect(xl,CEIL,xr-xl,FLOOR-CEIL);
  const off=G.camX*.45;c.fillStyle='rgba(0,0,0,.07)';
  for(let x=Math.floor((xl-off)/150)*150;x<xr-off+150;x+=150)c.fillRect(x+off,CEIL,40,FLOOR-CEIL);
  c.fillStyle='rgba(0,0,0,.05)';for(let x=Math.floor(xl/120)*120;x<xr;x+=120)c.fillRect(x,CEIL,60,FLOOR-CEIL);
  for(let x=Math.floor(xl/240)*240;x<xr;x+=240){const gl=c.createRadialGradient(x+60,CEIL+4,2,x+60,CEIL+4,70);gl.addColorStop(0,'rgba(255,255,255,.55)');gl.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=gl;c.fillRect(x-20,CEIL,160,90);c.fillStyle='#f4f5fa';c.fillRect(x+40,CEIL,40,4)}
  c.fillStyle='rgba(255,255,255,.4)';c.fillRect(xl,FLOOR,xr-xl,8);c.fillStyle='rgba(0,0,0,.08)';for(let x=Math.floor(xl/48)*48;x<xr;x+=48)c.fillRect(x,FLOOR+3,22,2);
  c.fillStyle='rgba(0,0,0,.12)';c.fillRect(xl,CEIL,xr-xl,5);
  c.fillStyle='#fff';c.fillRect(30,CEIL,4,FLOOR-CEIL);
  for(let k=0;k<(FLOOR-CEIL)/12;k++){c.fillStyle=k%2?'#fff':'#1c1d26';c.fillRect(S.len,CEIL+k*12,12,12);c.fillStyle=k%2?'#1c1d26':'#fff';c.fillRect(S.len+12,CEIL+k*12,12,12)}
  for(const o of S.obs){if(o.x>xr+200||o.x<xl-220)continue;hazard(c,o,G.T)}
  for(const sp of S.splats)splat(c,sp);
  const rs=G.runners.filter(r=>r.alive).sort((a,b)=>(a.i===G.me)-(b.i===G.me)||a.x-b.x);
  for(const r of rs)drawRunner(c,r,S);
  for(const p of G.parts){
    c.globalAlpha=Math.max(0,Math.min(1,p.t));c.fillStyle=p.c;c.beginPath();
    c.arc(p.x,p.y,p.k==='d'?p.r*(1.6-p.t*.6):p.r,0,6.3);c.fill();
  }
  c.globalAlpha=1;
}
/* ================= UI ================= */
const minis=[];
function toast(t){const e=$('tst');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function showScreen(id){for(const s of['home','pick','lob','room','res'])$(s).hidden=s!==id;$('bk').hidden=false;if(id==='pick')buildPicks()}
function hideGame(){['hud','bot','banner','cd'].forEach(i=>$(i).hidden=true)}
const stats=()=>jl('sr_stats')||{p:0,w:0};
function homeStat(){const t=stats();$('stat').textContent=t.p?`Victoires : ${t.w} / ${t.p} parties`:''}
function buildPicks(){
  const box=$('picks');box.innerHTML='';minis.length=0;
  COLS.forEach((col,i)=>{
    const b=document.createElement('button');b.className='pk'+(i===me?' on':'');
    const cv2=document.createElement('canvas');cv2.width=168;cv2.height=208;b.append(cv2,col.n);
    b.onclick=()=>{me=i;sv('sr_col',i);[...box.children].forEach((e,k)=>e.classList.toggle('on',k===i))};
    box.append(b);minis.push({cv:cv2,col:col.c,ph:i*1.3});
  });
}
let splKey='';
function ui(ev){
  if(HL)return;
  if(ev==='stage'){
    $('hud').hidden=false;$('bot').hidden=false;$('bk').hidden=true;$('home').hidden=true;$('res').hidden=true;
    $('stg').textContent=`Stage ${G.si+1} / ${NS}`;
    banner(G.si===NS-1?'🏁 Finale':`Stage ${G.si+1}`,TAG[G.si]);
    const t=$('trk');t.innerHTML='';G.runners.forEach(r=>{const e=document.createElement('i');e.style.background=r.col;e.style.left='0%';t.append(e)});
    const m=G.runners[G.me],manual=m&&m.hum&&!m.auto;
    $('hint').textContent=G.si===0?(manual?'Touche l\'écran pour sauter · maintiens 🛑 pour freiner':'Touche l\'écran pour faire sauter ta couleur'):'';
    $('info').textContent=G.net?'En ligne':(G.auto?'Pari auto':'Solo');
    splKey='';ui('spell');dots();
  }else if(ev==='go'){$('banner').hidden=true;$('cd').hidden=true;snd(660,.3,'triangle',.05,990);clearTimeout(ui.ht);ui.ht=setTimeout(()=>{$('hint').textContent=''},4500)}
  else if(ev==='between'){banner('Stage terminé',G.runners.filter(r=>r.alive).length+' survivants');snd(520,.2,'triangle',.05,780)}
  else if(ev==='win'){banner('Gagnant : '+G.winner.name.toUpperCase(),G.winner.i===G.me?'Bien joué ! 🎉':'');snd(523,.4,'triangle',.06,1046)}
  else if(ev==='over')showRes();
  else if(ev==='dots')dots();
  else if(ev==='spell'){
    const r=G.runners[G.me],b=$('spl');if(!r)return;
    const key=(r.spell||0)+':'+(r.alive?1:0);if(key===splKey)return;splKey=key;
    b.disabled=!r.spell||!r.alive;b.classList.toggle('rdy',!!r.spell&&r.alive);
    b.innerHTML=r.spell?`<span>${SPL[r.spell].ic}</span>${SPL[r.spell].n}`:'<span>✨</span>Sort';
  }
}
function banner(t,s){const b=$('banner');b.hidden=false;const t0=b.firstElementChild,s0=b.lastElementChild;t0.textContent=t;s0.textContent=s;s0.style.display=s.trim()?'':'none';
  t0.style.animation='none';s0.style.animation='none';void b.offsetWidth;t0.style.animation='';s0.style.animation=''}
function dots(){
  if(!G)return;const t=$('trk').children;
  G.runners.forEach((r,i)=>{const e=t[i];if(!e)return;const k=(r.alive?'':'x')+(r.i===G.me?' me':'');if(e.className!==k)e.className=k});
}
let lastCd=-1;
function hudFrame(){
  const t=$('trk').children;
  if(t.length){G.runners.forEach((r,i)=>{const e=t[i];if(!e)return;const p=Math.max(0,Math.min(1,(r.alive?r.x:r.dx||r.x)/G.stage.len)),v=(p*100).toFixed(1)+'%';if(e._l!==v){e.style.left=v;e._l=v}})}
  const m=G.runners[G.me];
  if(G.phase==='intro'){const n=Math.ceil(G.pt),lim=G.si===0?3:2;if(n>=1&&n<=lim){if(n!==lastCd){lastCd=n;const e=$('cd');e.hidden=false;e.textContent=n;e.style.animation='none';void e.offsetWidth;e.style.animation='';snd(400,.12,'square',.04)}}else $('cd').hidden=true}
  else lastCd=-1;
  if(m&&!m.alive&&G.phase==='run')$('info').textContent=G.net?'Éliminé · tu regardes':'Éliminé · tu regardes la suite';
  const manual=m&&m.hum&&!m.auto,vis=(manual&&m.alive)?'visible':'hidden';
  if($('brk').style.visibility!==vis)$('brk').style.visibility=$('spl').style.visibility=vis;
  ui('spell');
}
function showRes(){
  hideGame();$('res').hidden=false;$('bk').hidden=false;
  const w=G.winner,win=w.i===G.me,m=G.runners[G.me];
  $('rt').textContent=win?'Tu as gagné !':'Le gagnant est '+w.name;
  const c=$('rc').getContext('2d');c.clearRect(0,0,320,420);man(c,160,385,w.col,0,false,6,true,0,0);
  $('rs').textContent=win?'🎉 Dernier survivant !':(m&&m.hum?`Perdu... tu as été éliminé au stage ${m.dsi||NS}.`:`Ta couleur (${COLS[G.me].n}) n'a pas survécu.`);
  const box=$('rank');box.innerHTML='';
  (G.rank||[]).forEach((e,k)=>{const r=G.runners[e.i],d=document.createElement('div');d.className='rk'+(k===0?' w':'')+(e.i===G.me?' me':'');
    const dot=document.createElement('i');dot.style.background=r.col;d.append((k+1)+'. ',dot,document.createTextNode(r.name+(r.hum?'':' (bot)')));const sp=document.createElement('span');sp.textContent=k===0?'👑':'stage '+e.s;d.append(sp);box.append(d)});
  if(showRes.g!==G){showRes.g=G;const t=stats();t.p++;if(win)t.w++;sv('sr_stats',JSON.stringify(t))}
  const t=stats();$('stat2').textContent=`Victoires : ${t.w} / ${t.p}`;
  $('again').textContent=G.net&&!G.host?"Attends l'hôte":'Rejouer';$('again').disabled=G.net&&!G.host;
  $('chg').textContent=G.net?'Retour salon':'Menu';
  if(win)snd(659,.5,'triangle',.06,1318);
}
function startSolo(auto){
  showScreen('none');$('bk').hidden=true;
  initGame({seed:(Math.random()*2**31)|0,me,players:[],net:false,host:true,auto});
}
function lobRender(){
  if($('lob').hidden)return;
  $('err').textContent=NET.err||(NET.ok?'':'Connexion…');
  const box=$('rooms');box.innerHTML='';
  for(let n=1;n<=8;n++){
    const b=document.createElement('button');b.className='rm';b.type='button';const ms=NET.rooms[n]||[];
    b.append('Salle '+n);const sm=document.createElement('small');
    if(!ms.length)sm.textContent='libre';else{ms.slice(0,6).forEach((p,k)=>{const i=document.createElement('i');i.style.background=COLS[k].c;i.title=p.name;sm.append(i)});sm.append(' '+ms.length+'/6')}
    b.append(sm);b.onclick=()=>joinRoom(n);box.append(b);
  }
}
function joinRoom(n){
  const nm=$('nm').value.trim();if(nm.length<2){NET.err='Entre un pseudo (2 lettres min).';lobRender();return}
  sv('f7name',nm.slice(0,14));if(!NET.ok){NET.err='Pas connecté au serveur.';lobRender();return}
  send({k:'hi',uid,name:myName(),spec:{}});NET.room=n;NET.members=[];send({k:'join',room:n});showScreen('room');roomRender();

function roomRender(){
  if($('room').hidden)return;
  $('rtt').textContent='Salle '+NET.room;
  const box=$('mem');box.innerHTML='';
  NET.members.slice(0,6).forEach((p,k)=>{const d=document.createElement('div');d.className='mb';const i=document.createElement('i');i.style.background=COLS[k].c;d.append(i,document.createTextNode(p.name));if(k===0){const s=document.createElement('span');s.textContent='hôte';d.append(s)}box.append(d)});
  const host=NET.members[0]&&NET.members[0].id===uid;
  $('rGo').hidden=!host;$('rGo').disabled=NET.members.length<2;
  $('rsub').textContent=NET.members.length<2?"En attente d'un autre joueur… (les couleurs libres seront des bots)":(host?'Prêt ? Lance la partie !':"En attente de l'hôte…");
}
/* ================= entrées ================= */
function inJump(){
  if(!G||G.phase!=='run')return;const r=G.runners[G.me];if(!r||!r.alive)return;
  if(G.net&&!G.host)send({k:'st',d:{rid:G.rid,j:1}});else r.jq=1;
}
function inSpell(){
  if(!G||G.phase!=='run')return;const r=G.runners[G.me];if(!r||!r.alive||!r.spell)return;
  if(G.net&&!G.host){send({k:'st',d:{rid:G.rid,s:1}});r.spell=0}else r.spq=1;
}
function inBrake(v){
  if(!G)return;const r=G.runners[G.me];if(!r)return;
  if(G.net&&!G.host)send({k:'st',d:{rid:G.rid,b:v?1:0}});else r.brake=v;
  $('brk').classList.toggle('dn',v);
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();inJump()});
const brk=$('brk');brk.addEventListener('pointerdown',e=>{e.preventDefault();inBrake(true)});
['pointerup','pointercancel','pointerleave'].forEach(n=>brk.addEventListener(n,()=>inBrake(false)));
$('spl').addEventListener('pointerdown',e=>{e.preventDefault();inSpell()});
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();inJump()}
  else if(e.code==='ArrowDown'||e.code==='ShiftLeft'){e.preventDefault();inBrake(true)}
  else if(e.code==='KeyE'||e.code==='Enter'){inSpell()}
});
addEventListener('keyup',e=>{if(e.code==='ArrowDown'||e.code==='ShiftLeft')inBrake(false)});
$('fast').onclick=e=>{fast=!fast;e.currentTarget.classList.toggle('on',fast)};
$('hSolo').onclick=()=>showScreen('pick');
$('hNet').onclick=()=>{$('nm').value=ld('f7name','');showScreen('lob');connect();lobRender()};
$('pBack').onclick=()=>showScreen('home');
$('lBack').onclick=()=>showScreen('home');
$('go').onclick=()=>startSolo(false);$('bet').onclick=()=>startSolo(true);
$('rOut').onclick=()=>{send({k:'leave'});NET.room=0;NET.members=[];showScreen('lob');lobRender()};
$('rGo').onclick=()=>{if(NET.members.length>=2)send({k:'start'})};
$('again').onclick=()=>{if(G&&G.net){if(G.host)send({k:'start'})}else startSolo(G.auto)};
$('chg').onclick=()=>{if(G&&G.net){NET.inGame=false;G=null;showScreen('room');roomRender()}else{G=null;showScreen('home');homeStat()}};
/* ================= boucle ================= */
let last=0,acc=0;
function loop(t){
  const dt=Math.min(.1,(t-last)/1000||0);last=t;
  if(G&&G.stage){
    if(G.net&&!G.host){cstep(dt)}
    else if(G.phase!=='over'){
      let ts=(G.slowT>0?.4:1)*(fast?2:1);const m=G.runners[G.me];
      if(!G.net&&m&&!m.alive)ts*=3;
      acc+=dt*ts;while(acc>=1/60){step(1/60);acc-=1/60}
      G.slowT-=dt;
      if(G.net&&t-G.lastSnap>60){G.lastSnap=t;send({k:'st',d:snapshot()})}
    }else if(G.net&&t-G.lastSnap>200){G.lastSnap=t;send({k:'st',d:snapshot()})}
    update(dt);
  }
  draw();
  if(!$('pick').hidden){for(const m of minis){m.ph+=dt*9;const c=m.cv.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,168,208);c.setTransform(2,0,0,2,0,0);man(c,40,98,m.col,m.ph,false,1.6,false,0,0)}}
  requestAnimationFrame(loop);
}
/* simulateur (tests) : tous les coureurs en auto */
function simGame(seed){
  HL=true;initGame({seed,me:0,players:[],net:false,host:true,auto:true});G.runners.forEach(r=>{r.hum=true;r.auto=true});
  let n=0;while(G.phase!=='over'&&n++<300000)step(1/60);const o={w:G.winner.i,si:G.si,seed};HL=false;return o;
}
homeStat();requestAnimationFrame(loop);
window.__sr={simGame,get G(){return G},step,initGame,COLS,ST,startNet,get NET(){return NET}};
})();
